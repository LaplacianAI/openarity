apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain
  labels:
    app.kubernetes.io/name: brain
    app.kubernetes.io/part-of: openarity
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: brain
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: brain
        app.kubernetes.io/part-of: openarity
      annotations:
        # Roll the pods when the configuration changes. Without this a
        # ConfigMap edit is applied to nothing until something else restarts
        # them, and the running fleet quietly disagrees with the manifest.
        checksum/config: "replace-with-a-hash-of-configmap.yaml"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      # Migrations run before the container that serves traffic, and they run
      # in every pod. That is safe: `brain migrate up` takes a Postgres
      # advisory lock, so replicas starting together serialise rather than
      # racing. It also means a rollout cannot begin serving against a schema
      # it has not applied.
      initContainers:
        - name: migrate
          image: ghcr.io/laplacianai/openarity-brain:latest
          args: ["migrate", "up"]
          envFrom:
            - configMapRef:
                name: brain-config
            - secretRef:
                name: brain-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi

      containers:
        - name: brain
          image: ghcr.io/laplacianai/openarity-brain:latest
          ports:
            - name: api
              containerPort: 21120
            - name: webhook
              containerPort: 21121
          envFrom:
            - configMapRef:
                name: brain-config
            - secretRef:
                name: brain-secrets

          # Liveness never touches the database. If it did, a Postgres blip
          # would restart every pod at once and turn a recoverable outage into
          # a crash loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            periodSeconds: 10
            failureThreshold: 3

          # Readiness does check Postgres, so a pod that cannot reach it is
          # pulled from the Service and put back when it recovers.
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            periodSeconds: 5
            failureThreshold: 2

          # Startup covers the slow first connection without forcing the
          # liveness threshold to be generous forever.
          startupProbe:
            httpGet:
              path: /healthz
              port: api
            periodSeconds: 3
            failureThreshold: 20

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              # No CPU limit on purpose: throttling a latency-sensitive service
              # to save cycles it is not using costs tail latency for nothing.
              memory: 512Mi

      # The server drains in-flight requests on SIGTERM. Give it room to
      # finish rather than having Kubernetes escalate to SIGKILL mid-request.
      terminationGracePeriodSeconds: 30
