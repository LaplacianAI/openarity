# A template, not a secret. Do not commit a real value here. Create the real
# one out of band:
#
#   kubectl create secret generic sandboxd-secrets \
#     --from-literal=SANDBOXD_TOKEN="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The brain is given the same value as the token it sends to sandboxd.
apiVersion: v1
kind: Secret
metadata:
  name: sandboxd-secrets
  labels:
    app.kubernetes.io/name: sandboxd
    app.kubernetes.io/part-of: openarity
type: Opaque
stringData:
  SANDBOXD_TOKEN: "CHANGEME"
