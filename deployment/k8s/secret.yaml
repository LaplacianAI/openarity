# A template, not a secret. Do not commit real values here — this file exists
# so the key names are discoverable. Create the real one out of band:
#
#   kubectl create secret generic brain-secrets \
#     --from-literal=OPENARITY_POSTGRES_DSN='postgres://…' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Or point External Secrets or the Vault agent injector at it — the brain reads
# environment variables and does not care which of them produced these.
apiVersion: v1
kind: Secret
metadata:
  name: brain-secrets
  labels:
    app.kubernetes.io/name: brain
    app.kubernetes.io/part-of: openarity
type: Opaque
stringData:
  # The DSN carries the database password, which is why the whole string is a
  # secret rather than a ConfigMap entry with a secret password appended.
  OPENARITY_POSTGRES_DSN: "postgres://openarity:CHANGEME@postgres:5432/openarity?sslmode=require"

  # Leave empty in any real deployment. A dev token is a single shared
  # password for the entire API; OIDC is the supported path.
  OPENARITY_DEV_TOKEN: ""
