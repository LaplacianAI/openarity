# Non-secret settings. Anything holding a credential belongs in secret.yaml,
# because a ConfigMap is readable by anything that can list them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: brain-config
  labels:
    app.kubernetes.io/name: brain
    app.kubernetes.io/part-of: openarity
data:
  # The defaults bind to loopback, which nothing outside the pod can reach —
  # not even the kubelet running the probes.
  OPENARITY_API_BIND: "0.0.0.0:21120"
  OPENARITY_WEBHOOK_BIND: "0.0.0.0:21121"

  OPENARITY_ENVIRONMENT: "production"
  OPENARITY_LOG_LEVEL: "info"

  # Not used by the brain yet. They are here so the day a component starts
  # using one, this file is where it is configured rather than where it is
  # discovered to be missing.
  OPENARITY_FALKOR_DB_URL: "redis://falkordb:6379"
  OPENARITY_REDIS_URL: "redis://redis:6379"
  OPENARITY_VAULT_ADDR: "http://vault:8200"

  OPENARITY_OIDC_ENABLED: "true"
  OPENARITY_OIDC_AUDIENCE: "openarity"
  # OPENARITY_OIDC_ISSUER is deployment-specific; set it here.
  OPENARITY_OIDC_ISSUER: "https://example.okta.com"

  # The model that embeds agents, tools and skills for the graph, and the
  # width of its vectors. Set both or neither: with neither, the worker runs
  # no projector and says so at start. The index is built for one width, so
  # changing the model means `brain graph rebuild`.
  #
  # The key is a secret-store reference, path#key, never the key — which is
  # why it may live in a ConfigMap at all. The shipped OpenBao policy lets the
  # brain read under platform/ and nowhere else that is not a team's.
  #
  # OPENARITY_OMNI_ROUTE_URL is where the embedding is asked for: anything
  # answering OpenAI's /embeddings. Its default is localhost, which in a pod
  # is the pod.
  # OPENARITY_OMNI_ROUTE_URL: "http://model-gateway:4000/v1"
  # OPENARITY_EMBEDDING_MODEL: "text-embedding-3-small"
  # OPENARITY_EMBEDDING_DIMENSIONS: "1536"
  # OPENARITY_EMBEDDING_KEY_REF: "platform/embeddings#key"

  # Token subjects, not email addresses. A super admin bypasses every
  # team-scoped check, so this list is a privileged one — keep it short.
  OPENARITY_SUPER_ADMINS: ""
