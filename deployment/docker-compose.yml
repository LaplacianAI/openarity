# Local dependencies for developing the brain.
#
# This file runs what the brain talks to, not the brain itself — you want it
# rebuilding on save, not in a container. Ports match the defaults in
# internal/config, so `go run ./cmd/brain` needs no environment beyond a token.
#
#   docker compose -f deployment/docker-compose.yml up -d
#   cd apps/brain && go run ./cmd/brain migrate up
#
# To run the brain in a container as well:
#
#   docker compose -f deployment/docker-compose.yml --profile brain up -d --build

name: openarity

# Everything the brain reads that is not about listening. Hoisted so the
# worker cannot drift from the server: a setting added to one and not the
# other is silent — the worker keeps running and simply stops erasing
# whatever the missing setting pointed at.
#
# x- keys are ignored by compose; << merges the map into a service.
x-brain-env: &brain-env
  OPENARITY_POSTGRES_DSN: "postgres://postgres:postgres@postgres:5432/openarity?sslmode=disable"
  OPENARITY_FALKOR_DB_URL: "redis://falkordb:6379"
  OPENARITY_REDIS_URL: "redis://redis:6379"
  OPENARITY_SECRETS_ADDR: "http://openbao:8200"
  # static by default: compose's OpenBao runs in dev mode with no AppRole
  # configured, so there is nothing for the brain to authenticate with
  # until `make bao-approle` mints one. Set the backend and both halves of
  # the credential in .env together — naming openbao without them is a
  # startup failure, deliberately.
  #
  # static is refused outside development, so a staging or production
  # stack must set this. That is the point: it is the setting that decides
  # whether secrets survive a deploy.
  OPENARITY_SECRETS_BACKEND: ${OPENARITY_SECRETS_BACKEND:-static}
  OPENARITY_SECRETS_APPROLE_ID: ${OPENARITY_SECRETS_APPROLE_ID-}
  OPENARITY_SECRETS_APPROLE_SECRET: ${OPENARITY_SECRETS_APPROLE_SECRET-}
  # memory by default, and refused outside development for the same
  # reason. docker-compose.objects.yml brings a MinIO the brain reaches at
  # minio:9000 — inside the network, so the host port it is published on
  # does not matter here.
  #
  # The bucket and credentials are the same three variables MinIO itself
  # reads, so one pair of values configures both ends.
  OPENARITY_OBJECTS_BACKEND: ${OPENARITY_OBJECTS_BACKEND:-memory}
  OPENARITY_OBJECTS_ENDPOINT: ${OPENARITY_OBJECTS_ENDPOINT:-http://minio:9000}
  OPENARITY_OBJECTS_BUCKET: ${OBJECTS_BUCKET:-openarity}
  OPENARITY_OBJECTS_ACCESS_KEY: ${OBJECTS_ACCESS_KEY-}
  OPENARITY_OBJECTS_SECRET_KEY: ${OBJECTS_SECRET_KEY-}
  # development keeps this usable with no identity provider. Set it to
  # staging or production in .env and the dev token is refused outright,
  # so OIDC becomes mandatory rather than optional.
  OPENARITY_ENVIRONMENT: ${OPENARITY_ENVIRONMENT:-development}
  # A shared token by default, so the stack is usable with no identity
  # provider. Set these to point at a real one — see the README. The
  # single-dash form is deliberate: an empty OPENARITY_DEV_TOKEN must turn
  # the token off rather than fall back to the default.
  OPENARITY_DEV_TOKEN: ${OPENARITY_DEV_TOKEN-letmein}
  OPENARITY_SUPER_ADMINS: ${OPENARITY_SUPER_ADMINS-dev}
  OPENARITY_OIDC_ENABLED: ${OPENARITY_OIDC_ENABLED:-false}
  OPENARITY_OIDC_ISSUER: ${OPENARITY_OIDC_ISSUER-}
  OPENARITY_OIDC_AUDIENCE: ${OPENARITY_OIDC_AUDIENCE:-openarity}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openarity
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 stores data in a major-version subdirectory, so the volume
      # goes one level up. Mounting /var/lib/postgresql/data instead makes the
      # image refuse to start rather than silently using ephemeral storage.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # -U and -d are not optional: without them pg_isready checks the "root"
      # database as the "root" user and reports healthy while the real one is
      # still being created.
      test: ["CMD-SHELL", "pg_isready -U postgres -d openarity"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Not used by the brain yet. It is here so the ports in the configuration
  # table are real, and so the day the graph lands nobody has to find an image.
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${FALKORDB_PORT:-6380}:6379"
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Development mode: in-memory, unsealed, root token "dev-root". Every secret
  # written here is lost on restart, which is the point — nothing durable
  # should exist on a laptop.
  #
  # OpenBao rather than Vault: Vault is BUSL-1.1, source-available and not
  # OSI-licensed. OpenBao is the MPL-2.0 Linux Foundation fork and is API
  # compatible, down to the X-Vault-Token header.
  openbao:
    image: openbao/openbao:2.6.2
    environment:
      BAO_DEV_ROOT_TOKEN_ID: dev-root
      # The dev listener binds loopback inside the container, so without this
      # the port mapping reaches nothing.
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${OPENBAO_PORT:-8200}:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      # bao, not vault: the fork renamed the binary. Exit 0 unsealed, 2
      # sealed, 1 unreachable.
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migrations run to completion before the brain starts, which is the same
  # shape as the init container in k8s/deployment.yaml. Without it the service
  # comes up healthy against an empty schema and every route 500s.
  migrate:
    profiles: ["brain"]
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: ["migrate", "up"]
    environment:
      OPENARITY_POSTGRES_DSN: "postgres://postgres:postgres@postgres:5432/openarity?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Opt in with --profile brain. Everything else runs by default, because the
  # normal loop is dependencies in Docker and the brain on the host.
  brain:
    profiles: ["brain"]
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    environment:
      <<: *brain-env
      OPENARITY_API_BIND: "0.0.0.0:21120"
      OPENARITY_WEBHOOK_BIND: "0.0.0.0:21121"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-21120}:21120"
      - "${BIND_ADDR:-127.0.0.1}:${WEBHOOK_PORT:-21121}:21121"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # The clock. Nothing else in this file runs `brain reap`, so without this a
  # stack erases nothing outside Postgres — the rows go, the attachment bytes
  # and the vault keys stay.
  #
  # No ports: it serves nothing. One replica is not a constraint — the sweep
  # claims with FOR UPDATE SKIP LOCKED, so two would divide the work rather
  # than duplicate it — it is simply all this needs.
  #
  # restart: unless-stopped is the visible signal here. An overdue erasure
  # deliberately does not stop the worker starting, because refusing would
  # block the only thing that can clear it, so a rising restart count and the
  # ERROR line are what an operator has. A CronJob running `brain reap` gets a
  # failed Job instead, which is louder; see SCHEDULING.md.
  worker:
    profiles: ["brain"]
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: ["worker"]
    environment:
      <<: *brain-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  falkordb-data:
  redis-data:
