# MinIO as the object store for local development.
#
# The brain speaks the S3 API, which is a de-facto interface rather than a
# standard — there is no specification body and no conformance suite. This file
# is the reference shape, not a dependency: MinIO, Garage, Ceph, SeaweedFS,
# Cloudflare R2, Backblaze B2 and Google Cloud Storage (at
# https://storage.googleapis.com, with an HMAC key from its interoperability
# settings) all serve it. Swapping one for another changes five settings on the
# brain and nothing else.
#
# The brain uses whole-object put, get and delete and nothing more, which is
# the part every implementation actually serves. Multipart, ranged reads,
# lifecycle rules and presigned POST policies are where compatibility stops
# being reliable, and none of them are used.
#
#   cd deployment
#   docker compose -f docker-compose.yml -f docker-compose.objects.yml up -d
#
# Or `make objects`, which is the same thing spelled shorter.

name: openarity

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECTS_ACCESS_KEY:-openarity}
      MINIO_ROOT_PASSWORD: ${OBJECTS_SECRET_KEY:-openarity-dev-secret}
    ports:
      # 19000 and 19001 on the host, not MinIO's own 9000 and 9001: authentik
      # already takes 9000 in docker-compose.authentik.yml, and a stack that
      # cannot run two of its own overlays together is a trap. The 1-prefix
      # follows Postgres on 15432 and Redis on 16379.
      #
      # BIND_ADDR defaults to loopback, as everything else here does. A store
      # holding message attachments is not something to expose by forgetting.
      - "${BIND_ADDR:-127.0.0.1}:19000:9000"
      - "${BIND_ADDR:-127.0.0.1}:19001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # One-shot: create the bucket, then exit. The brain does not create buckets,
  # deliberately — that needs a credential allowed to administer the store, and
  # the brain's should only be able to read and write objects in one bucket.
  # Provisioning is an operator action, the same reasoning the OpenBao policy
  # follows.
  minio-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # MC_HOST_<alias> is how mc takes a target from the environment. The
      # image's entrypoint is mc itself, so `command:` here is a list of mc
      # arguments — reaching for a shell to run `mc alias set` first is what
      # made this fail in CI, where the entrypoint was not overridden.
      MC_HOST_local: http://${OBJECTS_ACCESS_KEY:-openarity}:${OBJECTS_SECRET_KEY:-openarity-dev-secret}@minio:9000
    command: mb --ignore-existing local/${OBJECTS_BUCKET:-openarity}
    restart: "no"

volumes:
  minio-data:
