<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 64" role="img" aria-label="openarity">
  <title>openarity</title>
  <!-- The openarity mark: a squircle O cut once on the diagonal into two
       agents, with a visor and two nodes on the cut - an agent that is a
       pair, and a graph edge between them. Written by assets/mark/build.py
       from geometry.py; edit those, not this file. See BRAND.md.

       The theme switch is inside the file, not currentColor: an SVG in an
       <img> is a separate document and inherits no colour, so currentColor
       renders black, and on GitHub in dark mode that is black on black. -->
  <style>
    .mark { fill: #0B6A5C; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #5FD3BC; }
    }
    .wordmark { fill: #2E3A3D; }
    @media (prefers-color-scheme: dark) {
      .wordmark { fill: #D9D3C7; }
    }
  </style>
  <mask id="oa-wordmark-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
    <rect x="8" y="8" width="48" height="48" rx="14.9" fill="#fff"/>
    <rect x="19" y="23.5" width="26" height="17" rx="3" fill="#000"/>
    <path d="M0 0L64 64" stroke="#000" stroke-width="3"/>
    <circle cx="17.7" cy="17.7" r="3.1" fill="#000"/>
    <circle cx="46.3" cy="46.3" r="3.1" fill="#000"/>
  </mask>
  <rect class="mark" width="64" height="64" mask="url(#oa-wordmark-cut)"/>
  <text class="wordmark" x="72" y="41"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="28" font-weight="600" letter-spacing="-0.5">openarity</text>
</svg>
