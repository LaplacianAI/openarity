# The documentation site: `make serve` previews it, `make build` writes public/.
#
# docs_dir is content/ so each page keeps the path, and so the URL, it had
# before the move to Zensical; site_dir is public/, which is what CI uploads.

[project]
site_name = "openarity"
site_description = "An agent platform whose authority comes from a graph, not a flat list of permissions."
site_url = "https://laplacianai.github.io/openarity/"
repo_url = "https://github.com/LaplacianAI/openarity"
repo_name = "LaplacianAI/openarity"
docs_dir = "content"
site_dir = "public"
extra_css = ["stylesheets/brand.css"]
nav = [
  { "Home" = "index.md" },
  { "Overview" = [
    "docs/index.md",
    "docs/get-started/index.md",
    "docs/get-started/docker.md",
  ] },
  { "Platform" = [
    "docs/platform/index.md",
    "docs/platform/quick-start.md",
    "docs/platform/configuration.md",
    "docs/platform/hub.md",
    "docs/platform/agents.md",
    "docs/platform/skills.md",
    "docs/platform/mcp-servers.md",
    "docs/platform/web.md",
    "docs/platform/dashboard.md",
  ] },
  { "Agent SDK" = [
    "docs/agent-sdk/index.md",
    "docs/agent-sdk/install.md",
    "docs/agent-sdk/patterns.md",
    "docs/agent-sdk/custom-patterns.md",
    "docs/agent-sdk/mcp.md",
    "docs/agent-sdk/tools-and-skills.md",
    "docs/agent-sdk/steering.md",
    "docs/agent-sdk/structured-output.md",
    "docs/agent-sdk/sessions.md",
    "docs/agent-sdk/examples.md",
  ] },
  { "Concepts" = [
    "docs/concepts/index.md",
    "docs/concepts/why-a-graph.md",
    "docs/concepts/the-harness.md",
    "docs/concepts/surfaces.md",
  ] },
  { "Reference" = [
    "docs/reference/index.md",
    "docs/reference/cli.md",
    "docs/reference/http-api.md",
  ] },
]

[project.theme]
language = "en"
custom_dir = "overrides"
logo = "assets/logo.svg"
favicon = "assets/favicon.svg"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

# Light first. Zensical 0.0.74 renders a first visit in the first palette listed
# and does not then switch to the one the reader's system prefers, so with dark
# first a light-mode reader got the dark site. Measured, both ways, in a browser.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true

# Every address the site answered before the move keeps answering: the old
# front-matter aliases, and Examples, which moved under the Agent SDK because
# its examples are the SDK's.
[project.plugins.redirects.redirect_maps]
"docs/surfaces.md" = "docs/concepts/surfaces.md"
"docs/the-harness.md" = "docs/concepts/the-harness.md"
"docs/why-a-graph.md" = "docs/concepts/why-a-graph.md"
"docs/install.md" = "docs/get-started/index.md"
"docs/install/docker.md" = "docs/get-started/docker.md"
"docs/examples/index.md" = "docs/agent-sdk/examples.md"
