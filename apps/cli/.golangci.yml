version: "2"

# Deliberately the same set as apps/brain. Two modules with two standards
# means every contributor learns which directory they are in before they can
# tell whether something is a real finding.

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # unclosed HTTP response bodies — leaks connections
    - errorlint # %w vs %v, errors.Is/As misuse
    - exhaustive # a new enum value must break every switch that ignores it
    - gocritic
    - gosec
    - misspell
    - nilerr # returning nil when err is non-nil
    - noctx # HTTP requests without a context
    - revive
    - unconvert
    - unparam

  settings:
    exhaustive:
      # a default: clause does NOT excuse a missing case — the point is that
      # adding an enum value breaks every switch that ignores it
      default-signifies-exhaustive: false

    errcheck:
      check-type-assertions: true

    revive:
      rules:
        # Initialisms keep one case: URL not Url, DSN not Dsn, API not Api.
        - name: var-naming
        - name: exported
          disabled: true # not a public library; doc comments not enforced yet

  exclusions:
    presets:
      - std-error-handling
    rules:
      # Test files may take shortcuts that production code may not.
      - path: _test\.go
        linters:
          - gosec
          - unparam
          # A test builds *http.Response literals to drive apiError. They
          # carry no body, so there is nothing to close and the finding is
          # about a response that was never fetched.
          - bodyclose

      # Generated by oapi-codegen from the brain's spec. Nothing here is
      # written by hand, so a finding cannot be acted on — the fix would be
      # overwritten by the next `make generate`.
      - path: internal/client/client\.gen\.go
        linters:
          - bodyclose
          - errcheck
          - gocritic
          - gosec
          - revive
          - unparam

formatters:
  enable:
    - gofumpt # stricter gofmt
    - gci # deterministic import grouping and order
  settings:
    gofumpt:
      extra-rules: true
    gci:
      sections:
        - standard # stdlib
        - default # third party
        - prefix(github.com/LaplacianAI/openarity) # our own
  exclusions:
    generated: lax
