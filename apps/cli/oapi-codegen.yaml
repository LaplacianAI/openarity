# The CLI never hand-writes a request or a response type. Both come from the
# brain's own contract, so a change there is a compile error here rather than
# a bug a user finds.
#
#   make generate        regenerate from ../brain/api/openapi.yaml
#   make generate-check  fail if the committed output is stale — CI runs this
package: client
output: internal/client/client.gen.go

generate:
  # The wire types, from components/schemas.
  models: true
  # Both client shapes: the raw one returning *http.Response, and the
  # WithResponse variants that parse a body per status code. Commands use the
  # second — the CLI has to branch on 403 versus 404 to say anything useful.
  client: true

output-options:
  # Initialisms keep one case, the same rule the hand-written code follows:
  # UserID and ClientID, not UserId and ClientId. Without this the generated
  # names are the one place in the repository that breaks revive's var-naming,
  # and every call site inherits the wrong spelling.
  name-normalizer: ToCamelCaseWithInitialisms
  # `oa <anything> -o yaml` renders these types, and yaml.v3 does not read
  # json tags: without this it falls back to lowercasing the Go field name and
  # ignores omitempty. UserID became `userid` where json says `user_id`, and
  # an absent email printed as `email: null` where json omitted it — the two
  # formats of one command disagreeing about both the name and the field.
  #
  # The generated yaml tag mirrors the json field name and its omitempty, so
  # the two stay identical as the spec grows.
  yaml-tags: true
