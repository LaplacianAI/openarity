version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # unclosed HTTP response bodies — leaks connections
    - depguard # package boundaries: talk through contracts, not internals
    - errorlint # %w vs %v, errors.Is/As misuse
    - exhaustive # a new enum value must break every switch that ignores it
    - gocritic
    - gosec
    - misspell
    - nilerr # returning nil when err is non-nil
    - noctx # HTTP requests without a context
    - revive
    - unconvert
    - unparam

  settings:
    # HLD "four rules" rule 1, mechanically enforced: packages talk only
    # through internal/contracts. Every rule here lists what a package MAY
    # import; anything else in the module is denied. cmd/brain is the
    # composition root and stays exempt — it is the one place that knows how
    # everything wires together. In depguard every matching rule applies, so
    # the internal-default catch-all must exclude every package that has its
    # own rule.
    depguard:
      rules:
        contracts:
          files: ["**/internal/contracts/**"]
          allow: [$gostd]
        secrets:
          files: ["**/internal/secrets/**"]
          allow: [$gostd]
        gateway:
          files: ["**/internal/gateway/**"]
          allow:
            - $gostd
            - github.com/LaplacianAI/openarity/apps/brain/internal/contracts
            # gateway → secrets is sanctioned: HLD §Secrets rule 2 — the one
            # secrets.Store seam, fetched by path, never a value from config.
            - github.com/LaplacianAI/openarity/apps/brain/internal/secrets
        server:
          files: ["**/internal/server/**"]
          allow:
            - $gostd
            - github.com/LaplacianAI/openarity/apps/brain/internal/config
            - github.com/LaplacianAI/openarity/apps/brain/internal/middleware
            # Deps carries the auth.Verifier the API listener authenticates
            # with; the tests fake a Principal and a User, which needs uuid.
            - github.com/LaplacianAI/openarity/apps/brain/internal/auth
            - github.com/google/uuid
        config:
          files: ["**/internal/config/**"]
          allow:
            - $gostd
            - github.com/caarlos0/env/v11
        middleware:
          files: ["**/internal/middleware/**"]
          allow:
            - $gostd
            # Authenticate needs the Verifier and the Principal it puts on the
            # context; auth owns both and imports nothing of ours back.
            - github.com/LaplacianAI/openarity/apps/brain/internal/auth
            # A black-box test (package middleware_test) imports the package
            # it tests. depguard has no "self" token, so it is listed.
            - github.com/LaplacianAI/openarity/apps/brain/internal/middleware
            - github.com/google/uuid # identity tests fake a resolved User
        auth:
          files: ["**/internal/auth/**"]
          allow:
            - $gostd
            - github.com/coreos/go-oidc/v3/oidc
            - github.com/google/uuid # User.ID
        authz:
          files: ["**/internal/authz/**"]
          allow:
            - $gostd
            # Can takes the auth.User the middleware resolved.
            - github.com/LaplacianAI/openarity/apps/brain/internal/auth
            - github.com/google/uuid
        api:
          files: ["**/internal/api/**"]
          allow:
            - $gostd
            # Domain packages use the shared Router/response helpers, and a
            # black-box test imports the package it tests — no "self" token.
            - github.com/LaplacianAI/openarity/apps/brain/internal/api
            # docs serves the committed OpenAPI spec.
            - github.com/LaplacianAI/openarity/apps/brain/api
            # Handlers read the resolved user and call the authorizer.
            - github.com/LaplacianAI/openarity/apps/brain/internal/auth
            - github.com/LaplacianAI/openarity/apps/brain/internal/authz
            # sqlc-generated types are the store's wire currency for now.
            - github.com/LaplacianAI/openarity/apps/brain/internal/store/db
            - github.com/google/uuid
            - github.com/jackc/pgx/v5
        store:
          files: ["**/internal/store/**"]
          allow:
            - $gostd
            - github.com/LaplacianAI/openarity/apps/brain/internal/store/db
            # Resolve turns an auth.Principal into an auth.User; the role
            # tests pin the seeded roles against authz's action vocabulary.
            - github.com/LaplacianAI/openarity/apps/brain/internal/auth
            - github.com/LaplacianAI/openarity/apps/brain/internal/authz
            - github.com/google/uuid
            - github.com/jackc/pgx/v5
            - github.com/pressly/goose/v3
        internal-default:
          files:
            - "**/internal/**"
            - "!**/internal/contracts/**"
            - "!**/internal/secrets/**"
            - "!**/internal/gateway/**"
            - "!**/internal/server/**"
            - "!**/internal/config/**"
            - "!**/internal/middleware/**"
            - "!**/internal/auth/**"
            - "!**/internal/authz/**"
            - "!**/internal/api/**"
            - "!**/internal/store/**"
          allow: [$gostd]

    exhaustive:
      # a default: clause does NOT excuse a missing case — the point is that
      # adding an enum value breaks every switch that ignores it
      default-signifies-exhaustive: false

    errcheck:
      check-type-assertions: true

    revive:
      rules:
        # Initialisms keep one case: URL not Url, DSN not Dsn, API not Api.
        - name: var-naming
        - name: exported
          disabled: true # not a public library; doc comments not enforced yet

  exclusions:
    presets:
      - std-error-handling
    rules:
      # Test files may take shortcuts that production code may not.
      - path: _test\.go
        linters:
          - gosec
          - unparam

formatters:
  enable:
    - gofumpt # stricter gofmt
    - gci # deterministic import grouping and order
  settings:
    gofumpt:
      extra-rules: true
    gci:
      sections:
        - standard # stdlib
        - default # third party
        - prefix(github.com/LaplacianAI/openarity) # our own
