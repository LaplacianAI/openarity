version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # unclosed HTTP response bodies — leaks connections
    - depguard # the packages the routes stand on import no route
    - errorlint # %w vs %v, errors.Is/As misuse
    - exhaustive # a new enum value must break every switch that ignores it
    - gocritic
    - gosec
    - misspell
    - nilerr # returning nil when err is non-nil
    - noctx # HTTP requests without a context
    - revive
    - unconvert
    - unparam

  settings:
    exhaustive:
      # a default: clause does NOT excuse a missing case — the point is that
      # adding an enum value breaks every switch that ignores it
      default-signifies-exhaustive: false

    depguard:
      rules:
        # The rules a harness is held to, and the improver that proposes
        # changes to it, sit below the routes (#277): a handler change must
        # not reach a background job. Each package is listed, so none can
        # reach internal/api through another.
        below-api:
          files:
            - "**/internal/harness/**"
            - "**/internal/proposals/**"
            - "**/internal/improve/**"
          deny:
            - pkg: github.com/LaplacianAI/openarity/apps/brain/internal/api
              desc: harness, proposals and improve sit below the routes; move what is needed below internal/api

    errcheck:
      check-type-assertions: true

    revive:
      rules:
        # Initialisms keep one case: URL not Url, DSN not Dsn, API not Api.
        - name: var-naming
        - name: exported
          disabled: true # not a public library; doc comments not enforced yet

  exclusions:
    presets:
      - std-error-handling
    rules:
      # Test files may take shortcuts that production code may not.
      - path: _test\.go
        linters:
          - gosec
          - unparam

formatters:
  enable:
    - gofumpt # stricter gofmt
    - gci # deterministic import grouping and order
  settings:
    gofumpt:
      # What extra-rules meant before it was split: adjacent parameters of
      # one type share it. clothe-returns, the other half, is not taken up.
      extra:
        group-params: true
    gci:
      sections:
        - standard # stdlib
        - default # third party
        - prefix(github.com/LaplacianAI/openarity) # our own
