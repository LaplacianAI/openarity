openapi: 3.1.0

info:
  title: Openarity brain
  version: 0.1.0
  description: |
    The brain's HTTP API.

    This document is the contract between the service and everything that
    talks to it, including the CLI. It is hand-written and reviewed as a diff:
    a change here is a change to what callers may rely on.

    A test compares the routes the service registers against the paths below.
    Adding an endpoint without describing it here fails the build.

    **Errors are `text/plain`, not JSON.** Successful responses are JSON;
    failures carry a short sentence and nothing machine-readable. Clients
    should branch on the status code, never on the body.
  license:
    name: MIT
    url: https://github.com/LaplacianAI/openarity/blob/main/LICENSE

servers:
  - url: http://127.0.0.1:21120
    description: The API listener, OPENARITY_API_BIND

tags:
  - name: probes
    description: Unauthenticated, for orchestrators
  - name: discovery
    description: How to authenticate, readable before you can
  - name: identity
    description: Who the caller is
  - name: teams
    description: Teams and their membership
  - name: channels
    description: Where a team's messages arrive from
  - name: skills
    description: Instructions an agent loads when a task calls for them
  - name: agents
    description: The agents a team defines, and the servers and skills each is granted
  - name: mcp-servers
    description: The MCP servers a team's agents may be granted, and the tools each offers
  - name: blueprints
    description: A team's agents, skills and MCP servers described in one document, planned and applied
  - name: graph
    description: A team's agents, tools and skills as the graph index holds them
  - name: sessions
    description: Conversations, and what was said in them
  - name: runs
    description: An agent working on one input, and what it did as it went
  - name: users
    description: Finding a user's id
  - name: settings
    description: A team's model, web search, self-improvement and compaction
  - name: approvals
    description: What agents ask a person before acting, and when they ask
  - name: improvements
    description: Changes a team's agents propose to their own harness, and a person's decision on each

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [probes]
      summary: Liveness
      description: |
        Answers as long as the process is running. It never touches the
        database, so a Postgres outage must not restart the pod.
      security: []
      responses:
        "200":
          description: The process is up
          content:
            text/plain:
              schema:
                type: string
                examples: ["ok"]

  /readyz:
    get:
      operationId: getReady
      tags: [probes]
      summary: Readiness
      description: |
        Pings Postgres. The body never names the underlying error; the reason
        is logged instead.
      security: []
      responses:
        "200":
          description: Ready to serve
          content:
            text/plain:
              schema:
                type: string
                examples: ["ready"]
        "503":
          description: A dependency is unreachable
          content:
            text/plain:
              schema:
                type: string
                examples: ["not ready"]

  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [discovery]
      summary: How to obtain a token
      description: |
        Unauthenticated, because a client holding no credential has to start
        somewhere. It reports which flow this deployment accepts and the
        parameters that flow needs, so a client is configured with one address
        rather than with a copy of the service's own settings.

        It carries no secret. The issuer and client id are public by OAuth's
        design for a public client, and the development token is reported as
        accepted, never as a value.
      security: []
      responses:
        "200":
          description: How to authenticate here
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"

  /oauth/mcp/callback:
    get:
      operationId: mcpOAuthCallback
      tags: [mcp-servers]
      summary: Where an MCP server's sign-in comes back
      description: |
        Unauthenticated: an authorization server sends the person's browser
        here, with no credential of its own. The `state` is the only proof,
        taken once and valid for ten minutes. The code is exchanged with a
        PKCE verifier only the brain holds, the tokens are kept in the secret
        store, and the server's tools are discovered with them.

        Always answers 303 to `<PUBLIC_URL>/ui/servers`, never anywhere the
        request names, with `oauth` set to `connected`, `connected-no-tools`
        (signed in, and the tools could not be listed), `expired`, `denied`,
        `refused` or `failed`, and `server` once the sign-in is known.
      security: []
      parameters:
        - {name: state, in: query, schema: {type: string}}
        - {name: code, in: query, schema: {type: string}}
        - {name: iss, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        "303":
          description: Back to the dashboard, with the outcome

  /whoami:
    get:
      operationId: getWhoami
      tags: [identity]
      summary: The authenticated caller
      description: |
        Resolves the token to a user, creating the row on first sight, and
        returns their team memberships.

        The id is the caller's own, so publishing it discloses nothing they
        did not already send. It is what someone pastes into a request to be
        added to a team.
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whoami"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List teams
      description: |
        A super admin sees every team, paged. Everyone else sees the teams
        they belong to, with their role in each, in a single page with no
        cursor — a person's own memberships are bounded.

        Deleted teams are left out. A super admin asks for them with
        `deleted=true`, which lists only deleted teams, each with the date it
        is purged; from anyone else the parameter is ignored.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: deleted
          in: query
          required: false
          description: List only deleted teams. Super admins only; ignored otherwise.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: A page of teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team
      description: |
        Super admins only. Creating a team is platform-scoped, so there is no
        team to check a role against.

        The new team has no members. A super admin adds the first one, who is
        then able to manage the rest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: The team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A team already has that name
          content:
            text/plain:
              schema:
                type: string
                examples: ["a team with that name already exists"]

  /teams/{id}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: getTeam
      tags: [teams]
      summary: Read one team
      description: |
        Members and super admins only. A team the caller may not see and a
        team that does not exist answer identically — a 403 would confirm the
        id is real.

        A deleted team is 404 for its members. A super admin still reads it,
        with `deleted_at` and `purge_at` set.
      responses:
        "200":
          description: The team, carrying the caller's role if they are a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team
      description: |
        Super admins only. The team is hidden and stopped at once: its members
        no longer see it, its channels refuse webhooks, and no run can start
        in it. Nothing is erased until `purge_at`, which is
        `TEAM_PURGE_AFTER` (a week by default) after the delete; until then
        `POST /teams/{id}/restore` brings it back whole.

        Refused while a run in the team is queued or running: a delete does
        not cancel work. Deleting a deleted team answers 204 and does not
        move its purge date, so repeating the call cannot postpone an erasure.
      responses:
        "204":
          description: Deleted, or already deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A run in the team is queued or running
          content:
            text/plain:
              schema:
                type: string
                examples: ["the team has runs in progress"]

  /teams/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    post:
      operationId: restoreTeam
      tags: [teams]
      summary: Restore a deleted team
      description: |
        Super admins only. Everything comes back as it was — members,
        channels, sessions, settings, grants — because nothing was removed.
        Restoring a team that is not deleted answers 200 and changes nothing.

        A deleted team's name is free for a new team at once, so the restore
        is refused for as long as a live team holds it. A purged team is
        gone and answers 404.
      responses:
        "200":
          description: The team, live again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A live team now has this team's name
          content:
            text/plain:
              schema:
                type: string
                examples: ["a team with that name already exists"]

  /teams/{id}/permissions:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: getTeamPermissions
      tags: [teams]
      summary: What the caller may do in a team
      description: |
        The permissions the caller holds in this team, from their role, so
        a client can offer only the actions the brain will allow. Advice,
        not authority: every route still checks for itself.

        Requires only membership. A super admin may do everything in every
        team whatever `actions` lists, and `super_admin` says so; a client
        treats it as holding every permission.
      responses:
        "200":
          description: The caller's permissions in the team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamPermissions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/members:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listTeamMembers
      tags: [teams]
      summary: List a team's members
      description: |
        A read, so seeing the team is enough — no action is required.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: addTeamMember
      tags: [teams]
      summary: Add a member
      description: |
        Requires `membership:write` in this team, and nothing else — naming
        somebody by `subject` deliberately does not require permission to read
        the directory, because "add the person I can name" is a smaller
        authority than "show me everyone".

        The role is checked by the database rather than the service: roles are
        rows, so an unknown one is a rejected foreign key and comes back as a
        400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "204":
          description: Added
        "400":
          description: |
            The body is malformed, names a user or role that does not exist,
            or carries neither `user_id` nor `subject` — or both.
          content:
            text/plain:
              schema:
                type: string
                examples: ["unknown role"]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            No such team, or none the caller may see. A `subject` nobody has
            is a 404 too: the caller named a person, and there is no person.
          content:
            text/plain:
              schema:
                type: string
                examples: ["no user has that subject"]
        "409":
          description: |
            Already a member, or the `subject` matched more than one person.

            The second needs no federation, which an earlier version of this
            description got wrong. A user row is keyed on `(issuer, subject)`
            and rows accumulate, so one provider whose issuer URL changed —
            moved behind a tunnel, addressed by IP rather than by name — leaves
            the same person behind under both. Observed in a single-provider
            deployment.

            The reply names the issuer beside each id, because the id alone
            gives no basis to choose and the wrong choice grants a role to an
            identity nobody can authenticate as.
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "already a member"
                  - "2 users have that subject — retry with user_id:
                     47c93149-6e9e-49ea-a9f6-34011f1e1e04 (https://auth.example.com/),
                     e096f85a-a05b-4699-919a-e0c5c5b57072 (https://auth.internal/)"

  /teams/{id}/members/{userID}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: userID
        in: path
        required: true
        description: The member
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateTeamMember
      tags: [teams]
      summary: Change a member's role, or a channel user's name
      description: |
        Requires `membership:write` in this team. The change is in place: the
        member keeps every sender that speaks as them. The team's last admin
        keeps their role (409), so a team is never left with nobody who can
        manage it. A name may be set on a channel user only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "204":
          description: Changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The member is the team's last admin
    delete:
      operationId: removeTeamMember
      tags: [teams]
      summary: Remove a member
      description: |
        Requires `membership:write` in this team. Removing someone who is not a
        member succeeds: the caller asked for a state, and that state holds.
        A channel user, who exists for this team alone, is deleted.
      responses:
        "204":
          description: No longer a member
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /teams/{id}/channels:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listChannels
      tags: [channels]
      summary: List a team's channels
      description: |
        A read, so belonging to the team is enough. A channel id is not a
        secret — it is the routing key in that channel's own hook URL, and
        every member needs to know which channels exist.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of channels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: createChannel
      tags: [channels]
      summary: Connect a channel
      description: |
        Requires `channel:write` in this team.

        `provider` must name an adapter this build has. Refusing an unknown
        one here makes it a 400 now rather than a 404 on every webhook later,
        when nobody is watching.

        The signing secret is written to the secret store and never to
        Postgres, and no endpoint ever returns it again. Supply one when the
        provider issues it — Slack's Signing Secret, Meta's App Secret — and
        omit it otherwise: the server then generates one and echoes it in this
        response only, which is the last time anyone sees it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
      responses:
        "201":
          description: |
            Connected. `signing_secret` is present only when the server
            generated it. Store it now; it cannot be read back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedChannel"
        "400":
          description: |
            The body is malformed, the name is empty or over 200 characters,
            `provider` names no adapter, `signing_secret` was supplied blank
            or left out for a provider that issues its own (`slack`),
            `reply_url` is refused (see `updateChannel`), a credential the
            provider asks for is missing or one it does not ask for is
            given, or the provider refused the credentials (Telegram or
            Slack does not know the bot token).
          content:
            text/plain:
              schema:
                type: string
                examples: ["unknown provider", "the bot token is not one Telegram knows"]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The team already has a channel with that name
          content:
            text/plain:
              schema:
                type: string
                examples: ["a channel with that name already exists"]
        "502":
          description: |
            The provider could not be reached to check the credentials, or
            to be pointed at the channel, or it would not post to the
            channel's address (Telegram's own reason follows). The channel
            was not created; nothing of it is left. Try again.
          content:
            text/plain:
              schema:
                type: string
                examples: ["could not reach telegram to check the credentials; try again"]
        "503":
          description: |
            The secret store is unreachable, so the channel was not created.
            A row whose secret is missing would refuse every webhook with no
            explanation, so it is rolled back rather than left behind.
          content:
            text/plain:
              schema:
                type: string
                examples: ["the secret store is unavailable"]

  /teams/{id}/channels/{channelID}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: channelID
        in: path
        required: true
        description: The channel
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateChannel
      tags: [channels]
      summary: Change a channel's reply URL, its notices to strangers, its reply mode, where it answers or its trigger word
      description: |
        Requires `channel:write` in this team. Send any of `reply_url`,
        `notify_strangers`, `reply_mode`, `answers_in` and `trigger_word`;
        what is not sent is left as it is.

        `trigger_word` sets the word a message must hold to ask the channel
        (see `TriggerWord`), and `""` takes it away. It is refused with 400
        on a channel whose `can_trigger_word` is false, and for a word that
        is not one word.

        `answers_in` is where the channel answers (see `AnswersIn`); a value
        outside its three is refused with 400.

        `reply_mode` is what the conversation is sent while a run works
        (see `Channel`). It is refused with 400 on a channel whose provider
        sends no steps (`can_show_events` false), the dashboard's among them.

        `notify_strangers` switches the notices a sender nobody has let in
        gets (see `Channel`). It is refused with 400 on a channel whose
        provider sends none (`can_notify` false).

        `reply_url`: a URL sets it, `null` or `""` clears it, and a reply
        waiting to be sent to a channel with none fails rather than waiting
        for one.

        The URL must be http or https with a host, and carry no credentials,
        query or fragment: every member can read it, and the receiver
        authenticates a reply by its signature. A literal private, loopback or
        link-local address is refused here, and a name resolving to one is
        refused when the reply is sent.

        A reply is a POST of `{"id", "session": {"ref", "kind"},
        "in_reply_to", "kind", "text"}`, signed as a webhook is, with
        `X-Openarity-Timestamp` and `X-Openarity-Signature`, the HMAC-SHA256
        taken over `reply:v1:<timestamp>:<body>`. Any 2xx is delivered;
        anything else is retried for about two and a half hours. A reply can
        arrive twice; drop a repeat by `id`.

        With `reply_mode` `events`, each step of a run is a reply too, of
        `kind` `event`, before the answer and with no `in_reply_to`. Its `id`
        is the run's and the step's, `<run id>:<n>`, and it is tried twice,
        so a broken step never holds the answer back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          description: |
            The body is malformed or names nothing to change, the URL is
            refused, the channel's provider sends no replies, it sends no
            notices and `notify_strangers` was sent, it sends no steps and
            `reply_mode` was sent, or `reply_mode` is neither `final` nor
            `events`.
          content:
            text/plain:
              schema:
                type: string
                examples: ["reply_url must not have a query or a fragment; the signature is what authenticates a reply"]
        "409":
          description: |
            `trigger_word` would leave a shared number with a channel that
            answers everything, or with two words one message could hold.
          content:
            text/plain:
              schema:
                type: string
                examples: ["this channel's number is linked to shrijeeth-personal too, so it needs a trigger word: each channel answers only messages that hold its word"]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteChannel
      tags: [channels]
      summary: Disconnect a channel
      description: |
        Requires `channel:write` in this team. Its signing secret is deleted
        with it — Postgres cascades do not reach the secret store.

        A `telegram` channel's bot is told to stop posting (deleteWebhook)
        first. That is best effort: Telegram refusing or out of reach never
        keeps the channel.

        A channel belonging to another team answers 404, not 403: the caller
        was authorised for the team they named, not for a channel they only
        guessed the id of, and confirming the id exists would let anyone walk
        the uuid space.
      responses:
        "204":
          description: Disconnected
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/channels/{channelID}/pairing:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: channelID
        in: path
        required: true
        description: The channel
        schema:
          type: string
          format: uuid
    post:
      operationId: pairChannel
      tags: [channels]
      summary: Link a WhatsApp number to the channel
      description: |
        Requires `channel:write` in this team. Only for a channel whose
        `can_pair` is true; any other is refused with 400.

        `qr` shows a QR code to scan from WhatsApp on the phone (Settings,
        Linked devices, Link a device). `code` asks WhatsApp for a code for
        `phone`, the number with its country code, entered on that phone
        instead ("Link with phone number").

        The `brain whatsapp` role holding the channel takes the request
        within about 15 seconds and writes what to show. Poll `GET` every
        few seconds: a QR changes about every 20 seconds, a code lasts about
        three minutes, and `state` becomes `connected` with the `phone`
        once it is linked, or `unpaired` with an `error` saying why it
        stopped. `held` false means no role is running to take it.

        Pairing a channel already linked replaces its number: the device
        linked before is logged out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairChannelRequest"
      responses:
        "202":
          description: Asked for; what the pairing shows now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelPairing"
        "400":
          description: |
            The body is malformed, `method` is neither `qr` nor `code`,
            `phone` is missing for `code`, sent for `qr` or not a number with
            its country code, or the channel is not linked by pairing.
          content:
            text/plain:
              schema:
                type: string
                examples: ["phone must be a number with its country code, 7 to 15 digits, such as +91 98765 43210"]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      operationId: getChannelPairing
      tags: [channels]
      summary: What linking the channel's number shows
      description: |
        Requires `channel:write` in this team, not `channel:read`: the QR or
        code is what lets a phone link the channel, and whoever links it
        makes the bot their number. Only for a channel whose `can_pair` is
        true.
      responses:
        "200":
          description: The pairing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelPairing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/senders/pending:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listTeamPendingSenders
      tags: [channels]
      summary: List senders waiting on any of the team's channels
      description: |
        Every channel's queue as one list, oldest first: the sender who has
        waited longest comes first, whichever channel they wrote in on. Each
        item is the channel's own pending sender, with the channel it waits
        on.

        Requires `channel:read` in this team, as each channel's queue does,
        and for the same reason: `sender_name` is text a stranger chose.
        Render it as data.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of pending senders, first seen first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamPendingSenderPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/channels/{channelID}/senders/pending:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/ChannelID"
    get:
      operationId: listPendingSenders
      tags: [channels]
      summary: List senders waiting to be approved
      description: |
        Requires `channel:read` in this team. The queue holds text a
        stranger chose, so it goes only to those who can act on it: every
        role the brain ships with `channel:read` also holds `sender:approve`.

        A sender the brain has never linked to a user has their provider-side
        id and display name recorded here, bounded to 50 per channel, and
        their message is dropped. Nothing they wrote is stored.

        `sender_name` is attacker-controlled on every platform: it is whatever
        the person typed into their profile. Control characters are stripped
        and it is clipped to 64 characters on the way in, but it is still
        theirs. Render it as data.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of pending senders, most recently first seen first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingSenderPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/channels/{channelID}/senders:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/ChannelID"
    get:
      operationId: listChannelSenders
      tags: [channels]
      summary: List approved senders
      description: |
        Requires `channel:read` in this team. Who may speak to the agent
        through this channel, and as whom.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of approved senders, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelSenderPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: approveChannelSender
      tags: [channels]
      summary: Approve a sender
      description: |
        Requires `sender:approve` in this team, which `admin` and `approver`
        hold. Links a provider-side sender to a user and takes them out of the
        pending queue, in one statement.

        This is what lets somebody instruct an agent as a named user, so it
        takes a permission of its own rather than one every member holds. It
        is apart from `channel:write`, so an approver can let people in
        without being able to rewire the channel or its signing secret.
        `user_id` must already be a member of this team — otherwise approving
        would be a way to give somebody a voice in a team they do not belong
        to, needing only `sender:approve` rather than `membership:write`.

        The caller must also hold every permission `user_id` holds in this
        team, and every permission of whoever the ref is bound to now, when
        that is somebody else: an approver may let a stranger speak as a
        member or an approver, never as an admin, and may not take an admin's
        binding. Otherwise 403.

        A `sender_ref` that was never pending is accepted: an admin who
        already knows a provider id may link it before its owner has spoken.

        Approving somebody already approved moves them to the new user, so
        correcting a mistake is one call rather than a remove and an add.

        In place of `user_id`, `new` lets the sender in as someone new: a user
        of their own that nobody logs in as, added to this team with
        `new.role`, and named `new.name`, else the name they gave while
        waiting, else their ref. The caller must hold every permission of
        that role, and cover whoever the ref is bound to now. Approving the
        same sender as someone new again finds the same user. A channel user
        left speaking as no sender, because their sender moved to someone
        else or was removed, is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveSenderRequest"
      responses:
        "204":
          description: Approved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The sender's binding changed between the check and the write
          content:
            text/plain:
              schema:
                type: string
                examples: ["the sender's binding changed while this was being decided; look again and retry"]
    delete:
      operationId: removeChannelSender
      tags: [channels]
      summary: Remove a sender, or dismiss a pending one
      description: |
        Requires `sender:approve` in this team, and every permission the user
        the ref is bound to holds, if it is bound to a member of the team:
        removing a binding cuts its user off from the channel. Otherwise 403.
        Clears both the approval and
        any pending row for that ref, because the caller cannot always tell
        which they are looking at and the wrong guess leaves one behind.

        Not a block. Their next message queues them again, which is what makes
        a mistaken removal recoverable — and what makes removal alone
        ineffective against somebody persistent.

        Removing a ref that was never linked is 204, not 404: the caller asked
        for a state and that state holds, and a 404 would let an admin probe
        which provider ids are linked one request at a time.

        The ref is a query parameter rather than a path segment because it is
        provider-controlled text. A ref of `.` or `..` in a path is rewritten
        by the router before any handler runs, and the standard path-escaping
        functions leave dots alone — so such a sender could never be removed.
      parameters:
        - name: ref
          in: query
          required: true
          description: The provider-side sender id, exactly as it was recorded
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The sender's binding changed between the check and the write
          content:
            text/plain:
              schema:
                type: string
                examples: ["the sender's binding changed while this was being decided; look again and retry"]

  /teams/{id}/channels/{channelID}/sessions:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/ChannelID"
    get:
      operationId: listChannelSessions
      tags: [sessions]
      summary: List a channel's conversations
      description: |
        Membership in the team is what reaches this route, and what it
        returns depends on who is asking. A `group` or `thread` session is
        the team's — it is the conversation they are already having in the
        provider. A `direct` session is one person's, and appears only for
        them or for a caller holding `session:read_all`.

        Hidden means absent, not redacted: nothing here says how many
        conversations were left out.

        Most recently spoken in first. Each item carries `channel_name`,
        `participant`, `last_message` and `latest_run_status`, as on the
        team's list, so the two never disagree about a row.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/sessions:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List every conversation in a team
      description: |
        Every session the team owns, whichever channel it arrived on — and
        those that arrived on none. A session belongs to a team rather than to
        a channel, because a channel is only one way one starts.

        Direct sessions are filtered the same way as on the channel list: the
        participant's own, plus everything if the caller holds
        `session:read_all`.

        Most recently spoken in first. Each item carries `channel_name`,
        `participant`, `last_message` and `latest_run_status`, so a list can
        be read without opening each session.

        A value outside a filter's set is a 400, not an ignored filter. A
        cursor is only meaningful with the filters it was issued under.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: channel_id
          in: query
          description: |
            Only sessions that arrived on this channel. A channel of another
            team matches nothing.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Only sessions in one of these states. Repeat it for more than one.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/SessionStatus"
        - name: run_status
          in: query
          description: |
            Only sessions whose newest top-level run is in one of these
            states. Repeat it for more than one. A session with no run
            matches none, so it is left out whenever this is given.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RunStatus"
      responses:
        "200":
          description: A page of sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: startConversation
      tags: [sessions]
      summary: Start a conversation on the dashboard
      description: |
        A new conversation with the team, held on the team's dashboard
        channel, and its first message. The conversation is a `direct`
        session that only the caller writes in; the team's hub answers it,
        as it answers a message on any channel.

        `key` is the caller's for this send, and a retry of it is the same
        send: the message is stored once, and a second request with the key
        answers `200` with what was stored the first time rather than
        starting another conversation.

        A message with files is sent as `multipart/form-data`: its `text`,
        its `key`, and up to eight `files` parts of at most 25 MB each. Each
        file's type is read from its bytes, not its name, and one of a type
        not accepted is refused with `400` naming it. A message of files
        alone needs no text. The session's stream carries each file as a
        `file` part of the message, and the hub reads them with its tools.

        A message the hub cannot answer, because the team has no model set or
        the caller may not start runs, is still stored, and `unanswered` says
        why.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SayRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SayUpload"
            encoding:
              files:
                contentType: application/octet-stream
      responses:
        "201":
          description: The conversation began, with this message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Said"
        "200":
          description: A retry of a send already stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Said"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: A message with its files is over 201 MB
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/sessions/{sessionID}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: sessionID
        in: path
        required: true
        description: The conversation
        schema:
          type: string
          format: uuid
    get:
      operationId: getSession
      tags: [sessions]
      summary: Read a conversation's details
      description: |
        The session as the lists return it. Visible exactly where its
        messages are: a session in another team, or somebody else's `direct`
        session without `session:read_all`, answers 404 with the same body as
        one that does not exist.
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/sessions/{sessionID}/messages:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: sessionID
        in: path
        required: true
        description: The conversation
        schema:
          type: string
          format: uuid
    get:
      operationId: listSessionMessages
      tags: [sessions]
      summary: Read a conversation
      description: |
        Every message here came from a sender somebody approved. A message
        from anyone else was dropped before it was written, so this is not a
        filtered view of what arrived — it is everything that was ever stored.

        Ordered by `received_at`, newest first, and never by `sent_at`.
        `sent_at` is the sender's clock: a provider with a wrong one, or
        somebody setting it deliberately, would otherwise reorder a
        conversation they do not own.

        `text` is whatever a person typed. Render it as data.

        A session in another team answers 404, not 403 — the caller was
        authorised for the team they named, not for a session id they may have
        guessed, and confirming it exists would let anyone walk the uuid space.

        Somebody else's `direct` session answers the same 404, with the same
        body. A 403 there would confirm that a private conversation exists,
        which is most of what it is private about. Reading one needs to be its
        participant, or to hold `session:read_all` in the team.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of messages, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: sendSessionMessage
      tags: [sessions]
      summary: Write in a conversation on the dashboard
      description: |
        A message in a dashboard conversation, from the person it is with.
        Nobody else writes in it, a moderator who may read it included, and a
        conversation on another channel is written in on that channel.

        With no run working in the conversation, the hub starts on it. With
        one working, the message is sent to that run, which reads it before
        its next step: `steered` says so, and `run_id` is that run. Either
        way the message is pending until a run takes it, which the session's
        stream reports as `message_consumed`.

        `key` makes a retry the same send, and files are sent as
        `multipart/form-data`, both as for `startConversation`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SayRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SayUpload"
            encoding:
              files:
                contentType: application/octet-stream
      responses:
        "202":
          description: Stored, and started or sent to a run, or `unanswered`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Said"
        "200":
          description: A retry of a send already stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Said"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: A message with its files is over 201 MB
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The conversation is someone else's, or the caller may not start runs
          content:
            text/plain:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The conversation is not one on the dashboard; write in it on its channel
          content:
            text/plain:
              schema:
                type: string

  /teams/{id}/sessions/{sessionID}/events:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: sessionID
        in: path
        required: true
        description: The conversation
        schema:
          type: string
          format: uuid
    get:
      operationId: streamSessionEvents
      tags: [sessions]
      summary: Follow a conversation
      description: |
        A server-sent event stream of the conversation: what people said, and
        what every run in it did, in one order. Each frame is one event, in
        the catalog `sdk/stream` defines, with AG-UI's names:

        ```text
        id: 41
        event: message
        data: {"at":"2026-11-13T10:01:00Z","id":"…","user_id":"…","parts":[{"type":"text","text":"also check staging"}],"state":"pending"}
        ```

        `id` is the event's sequence in the conversation. A client that
        reconnects sends the last one it saw as `Last-Event-ID`, or `after`,
        and misses nothing. With neither, the stream starts from the
        beginning. History from before the stream was kept is numbered at or
        below 0 once `brain backfill session-seq` has run, so it replays
        first.

        Each run's events carry its `run_id`; a run another run handed work
        to says which in `run_started`. Text arrives as
        `text_message_chunk` and thinking as `reasoning_message_chunk`, each
        named by the model call it came from in `message_id`, and
        `run_finished` carries the whole answer.
        A run that asks a person before a call says so in
        `approval_requested`, waits in `run_waiting` with what it told them,
        and hears the answer in `approval_decided`.
        Events the catalog has no kind for are `custom`, named by the kind
        the run recorded. The stream does not end: it follows the
        conversation until the client leaves, with a `: keep-alive` comment
        every 15 seconds while nothing happens.

        Visible where the conversation is.
      parameters:
        - name: after
          in: query
          required: false
          description: Resume after this sequence number, when Last-Event-ID is not sent.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The stream, until the client leaves
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/sessions/{sessionID}/feedback:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: sessionID
        in: path
        required: true
        description: The session
        schema:
          type: string
          format: uuid
    get:
      operationId: listSessionFeedback
      tags: [runs]
      summary: Your own 👍/👎 on every run of a session
      description: |
        Any member who may read the session. Only the caller's own feedback;
        what others gave is counted on each run's outcome, never named.
      responses:
        "200":
          description: The caller's feedback, one item per run they gave it on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionFeedback"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/sessions/{sessionID}/runs:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: sessionID
        in: path
        required: true
        description: The conversation
        schema:
          type: string
          format: uuid
    get:
      operationId: listSessionRuns
      tags: [runs]
      summary: List the runs in a conversation
      description: |
        The runs started in this session, newest first. Only top-level runs
        are listed: a delegate's run belongs to the run that started it.

        Each item is the run as `GET /teams/{id}/runs/{runID}` returns it;
        follow `/runs/{runID}/events` for what it did.

        Visible exactly where the session is: a session in another team, or
        somebody else's `direct` session without `session:read_all`, answers
        404 with the same body as a session that does not exist.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of runs, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/sessions/{sessionID}/attachments:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: sessionID
        in: path
        required: true
        description: The conversation
        schema:
          type: string
          format: uuid
    get:
      operationId: listSessionAttachments
      tags: [sessions]
      summary: List the files in a conversation
      description: |
        Every file that arrived in this conversation, across every message in
        it — which is what an agent reads to answer "the one I sent earlier".

        `media_type` and `size_bytes` are what the brain measured from the
        bytes it received, never what the sender claimed. `filename` is the
        sender's, cleaned: directory components and control characters are
        removed, and it is bounded. Treat it as a label, never as a path.

        No object key is returned. The bytes are reached through the route
        below and nowhere else.

        Visibility is the session's. Somebody else's `direct` session answers
        404 here for the same reason it does for messages.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of attachments, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/sessions/{sessionID}/attachments/{attachmentID}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: sessionID
        in: path
        required: true
        description: The conversation
        schema:
          type: string
          format: uuid
      - name: attachmentID
        in: path
        required: true
        description: The file
        schema:
          type: string
          format: uuid
    get:
      operationId: getSessionAttachment
      tags: [sessions]
      summary: Download a file
      description: |
        The bytes, decrypted on the way out. The brain proxies them rather than
        redirecting: the object store holds ciphertext under a per-team key it
        does not have, so there is no URL that would serve anything readable.

        `Content-Type` is the type recorded when the file arrived, sent with
        `X-Content-Type-Options: nosniff`. It is never derived from the
        filename. A file is only inert as the type it was recorded as — an SVG
        carrying a script is stored as `text/plain`, and stays harmless because
        that is what it is served as.

        `Content-Disposition` is `inline` for `image/png`, `image/jpeg`,
        `image/gif`, `image/webp` and `text/plain`, which a browser can display
        without executing anything. Everything else downloads, including PDFs:
        a same-origin PDF runs JavaScript in every major viewer.

        An attachment id belonging to another conversation answers 404, the
        same as one that does not exist.
      responses:
        "200":
          description: |
            The file. The body is the bytes; everything about them is in the
            headers.
          headers:
            Content-Disposition:
              description: inline for the types listed above, otherwise attachment
              schema:
                type: string
            X-Content-Type-Options:
              description: Always nosniff
              schema:
                type: string
            Cache-Control:
              description: Always `private, no-store`
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/skills:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listSkills
      tags: [skills]
      summary: List a team's skills
      description: |
        A read, so belonging to the team is enough: granting a skill to an
        agent starts with seeing which exist.

        Bodies and files are left out. A page is descriptions to choose
        between; fetch one skill to read the rest.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Query"
      responses:
        "200":
          description: A page of skills, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: createSkill
      tags: [skills]
      summary: Upload a skill
      description: |
        Requires `skill:write` in this team. The brain parses `SKILL.md`; its
        frontmatter is the skill's name, description and the rest, so nothing
        is typed twice.
      requestBody:
        required: true
        description: |
          The skill's directory, as the [Agent Skills
          specification](https://agentskills.io/specification) lays it out:
          `SKILL.md`, and any files beside it. `SKILL.md` sits at the top, or
          inside one folder named as the skill, which is stripped.

          Either a zip, or `multipart/form-data` with one `files` part per
          file whose filename is its path — what a browser sends for a folder
          upload, and what `curl -F "files=@SKILL.md;filename=SKILL.md"` sends.

          Limits: 5 MiB a file, 20 MiB and 200 files a skill, `SKILL.md`
          256 KiB, a path 1024 bytes. A path is refused rather than cleaned:
          absolute, `.` or `..` segments, empty segments, backslashes and
          control characters are all a 400 naming the path.
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SkillUpload"
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Stored, described as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          description: |
            The upload is not a skill: `SKILL.md` is missing, misplaced or
            breaks the specification, a path is not clean, a limit is passed,
            or the archive or multipart body is malformed. The sentence names
            the file and the rule.
          content:
            text/plain:
              schema:
                type: string
                examples: ['"scripts/../run.py" is not a relative path inside the skill']
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The team already has a skill with that name
          content:
            text/plain:
              schema:
                type: string
                examples: ["a skill with that name already exists"]
        "413":
          description: The request body is over 21 MiB
          content:
            text/plain:
              schema:
                type: string
                examples: ["an upload is at most 21 MiB"]
        "415":
          description: The body is neither a zip nor multipart/form-data
          content:
            text/plain:
              schema:
                type: string
                examples: ["send the skill as multipart/form-data or application/zip"]

  /teams/{id}/skills/{skillID}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/SkillID"
    get:
      operationId: getSkill
      tags: [skills]
      summary: Read a skill
      description: |
        The manifest's fields, the body, where the skill came from, and a
        description of each file beside `SKILL.md`. A file's bytes are a
        separate request.

        A skill of another team answers 404, not 403: confirming the id
        exists would let anyone walk the uuid space.
      responses:
        "200":
          description: The skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: replaceSkill
      tags: [skills]
      summary: Replace a skill
      description: |
        Requires `skill:write` in this team. The whole directory is replaced:
        files the new upload leaves out are deleted. An imported skill
        replaced by an upload becomes the team's own, and its origin is
        cleared. Agents granted it see the new version from their next run.
      requestBody:
        required: true
        description: |
          The skill's directory, as the [Agent Skills
          specification](https://agentskills.io/specification) lays it out:
          `SKILL.md`, and any files beside it. `SKILL.md` sits at the top, or
          inside one folder named as the skill, which is stripped.

          Either a zip, or `multipart/form-data` with one `files` part per
          file whose filename is its path — what a browser sends for a folder
          upload, and what `curl -F "files=@SKILL.md;filename=SKILL.md"` sends.

          Limits: 5 MiB a file, 20 MiB and 200 files a skill, `SKILL.md`
          256 KiB, a path 1024 bytes. A path is refused rather than cleaned:
          absolute, `.` or `..` segments, empty segments, backslashes and
          control characters are all a 400 naming the path.
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SkillUpload"
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Replaced, described as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          description: |
            The upload is not a skill: `SKILL.md` is missing, misplaced or
            breaks the specification, a path is not clean, a limit is passed,
            or the archive or multipart body is malformed. The sentence names
            the file and the rule.
          content:
            text/plain:
              schema:
                type: string
                examples: ['"scripts/../run.py" is not a relative path inside the skill']
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another skill in the team already has that name
          content:
            text/plain:
              schema:
                type: string
                examples: ["a skill with that name already exists"]
        "413":
          description: The request body is over 21 MiB
          content:
            text/plain:
              schema:
                type: string
                examples: ["an upload is at most 21 MiB"]
        "415":
          description: The body is neither a zip nor multipart/form-data
          content:
            text/plain:
              schema:
                type: string
                examples: ["send the skill as multipart/form-data or application/zip"]

    delete:
      operationId: deleteSkill
      tags: [skills]
      summary: Delete a skill
      description: |
        Requires `skill:write` in this team. Its files go with it.

        A skill still granted to an agent is not deleted: removing it would
        change what that agent can do without anyone changing the agent.
        Revoke it from each agent first.
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An agent is still granted this skill
          content:
            text/plain:
              schema:
                type: string
                examples: ["the skill is granted to an agent"]

  /teams/{id}/skills/{skillID}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/SkillID"
      - name: path
        in: path
        required: true
        description: |
          The file's path inside the skill, folders included, as `files`
          lists it — `scripts/fill.py`. Its slashes are not escaped.
        schema:
          type: string
    get:
      operationId: getSkillFile
      tags: [skills]
      summary: Download one of a skill's files
      description: |
        The bytes, decrypted on the way out, as for an attachment.

        `Content-Type` is the type recorded when the file was uploaded, sent
        with `X-Content-Type-Options: nosniff`, never derived from the name.
        `Content-Disposition` is always `attachment`: a skill's files are
        scripts and references for an agent, and nothing is gained by
        rendering one in a browser.
      responses:
        "200":
          description: |
            The file. The body is the bytes; everything about them is in the
            headers.
          headers:
            Content-Disposition:
              description: Always attachment, with the file's name
              schema:
                type: string
            X-Content-Type-Options:
              description: Always nosniff
              schema:
                type: string
            Cache-Control:
              description: Always `private, no-store`
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/skills/import:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    post:
      operationId: importSkill
      tags: [skills]
      summary: Import a skill from GitHub or a zip on the web
      description: |
        Requires `skill:write` in this team. The brain fetches the source
        itself, then stores what it found exactly as an upload is stored, with
        the source recorded so the skill can be synced later.

        `github:owner/repo/path@ref` takes one folder of a repository. The ref
        is resolved to a commit first, and the commit is what is fetched and
        recorded, so a branch moving mid-import changes nothing. Without
        `@ref` it is the default branch.

        An `https://` address is a zip, fetched only from a host the operator
        allows. It may not carry a user, password or query string: the
        address is stored and shown to the team, and a signed link keeps its
        credential in the query.

        The fetch has 30 seconds, and connects only to public addresses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillImportRequest"
      responses:
        "201":
          description: Imported, described as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          description: |
            The body is malformed, the source is neither form, or it names a
            host the operator does not allow.
          content:
            text/plain:
              schema:
                type: string
                examples: ["not a skill source: a zip source may not carry a query string; the address is stored and shown"]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The team already has a skill with that name
          content:
            text/plain:
              schema:
                type: string
                examples: ["a skill with that name already exists"]
        "422":
          $ref: "#/components/responses/SourceNotASkill"
        "502":
          $ref: "#/components/responses/SourceUnavailable"
        "504":
          $ref: "#/components/responses/SourceTimedOut"

  /teams/{id}/skills/{skillID}/sync:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/SkillID"
    post:
      operationId: syncSkill
      tags: [skills]
      summary: Fetch an imported skill's source again
      description: |
        Requires `skill:write` in this team. The recorded `source_ref` is
        fetched again. When it names a different commit or digest than
        `source_sha`, the whole directory is replaced; when it names the same
        one, nothing is written and the skill is returned as it is.

        A skill that was uploaded has no source, and answers 409.
      responses:
        "200":
          description: The skill, replaced or unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The skill was uploaded and has no source, or the source now names
            a skill another in the team already has the name of.
          content:
            text/plain:
              schema:
                type: string
                examples: ["an uploaded skill has no source to sync from"]
        "422":
          $ref: "#/components/responses/SourceNotASkill"
        "502":
          $ref: "#/components/responses/SourceUnavailable"
        "504":
          $ref: "#/components/responses/SourceTimedOut"

  /teams/{id}/agents:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listAgents
      tags: [agents]
      summary: List a team's agents
      description: |
        A read, so belonging to the team is enough. Instructions, limits and
        grants are left out; fetch one agent for the rest.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Query"
      responses:
        "200":
          description: A page of agents, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: createAgent
      tags: [agents]
      summary: Define an agent
      description: |
        Requires `agent:write` in this team. The agent and its grants are
        written in one step. Only `custom` agents are created here; the other
        kinds are agents the brain provides.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRequest"
      responses:
        "201":
          description: Created, described as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          description: |
            The body breaks a rule, named in the sentence: a limit, a model
            setting, the parser and its schema, a grant listed twice, a
            pattern the brain does not run, or a granted server or skill that
            is not this team's. Nothing is written.
          content:
            text/plain:
              schema:
                type: string
                examples: ["a granted server or skill does not exist in this team"]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The team already has an agent with that name, case-insensitively
          content:
            text/plain:
              schema:
                type: string
                examples: ["an agent with that name already exists"]

  /teams/{id}/agents/{agentID}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/AgentID"
    get:
      operationId: getAgent
      tags: [agents]
      summary: Read an agent, with its grants
      description: |
        An agent of another team answers 404, not 403: confirming the id
        exists would let anyone walk the uuid space.
      responses:
        "200":
          description: The agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: replaceAgent
      tags: [agents]
      summary: Replace an agent and its grants
      description: |
        Requires `agent:write` in this team. Every field and every grant is
        replaced in one step, so a field left out is cleared and a grant left
        out is revoked. `kind` cannot change: leave it out, or send the kind
        the agent already has.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRequest"
      responses:
        "200":
          description: Replaced, described as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          description: |
            The body breaks a rule, named in the sentence: a limit, a model
            setting, the parser and its schema, a grant listed twice, a
            pattern the brain does not run, or a granted server or skill that
            is not this team's. Nothing is written.
          content:
            text/plain:
              schema:
                type: string
                examples: ["a granted server or skill does not exist in this team"]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another agent in the team already has that name
          content:
            text/plain:
              schema:
                type: string
                examples: ["an agent with that name already exists"]

    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete an agent
      description: |
        Requires `agent:write` in this team. Its grants go with it; the
        servers and skills it was granted are untouched.
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/blueprint:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: exportBlueprint
      tags: [blueprints]
      summary: The team as a blueprint
      description: |
        A read, so belonging to the team is enough. Says the team's MCP
        servers and custom agents as a blueprint, grants by name and secret
        references relative to the team, so planning it changes nothing and
        an edit starts from the agent whole. Skills are left out: a skill is
        its files, and one a blueprint does not name is left alone; agents
        still grant them by name. Built-in agents are never in it. With
        `agent` or `mcp_server`, only those are.
      parameters:
        - name: agent
          in: query
          description: An agent to export, by name; repeat for more.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: mcp_server
          in: query
          description: An MCP server to export, by name; repeat for more.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        "200":
          description: The blueprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blueprint"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/blueprints/plan:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    post:
      operationId: planBlueprint
      tags: [blueprints]
      summary: Show what applying a blueprint would change
      description: |
        A read, so belonging to the team is enough. Compares each item the
        blueprint names with the team's item of that name and says whether it
        would be created, updated (naming the fields, never their values) or
        left unchanged. Items the blueprint does not name are not compared
        and never removed. Every reason the blueprint cannot be applied is a
        refusal, including a write permission the caller does not hold.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Blueprint"
      responses:
        "200":
          description: The plan, refusals included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/proposals:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listProposals
      tags: [blueprints]
      summary: The builder's proposals, newest first
      description: |
        A read, so belonging to the team is enough. A proposal in a direct
        session is seen only by that session's person, or with
        `session:read_all`, as the session's runs are.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: session
          in: query
          description: Only this session's proposals.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of proposals, without their blueprints and plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/proposals/{proposalID}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: proposalID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProposal
      tags: [blueprints]
      summary: A proposal, its blueprint and its plan
      description: |
        For an open proposal, the plan is made now, as the caller: what
        applying it would do, and a refusal for any write they may not make.
        For one applied or superseded, it is the plan the builder had.
      responses:
        "200":
          description: The proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/proposals/{proposalID}/apply:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: proposalID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: applyProposal
      tags: [blueprints]
      summary: Apply a proposal, as the caller
      description: |
        As `POST /teams/{id}/blueprints/apply`, for the proposal's blueprint:
        planned again with the caller's permissions, written only if its
        digest is the one sent, and the proposal marked applied in the same
        transaction, so it is applied once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalApply"
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintApplied"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The team changed since the plan sent (the body is the new plan),
            or, in plain text, the proposal is applied or superseded. Nothing
            was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintPlan"
            text/plain:
              schema:
                type: string
        "422":
          description: The plan has refusals, and nothing was written. The body is the plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintPlan"

  /teams/{id}/blueprints/apply:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    post:
      operationId: applyBlueprint
      tags: [blueprints]
      summary: Apply a blueprint
      description: |
        Plans again and applies only the plan whose digest is the one sent.
        Each write needs its own permission: `tool:write` for an MCP server,
        `skill:write` for a skill, `agent:write` for an agent and its grants.
        Changed skills' files are stored first, then every row is written in
        one transaction, so a failure leaves nothing half-applied. MCP
        discovery is not run, and no secret is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueprintApply"
      responses:
        "200":
          description: Applied. Each change carries the id of the item it made or changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintApplied"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The team changed since the plan that was sent: the body is the new
            plan, and nothing was written. A plain-text 409 is a name taken
            while this was applying; plan again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintPlan"
            text/plain:
              schema:
                type: string
        "422":
          description: The plan has refusals, and nothing was written. The body is the plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintPlan"

  /teams/{id}/loops:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listLoops
      tags: [agents]
      summary: List the loops an agent may use
      description: |
        A read, so belonging to the team is enough. These are the loops the
        brain runs, sorted by name, and the only values an agent's `pattern`
        accepts. The list is short and always whole, so it takes no `limit`
        or `cursor` and never has a `next_cursor`.
      responses:
        "200":
          description: Every loop the brain runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoopPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/runs:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listTeamRuns
      tags: [runs]
      summary: List the team's runs
      description: |
        The team's run history, newest first. Only top-level runs are
        listed: a delegate's run belongs to the run that started it.

        A run is listed where its session is visible: every run in a `group`
        or `thread` session, and a `direct` session's runs only for its
        participant or a caller holding `session:read_all`. Hidden means
        absent; nothing says how many were left out.

        Each item is the run as `GET /teams/{id}/runs/{runID}` returns it.
        A value outside a filter's set is a 400, not an ignored filter. A
        cursor is only meaningful with the filters it was issued under.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          description: Only runs in one of these states. Repeat it for more than one.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RunStatus"
        - name: since
          in: query
          description: Only runs created at or after this time, in RFC 3339.
          schema:
            type: string
            format: date-time
            examples: ["2026-11-04T09:30:00Z"]
        - name: hub
          in: query
          description: |
            `true` for only the hub's runs, `false` for only those started
            for a named agent; absent for both.
          schema:
            type: boolean
        - name: builder
          in: query
          description: |
            `true` for only the team's builder's runs, which is how a client
            finds the builder conversations it can carry on; `false` for
            every other run; absent for both.
          schema:
            type: boolean
      responses:
        "200":
          description: A page of runs, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: startRun
      tags: [runs]
      summary: Start a run of an agent, or ask the team's hub
      description: |
        Requires `run:write` in this team. The run is recorded and queued
        before the reply, and a worker picks it up; follow it with
        `GET /teams/{id}/runs/{runID}/events`.

        With no `agent` the run is the team's hub's: the agent chosen in the
        team's settings, or the built-in orchestrator when none is. The
        orchestrator runs on the team's model, so with none set it is
        refused with a 409.

        `builder` is refused with a 400: the builder is an agent on the
        dashboard channel, where every message has its channel. Start a
        conversation with it at `POST /teams/{id}/sessions` with `builder`.

        With no `session_id` the run gets a direct session of its own, owned
        by the caller. A named session must be one the caller can read: a
        `group` or `thread` session of this team, their own `direct` one, or
        any with `session:read_all`.

        A session is one conversation with one transcript: each run in it
        continues what the runs before it did, their tool calls and results
        included, compacted as it grows. So one run works in a session at a
        time. When one is already working there, the input is handed to it as
        a message, as a person's in a chat is, and the answer is that run,
        with 200 rather than 202. A message that arrives after its last model
        call starts the next run when it finishes. A session that belongs to
        a channel takes runs only from its channel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "202":
          description: Queued, described as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "200":
          description: |
            A run was already working in the session, and the input went to
            it. This is that run; nothing new was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: |
            The body breaks a rule, named in the sentence: no input, input
            over 100 KiB or holding a NUL character, or a body that is not
            the shape above. Nothing is written.
          content:
            text/plain:
              schema:
                type: string
                examples: ["input must be at most 100 KiB"]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            No agent in this team has that name, or the session is not one
            the caller can read. Neither repeats what was asked for, and
            nothing is written.
          content:
            text/plain:
              schema:
                type: string
                examples: ["no agent in this team has that name"]
        "409":
          description: |
            The run names no agent, the team chose no hub, and its settings
            have no model for the built-in orchestrator; or the session belongs
            to a channel, whose runs come from its chat. Nothing is written.
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "the team has no model set, so its orchestrator cannot run; set one in the team's settings"
                  - "this session belongs to a channel; send the message there"

  /teams/{id}/runs/{runID}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/RunID"
    get:
      operationId: getRun
      tags: [runs]
      summary: Read a run
      description: |
        A run is visible exactly where its session is: someone else's direct
        run answers 404 unless the caller holds `session:read_all`.
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/runs/{runID}/events:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/RunID"
    get:
      operationId: streamRunEvents
      tags: [runs]
      summary: Follow what a run does
      description: |
        A server-sent event stream, visible where the run is. Each frame is
        one event the run recorded:

        ```text
        id: 3
        event: tool_call
        data: {"name": "search", ...}
        ```

        The `id` is the event's sequence within the run, so a client that
        reconnects sends it back as `Last-Event-ID` and misses nothing. Once
        the run has finished and its last event is sent, a final `end` frame
        carries its status, `data: {"status":"succeeded"}`, and the stream
        closes. A run cancelled before any worker took it has no events, and
        its stream is that one frame. A comment, `: keep-alive`, is sent
        every 15 seconds while nothing happens.

        A top-level run, and a builder run, also stream their writing as it
        happens: `text` frames, `data: {"text": "I propose…", "truncated":
        false, "step": 2}`, each a piece of the model's text in order, written
        before the tool call it led to, and `reasoning` frames of the same
        shape for what it thinks rather than says: the model's reasoning, or
        a loop's plan or critique. `step` is the model call that wrote it.
        Joined, the text after the last `tool_result` is the run's output.

        A long run compacts its context, and is asked to finish before its
        budget or its time runs out:

        ```text
        event: compacted
        data: {"reason": "tokens", "cleared": 2, "folded": 8, "before": 101000, "after": 21000,
               "summary": "Goal: …"}

        event: wrap_up
        data: {"reason": "budget", "left": 40000}
        ```

        `reason` is `tokens`, `messages`, `asked` (the budget's first line) or
        `overflow` (the model refused the request as too long); `folded` is 0
        when clearing old tool results was enough. `error` is set when the
        summary call failed and the request went out whole. `summary` is the
        summary written, absent when clearing was enough; the run's transcript
        keeps it too, so a resumed run carries on from it. A `wrap_up` is
        `budget` or `time`; after it
        the run's tools refuse, and its next answer ends it.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Resume after this sequence number. Wins over `after`.
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: after
          in: query
          required: false
          description: Resume after this sequence number, for a client that cannot set a header.
          schema:
            type: integer
            format: int32
            minimum: 0
      responses:
        "200":
          description: The stream, until the run ends or the client leaves
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/runs/{runID}/cancel:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/RunID"
    post:
      operationId: cancelRun
      tags: [runs]
      summary: Cancel a run
      description: |
        Requires `run:write` in this team, and the run must be visible to the
        caller. A queued run ends at once. A running one is marked, and its
        worker stops it at its next heartbeat, within 15 seconds; read the
        run, or its events, to see it finish.
      responses:
        "202":
          description: Cancelled, or asked to stop, described as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The run has already finished
          content:
            text/plain:
              schema:
                type: string
                examples: ["the run has already finished"]

  /teams/{id}/runs/{runID}/feedback:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/RunID"
    put:
      operationId: giveRunFeedback
      tags: [runs]
      summary: Give or change your 👍/👎 on a run's answer
      description: |
        Requires `run:write`, and the run must be visible to the caller. One
        per person per run; giving it again replaces it. Only on a top-level
        run, the one that answered, and only while the team has
        `improvement` on. A signed-in member's word outranks the judge's
        verdict on this run; a 👎 also has the run digested if it was not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunFeedbackRequest"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunFeedback"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A delegate's run, or self-improvement is off for the team
          content:
            text/plain:
              schema:
                type: string
                examples: ["self-improvement is off for this team, so feedback is not recorded"]
    delete:
      operationId: clearRunFeedback
      tags: [runs]
      summary: Remove your 👍/👎 on a run
      description: Requires `run:write`, as giving it does. Removing none answers 204 too.
      responses:
        "204":
          description: Removed, or there was none
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A delegate's run, or self-improvement is off for the team
          content:
            text/plain:
              schema:
                type: string

  /teams/{id}/settings:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: getTeamSettings
      tags: [settings]
      summary: Read a team's settings
      description: |
        Any member may read them. A team that never saved reads the
        defaults: no model, search off, no browser, self-improvement off, compaction at 100
        messages or 50,000 to 60,000 tokens, the built-in orchestrator as its hub, and `updated_at`
        null. The search key is never returned; `search.key_set` says
        whether there is one.
      responses:
        "200":
          description: The settings, or the defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: saveTeamSettings
      tags: [settings]
      summary: Change a team's settings
      description: |
        Requires `team:settings` in this team. The whole set every time: a
        field left out is not a field left alone. A missing `model` means no
        model, the same as null, and a missing `hub` means the built-in
        orchestrator.

        The search key is the exception, because it cannot be read back to
        send again. Leave out `search.api_key` and the stored key is kept,
        provided the provider is unchanged; switching to another provider
        that takes a key needs a new one. A key sent is stored in the secret
        store, never in the database, and never returned.

        A self-hosted provider's URL whose host is an address rather than a
        name must be a public one, or within the deployment's
        `MCP_PRIVATE_NETWORKS`. A name is checked when the brain connects.

        The token lines are the other exception: leave out
        `compaction_tokens_min` or `compaction_tokens_max` and the stored
        one is kept, so a client that predates them cannot reset them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamSettingsRequest"
      responses:
        "200":
          description: Saved, described as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamSettings"
        "400":
          description: |
            The body breaks a rule, named in the sentence by its field.
            Nothing is written, and no key reaches the secret store.
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "search.api_key is needed to switch to tavily"
                  - 'no agent in this team is named "triage"'
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Another save changed the token lines after this one checked
            them, and the two together would put the lowest above the
            highest. Nothing was written; read the settings again and retry.
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "the team's compaction settings changed while saving; read them again and retry"
        "503":
          description: |
            The secret store is unreachable, so nothing was saved: settings
            naming a key the store does not hold would fail every search.
          content:
            text/plain:
              schema:
                type: string
                examples: ["the secret store is unavailable"]

  /teams/{id}/approvals:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: List what a team's agents asked a person
      description: |
        Requires `approval:read` in this team. Newest first. A request shows
        only to someone who may read its run: a direct conversation's are
        its person's, and those of anyone who holds `session:read_all`.
        Its summary and arguments quote the call, so they reach no further
        than the run does.

        A value outside a filter's set is a 400. A cursor is only meaningful
        with the filters it was issued under.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          description: Only requests in one of these states. Repeat it for more than one.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ApprovalStatus"
        - name: run
          in: query
          description: Only requests asked under this top-level run, by any agent in its tree.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/approvals/{approvalID}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/ApprovalID"
    get:
      operationId: getApproval
      tags: [approvals]
      summary: Read one request
      description: |
        Requires `approval:read` in this team, and that the caller may read
        the request's run.
      responses:
        "200":
          description: The request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/approvals/{approvalID}/decision:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/ApprovalID"
    post:
      operationId: decideApproval
      tags: [approvals]
      summary: Answer a request
      description: |
        Requires `approval:self` in this team, and that the caller may read
        the request's run. Who may answer is decided from the caller's role
        as it stands now: anyone who holds `approval:decide`, or the person
        the request was made for, unless a rule wants someone else to answer
        it (`require_other`).

        A yes with `scope: run` approves this tool, any arguments, for the
        rest of the run. A no is for this call only. Once nothing in the
        run's tree waits, the run is queued again: an approved call is made
        then, by the brain, with exactly the arguments that were approved,
        and the agent is told the answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "200":
          description: Answered, described as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The caller may not answer this request; nothing changed.
          content:
            text/plain:
              schema:
                type: string
                examples: ["you may not answer this request"]
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Already answered, or answered after it expired: the request as it
            now stands. An expired request is marked so here, and its run
            carries on to say nobody answered in time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"

  /teams/{id}/improvements:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listImprovements
      tags: [improvements]
      summary: List proposed improvements to a team's agents
      description: |
        Any member may list applied and reverted ones. Waiting, rejected and
        withdrawn ones quote runs that may be in conversations other members
        cannot read, so asking for them needs `improvement:approve`; without
        it that is a 403, so "none" and "not yours to see" stay apart. With
        no status, an approver sees what is waiting and anyone else what is
        applied. Newest first.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Query"
        - name: status
          in: query
          description: Only proposals in one of these states. Repeat it for more than one.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ImprovementStatus"
        - name: agent
          in: query
          description: Only proposals about this agent.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImprovementPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/improvements/{proposalID}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/ImprovementID"
    get:
      operationId: getImprovement
      tags: [improvements]
      summary: Read one proposed improvement, with its changes
      description: |
        Any member may read an applied or reverted one; a waiting, rejected
        or withdrawn one, to someone without `improvement:approve`, is a 404,
        as another team's is.
      responses:
        "200":
          description: The proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Improvement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/improvements/{proposalID}/decision:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/ImprovementID"
    post:
      operationId: decideImprovement
      tags: [improvements]
      summary: Approve, reject or revert a proposed improvement
      description: |
        Requires `improvement:approve`, and the write permission the change
        would need by hand: `agent:write` for a change to an agent,
        `skill:write` for a skill edit, both for a new skill.

        Approve writes the change with the same rules a person's edit of the
        agent or skill meets, and withdraws the other proposals waiting on the
        same target. It is refused when the target changed since the proposal
        was made. Revert puts the old version back, and is refused when the
        target changed since the change was applied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImprovementDecision"
      responses:
        "200":
          description: Decided, described as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Improvement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Not allowed now, and nothing changed: the proposal is not in a
            state that allows it, the target changed since, or the change
            breaks a rule. The reason is the body.
          content:
            text/plain:
              schema:
                type: string
                examples: ["the agent changed since this was proposed; reject it, and the next proposal is made from it as it is now"]

  /teams/{id}/approval-settings:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: getApprovalSettings
      tags: [approvals]
      summary: Read when a team's agents ask a person
      description: |
        Any member may read them. A team made before approvals that never
        chose reads `off`; a team made since starts at `writes`.
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: saveApprovalSettings
      tags: [approvals]
      summary: Change when a team's agents ask a person
      description: Requires `team:settings` in this team. Runs already started keep the settings they were built with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalSettings"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/approval-rules:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listApprovalRules
      tags: [approvals]
      summary: List a team's standing answers
      description: |
        Any member may read them. A rule names one tool
        (`<server>__<tool>`, or a built-in's own name) or every tool of a
        server, and answers for it whatever the team's mode: the most
        specific rule wins.
      responses:
        "200":
          description: Every rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRulePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createApprovalRule
      tags: [approvals]
      summary: Add a standing answer
      description: Requires `team:settings` in this team. A target has one rule; remove it to change it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRuleRequest"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: That target already has a rule.
          content:
            text/plain:
              schema:
                type: string
                examples: ["that target already has a rule; remove it first"]

  /teams/{id}/approval-rules/{ruleID}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: ruleID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteApprovalRule
      tags: [approvals]
      summary: Remove a standing answer
      description: Requires `team:settings` in this team. The team's mode decides for the target again.
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/mcp-servers:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listMCPServers
      tags: [mcp-servers]
      summary: List a team's MCP servers
      description: |
        A read, so belonging to the team is enough: granting a server to an
        agent starts with seeing which exist. A server holds references to
        secrets, never a secret, so there is nothing here to hide from a
        member.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Query"
      responses:
        "200":
          description: A page of servers, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServerPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: createMCPServer
      tags: [mcp-servers]
      summary: Register an MCP server
      description: |
        Requires `tool:write` in this team. Nothing connects to the server
        here: its tools are listed once discovery has run, and
        `discovered_at` says when that was.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPServerRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServer"
        "400":
          description: |
            The body breaks a rule: the name, both or neither transport, a
            url with a user, query or fragment, `env` on a url server or
            `auth_secret_ref` on a command one, or a value that is not a
            secret reference under this team's `mcp/` path. The sentence
            names the field and never repeats its value.
          content:
            text/plain:
              schema:
                type: string
                examples: ["env GITHUB_TOKEN is a secret reference, teams/<team_id>/mcp/<name>#<key>, not a secret"]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The team already has a server with that name, case-insensitively
          content:
            text/plain:
              schema:
                type: string
                examples: ["an MCP server with that name already exists"]

  /teams/{id}/mcp-servers/{serverID}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/ServerID"
    get:
      operationId: getMCPServer
      tags: [mcp-servers]
      summary: Read an MCP server
      description: |
        A server of another team answers 404, not 403: confirming the id
        exists would let anyone walk the uuid space.
      responses:
        "200":
          description: The server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateMCPServer
      tags: [mcp-servers]
      summary: Replace an MCP server
      description: |
        Requires `tool:write` in this team. Every field is replaced, so a
        field left out is cleared. Pointing the server somewhere else — a
        different url or command — clears `discovered_at` and the last
        attempt, `last_discovery_error` and `last_discovery_at`; the tools already
        listed stay until the next discovery replaces them, so an agent
        granted this server keeps what it had rather than losing every tool
        to an edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPServerRequest"
      responses:
        "200":
          description: Replaced, described as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServer"
        "400":
          description: |
            The body breaks a rule: the name, both or neither transport, a
            url with a user, query or fragment, `env` on a url server or
            `auth_secret_ref` on a command one, or a value that is not a
            secret reference under this team's `mcp/` path. The sentence
            names the field and never repeats its value.
          content:
            text/plain:
              schema:
                type: string
                examples: ["env GITHUB_TOKEN is a secret reference, teams/<team_id>/mcp/<name>#<key>, not a secret"]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another server in the team already has that name
          content:
            text/plain:
              schema:
                type: string
                examples: ["an MCP server with that name already exists"]

    delete:
      operationId: deleteMCPServer
      tags: [mcp-servers]
      summary: Delete an MCP server
      description: |
        Requires `tool:write` in this team. Its tools go with it. The secrets
        it referred to are not touched: they are the team's, and another
        server may name the same one.

        A server still granted to an agent is not deleted: removing it would
        change what that agent can do without anyone changing the agent.
        Revoke it from each agent first.
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An agent is still granted this server
          content:
            text/plain:
              schema:
                type: string
                examples: ["the MCP server is granted to an agent"]

  /teams/{id}/mcp-servers/{serverID}/tools:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/ServerID"
    get:
      operationId: listMCPTools
      tags: [mcp-servers]
      summary: List the tools a server offers
      description: |
        What the last discovery found, by name. Not paged: a server offers
        tens of tools, not thousands. Empty until discovery has run.
      responses:
        "200":
          description: The server's tools
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPToolList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/mcp-servers/{serverID}/discover:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/ServerID"
    post:
      operationId: discoverMCPServer
      tags: [mcp-servers]
      summary: Ask a server which tools it offers, and store them
      description: |
        Requires `tool:write` in this team. The brain connects to the server's
        url, sending `auth_secret_ref`'s secret as a bearer token over https,
        lists its tools within 15 seconds, and replaces the stored list in one
        step: new tools are added, changed ones rewritten, and ones the server
        no longer offers removed. Any failure leaves the previous list as it
        was, so an agent granted the server keeps what it had.

        Every attempt sets the server's `last_discovery_at`. A success clears
        `last_discovery_error`; a failure stores the sentence it was answered
        with, unless the server was edited meanwhile or the failure was the
        brain's own.

        The brain reaches public addresses only, plus the private ranges its
        operator lists in `OPENARITY_MCP_PRIVATE_NETWORKS`. Link-local
        addresses, where cloud metadata answers, are never reached. Redirects
        are not followed.

        No body is read.
      responses:
        "200":
          description: Discovered and stored; the tools as the server listed them
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPToolList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            A command server whose team has chosen no sandbox to run it in:
            choose one in Settings, or register a URL instead. Or a server that signs in
            and is not connected, or one edited while it was being discovered.
            Nothing was stored, and none of these is recorded as a failed
            discovery.
          content:
            text/plain:
              schema:
                type: string
                examples: ["the server changed while it was being discovered; discover it again"]
        "422":
          description: |
            The brain will not use this server as it is: its address is one
            the brain may not reach, it redirected, its token would go over
            plain http, `auth_secret_ref` names a missing or empty secret, or
            what it offers cannot be stored — more than 500 tools, a name that
            is not usable, a description over 16 KiB, a schema over 64 KiB, or
            a NUL character. The address the brain resolved is logged, never
            returned.
          content:
            text/plain:
              schema:
                type: string
                examples: ["the server offers something that cannot be stored: search is offered twice"]
        "502":
          description: The server did not answer as an MCP server. The detail is logged.
          content:
            text/plain:
              schema:
                type: string
                examples: ["the server did not answer as an MCP server"]
        "504":
          description: The server did not finish answering within 15 seconds.
          content:
            text/plain:
              schema:
                type: string
                examples: ["the server did not answer in time"]

  /teams/{id}/mcp-servers/{serverID}/trust-hints:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/ServerID"
    put:
      operationId: setMCPServerTrustHints
      tags: [mcp-servers]
      summary: Believe, or stop believing, a server's hints about its tools
      description: |
        Requires `team:settings` in this team, not `tool:write`: a server
        that says its tools only read is believed when a call is classed for
        approval, which can let its tools past every approval. Nothing else
        about the server changes, and it is not discovered again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trust]
              properties:
                trust:
                  type: boolean
      responses:
        "200":
          description: Saved, the server as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/mcp-servers/{serverID}/oauth:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/ServerID"
    delete:
      operationId: disconnectMCPServerOAuth
      tags: [mcp-servers]
      summary: Disconnect a server's sign-in
      description: |
        Requires `tool:write` in this team. Ends the server's sign-in: its
        tokens are deleted, and the authorization server is asked to revoke
        them (RFC 7009) as well as it will answer; a revocation that fails is
        logged, and the sign-in is ended here regardless. A server with no
        sign-in is disconnected already, and the answer is the same.
      responses:
        "204":
          description: Disconnected
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/mcp-servers/{serverID}/oauth/start:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/ServerID"
    post:
      operationId: startMCPServerOAuth
      tags: [mcp-servers]
      summary: Begin signing in to a server
      description: |
        Requires `tool:write` in this team. For a server that signs in
        (`auth_kind` oauth), the brain finds its authorization server as the
        MCP authorization spec lays out, begins a sign-in with PKCE that lasts
        ten minutes, and answers with the URL to send the person to. They come
        back to `/oauth/mcp/callback`, under `PUBLIC_URL`.

        The client is the server's own `oauth_client_id` when it has one.
        Without one, the brain registers a client with the authorization
        server (RFC 7591) at the first sign-in, a public one where it may,
        and keeps it for every later sign-in, refresh and revocation while the
        authorization server and the redirect URI stay the same.

        409 when the server is reached with a token, is a command server,
        offers more than five scopes with none chosen on it, has no client and
        its authorization server registers none, or when this brain has no
        `PUBLIC_URL`. 502 when the server's sign-in cannot be found, offers no
        PKCE with S256, or refused the registration, with its reason.
      responses:
        "200":
          description: The sign-in, begun
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url]
                properties:
                  authorize_url:
                    type: string
                    format: uri
                    description: Where to send the person to sign in
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The server cannot be signed in to as it is
        "502":
          description: The server's sign-in could not be found, or refused the registration

  /teams/{id}/mcp-servers/{serverID}/oauth/registration:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/ServerID"
    delete:
      operationId: forgetMCPServerOAuthRegistration
      tags: [mcp-servers]
      summary: Forget the client openarity registered for a server
      description: |
        Requires `tool:write` in this team. Forgets the client the brain
        registered for a server with no client of its own, and ends the
        sign-in made with it, so the next sign-in registers a new one: for an
        authorization server that stopped accepting the client on its own
        page, which never sends the person back to say so. 204 also when
        nothing was registered. 409 for a server with a client of its own, or
        one that does not sign in.
      responses:
        "204":
          description: Forgotten, or there was nothing to forget
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The server signs in with a client of its own, or does not sign in

  /teams/{id}/mcp-secrets/{name}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: name
        in: path
        required: true
        description: The secret's name, the part before `#` in a reference such as `stripe#token`
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,128}$"
    put:
      operationId: putMCPSecret
      tags: [mcp-servers]
      summary: Write one of the team's MCP secrets
      description: |
        Writes `teams/{id}/mcp/{name}` in the secret store with exactly these
        keys, so a server or a blueprint names one as `{name}#{key}`. Every
        key the secret holds is written together, because a write replaces
        the keys it held. The values go to the secret store only: they are
        never returned, logged or readable through the API. Needs
        `tool:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPSecretWrite"
      responses:
        "204":
          description: Written
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          description: This brain does not write secrets; write it to the secret store yourself.
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: The secret store did not take the write. Nothing is known to be written.
          content:
            text/plain:
              schema:
                type: string
                examples: ["the secret store is unavailable"]

  /teams/{id}/summary:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: getTeamSummary
      tags: [teams]
      summary: The team at a glance
      description: |
        Counts for a team's home: the last day's runs by status, the
        conversations, the senders waiting to be let in, and the MCP servers
        whose last discovery failed.

        Each count obeys the rule of the list it summarises, so it never
        counts what the caller could not list. Runs and sessions follow the
        session rule: a `direct` session, and its runs, count only for its
        participant or a caller holding `session:read_all`.
        `waiting_senders` is null without `channel:read`.

        The counts are read in one statement, so they agree with each other.
        Lists carry no totals; this is where totals come from.
      responses:
        "200":
          description: The team's counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamSummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/graph:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: getTeamGraph
      tags: [graph]
      summary: The team's graph
      description: |
        The team's agents, toolkits, tools and skills, and the edges between
        them, as the graph index holds them now. Not as Postgres holds them:
        the graph catches up within about a minute of a change, and what is
        shown here is what selection will search.

        Vectors are not returned. `model` says which model embedded a node,
        and is absent for a node that carries no vector.

        Requires only membership. At most `limit` nodes are returned, and
        `truncated` says when there were more; an edge is returned only when
        both of its ends are.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2000
            default: 500
      responses:
        "200":
          description: The graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamGraph"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: |
            There is no graph to show: no embedding model is configured, so
            nothing is projected, or the graph store cannot be reached. The
            rest of the API does not depend on it.
          content:
            text/plain:
              schema:
                type: string
                examples: ["the graph is not enabled on this brain"]

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Find a user
      description: |
        Adding someone to a team needs their id, and an id is the one thing
        nobody can tell you over chat. This is where it is looked up.

        Requires `user:read` in at least one team, and super admins always.
        Not every authenticated caller: the directory is every subject and
        email the deployment has ever seen, and a filtered read of it is an
        existence oracle for anyone who can guess a username.

        The check is "somewhere" rather than "in this team", because the
        caller is looking someone up precisely to find out which team they
        should be in — there is no team to check against yet.

        `subject` narrows to an exact match. There is no prefix or substring
        search, deliberately: a directory that answers "who starts with s" is
        one someone walks.
      parameters:
        - name: subject
          in: query
          required: false
          description: |
            The identifier at the provider, matched exactly. An unknown one is
            an empty page, not a 404.
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        An OIDC access token, or the shared development token when
        OPENARITY_DEV_TOKEN is set. The scheme is matched case-insensitively.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: |
        Rows per page. A value above the maximum is clamped rather than
        refused; zero, a negative and anything unparseable are 400.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        An opaque position, taken verbatim from the `next_cursor` of the
        previous page. It is not constructible by a client, and one that has
        been altered is a 400 rather than a silent restart.
      schema:
        type: string

    Query:
      name: q
      in: query
      required: false
      description: |
        Only the rows whose name contains this, ignoring case. It is taken
        literally, so `%` and `_` are characters, not wildcards. Spaces around
        it are dropped, and an empty one lists everything. A cursor from a
        search goes on within the same search.
      schema:
        type: string
        maxLength: 200
        examples: [invoice]

    TeamID:
      name: id
      in: path
      required: true
      description: The team
      schema:
        type: string
        format: uuid

    ChannelID:
      name: channelID
      in: path
      required: true
      description: The channel
      schema:
        type: string
        format: uuid

    SkillID:
      name: skillID
      in: path
      required: true
      description: The skill
      schema:
        type: string
        format: uuid

    AgentID:
      name: agentID
      in: path
      required: true
      description: The agent
      schema:
        type: string
        format: uuid

    ServerID:
      name: serverID
      in: path
      required: true
      description: The MCP server
      schema:
        type: string
        format: uuid
    ImprovementID:
      name: proposalID
      in: path
      required: true
      description: The proposed improvement
      schema:
        type: string
        format: uuid
    ApprovalID:
      name: approvalID
      in: path
      required: true
      description: The request
      schema:
        type: string
        format: uuid

    RunID:
      name: runID
      in: path
      required: true
      description: The run
      schema:
        type: string
        format: uuid

  responses:
    Unauthenticated:
      description: |
        No token, or one that no configured verifier accepts. Carries a
        `WWW-Authenticate: Bearer` header.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            examples: ["Bearer"]
      content:
        text/plain:
          schema:
            type: string
            examples: ["unauthorized"]

    Forbidden:
      description: |
        The token is valid; the caller may not do this. They should not be
        asked to authenticate again.
      content:
        text/plain:
          schema:
            type: string
            examples: ["forbidden"]

    NotFound:
      description: |
        No such resource, or none the caller may see. The two are
        indistinguishable on purpose.
      content:
        text/plain:
          schema:
            type: string
            examples: ["not found"]

    SourceNotASkill:
      description: |
        The source was fetched and is not a skill the brain will store:
        nothing is at that ref or address, `SKILL.md` is missing or breaks
        the specification, a limit is passed, or the download is too large.
        The sentence says which.
      content:
        text/plain:
          schema:
            type: string
            examples: ["not found: GitHub has no such repository or ref, or cannot show it without a token"]
    SourceUnavailable:
      description: |
        The source failed to answer usefully: it is down, answered an error,
        dropped the connection, or refused the brain's token or rate limit.
        Nothing was stored; trying again later may work.
      content:
        text/plain:
          schema:
            type: string
            examples: ["the source could not be reached: GitHub answered 503"]
    SourceTimedOut:
      description: The source did not finish answering within 30 seconds. Nothing was stored.
      content:
        text/plain:
          schema:
            type: string
            examples: ["the source did not answer within 30s"]
    BadRequest:
      description: |
        The request is malformed. The reply names the problem and never echoes
        the value back, because a body can carry a credential.
      content:
        text/plain:
          schema:
            type: string
            examples: ["id must be a uuid"]

  schemas:
    TeamPermissions:
      type: object
      additionalProperties: false
      required: [actions, super_admin]
      properties:
        actions:
          type: array
          description: |
            The permissions the caller's role grants in this team, sorted.
            Empty for a super admin who is not a member.
          items:
            type: string
          examples: [["agent:write", "skill:write", "tool:write"]]
        super_admin:
          type: boolean
          description: Holds every permission in every team, whatever the role

    TeamSummary:
      type: object
      required: [runs_24h, sessions, waiting_senders, servers_failing, agents]
      properties:
        runs_24h:
          $ref: "#/components/schemas/RunCounts"
        sessions:
          type: integer
          format: int64
          description: The sessions the caller can see, open or closed
        waiting_senders:
          type: integer
          format: int64
          nullable: true
          description: |
            The senders waiting to be let in, across every channel of the
            team. Null without `channel:read`: a caller who cannot list the
            queue is not told its length. Always sent.
        servers_failing:
          type: integer
          format: int64
          description: The MCP servers whose last discovery failed
        agents:
          type: integer
          format: int64
          description: The team's agents, as the agents list lists them

    RunCounts:
      type: object
      required: [queued, running, succeeded, failed, cancelled]
      description: |
        Top-level runs created in the last 24 hours, on the brain's clock, by
        status. A delegate's run is part of its parent's and is not counted.
        Every status is present, zero included.
      properties:
        queued:
          type: integer
          format: int64
        running:
          type: integer
          format: int64
        succeeded:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        cancelled:
          type: integer
          format: int64

    TeamGraph:
      type: object
      additionalProperties: false
      required: [nodes, edges, truncated]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"
        truncated:
          type: boolean
          description: More nodes exist than were returned

    GraphNode:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: string
          format: uuid
          description: The id of the row behind it; the team's own id for the team
        label:
          type: string
          enum: [Team, Agent, Toolkit, Tool, Skill]
          description: A Toolkit is an MCP server
        name:
          type: string
        description:
          type: string
        kind:
          type: string
          description: An agent's kind, or a toolkit's transport family
        model:
          type: string
          description: The model that embedded it; absent when it carries no vector

    GraphEdge:
      type: object
      additionalProperties: false
      required: [type, from, to]
      properties:
        type:
          type: string
          enum: [OWNS, GRANTED, CONTAINS, HAS_SKILL]
        from:
          type: string
          format: uuid
        to:
          type: string
          format: uuid
        only:
          type: array
          description: On GRANTED, the tools granted; absent when every tool is
          items:
            type: string

    AuthConfig:
      type: object
      required: [environment, dev_token_accepted]
      properties:
        environment:
          type: string
          description: |
            What this deployment considers itself. A client uses it to decide
            whether a shared token is even worth trying.
          enum: [development, staging, production, test]
        dev_token_accepted:
          type: boolean
          description: |
            True only when a development token is configured *and* the
            environment is development. The value is never published — a
            client sends the one it already holds in its own environment.
        oidc:
          $ref: "#/components/schemas/OIDCConfig"

    OIDCConfig:
      type: object
      required: [issuer, client_id]
      description: |
        Absent when no identity provider is configured, rather than present
        and blank: a client that branches on the key being there would
        otherwise build a discovery URL out of an empty issuer.
      properties:
        issuer:
          type: string
          description: |
            Served verbatim, trailing slash included. Discovery lives at
            `<issuer>/.well-known/openid-configuration`, and the device
            authorization endpoint is read from there rather than guessed.
          examples: ["http://localhost:9000/application/o/openarity/"]
        client_id:
          type: string
          description: |
            OPENARITY_OIDC_AUDIENCE. The brain checks it as an audience; a
            client sends it as a client id. Same value, two names, because
            each side calls it what its own specification calls it.

    Whoami:
      type: object
      required: [id, kind, subject, teams]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Always present: every principal is resolved to a row on first
            sight, a development token included. It is the caller's own id, so
            publishing it discloses nothing they did not already send.
        kind:
          type: string
          description: How the caller authenticated
          enum: [user, service, dev]
        issuer:
          type: string
          description: The identity provider that issued the token
        subject:
          type: string
          description: |
            The caller's stable identifier at that issuer. This is what
            OPENARITY_SUPER_ADMINS matches on.
        email:
          type: string
          format: email
          description: Absent when the provider released none
        teams:
          type: array
          description: Every team the caller belongs to, never a page
          items:
            $ref: "#/components/schemas/Membership"

    Membership:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          examples: ["admin"]

    Team:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
          examples: ["platform"]
        role:
          type: string
          description: |
            The caller's role in this team. Absent when they are not a member,
            which is the normal case for a super admin.
          examples: ["admin"]
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the team was deleted. Absent for a live team. Only a super
            admin ever sees a deleted team.
        purge_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When a deleted team is erased for good, `deleted_at` plus
            `TEAM_PURGE_AFTER`. Computed, never stored, so changing the setting
            moves every pending purge. Absent for a live team.

    Member:
      type: object
      required: [user_id, subject, role]
      properties:
        user_id:
          type: string
          format: uuid
        subject:
          type: string
          description: The member's identifier at their provider
        email:
          type: string
          format: email
          description: Absent when the provider released none
        role:
          type: string
          examples: ["member"]
        name:
          type: string
          description: A channel user's name, who has no email
        channel_user:
          type: boolean
          description: A sender let in as someone new, who never logs in

    CreateTeamRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Trimmed before it is stored, and unique across teams. A name of
            only whitespace is a 400.

    AddMemberRequest:
      type: object
      required: [role]
      additionalProperties: false
      description: |
        Exactly one of `user_id` and `subject`. Neither is a 400, and so is
        both — guessing which the caller meant is how somebody ends up in a
        team they were never named for.

        `subject` exists so that adding a person you can name does not require
        permission to read the whole directory. It is the smaller authority,
        and it is the one this endpoint should need.

        The exactly-one rule is enforced by the service and stated here rather
        than written as a `oneOf`: oapi-codegen turns a top-level `oneOf` into
        a `json.RawMessage` union with a hand-rolled `MarshalJSON`, and every
        client then builds this body through generated accessors instead of a
        struct literal. Verified, not assumed.
      properties:
        user_id:
          type: string
          format: uuid
          description: |
            Unambiguous, and the only form that works when two providers issue
            the same subject. `GET /users` is where one comes from.
        subject:
          type: string
          description: |
            The identifier at the provider, matched exactly. Unique only per
            issuer, and rows survive a change of issuer, so this can match more
            than one person without a second provider ever being configured —
            that answers 409, never a guess.
          examples: ["alice"]
        role:
          type: string
          description: |
            Must name a row in `roles`. Ships with `admin` and `member`;
            deployments may add their own.
          examples: ["member"]

    TeamPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Team"
        next_cursor:
          type: string
          description: |
            Absent on the last page. Its absence is the only end-of-collection
            signal — there is no separate flag to disagree with it.

    MemberPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        next_cursor:
          type: string
          description: Absent on the last page

    Channel:
      type: object
      required: [id, team_id, provider, name, can_reply, takes_reply_url, can_notify, notify_strangers, can_show_events, reply_mode, can_pair, answers_in, can_trigger_word, trigger_word]
      properties:
        id:
          type: string
          format: uuid
          description: |
            The routing key in this channel's hook URL. Not a secret — what
            authenticates a webhook is its signature, never knowledge of the
            URL.
        team_id:
          type: string
          format: uuid
        provider:
          type: string
          description: |
            The adapter that parses this channel's webhooks, lower case and
            matched exactly: `custom`, `slack` or `telegram`.
          examples: ["custom"]
        name:
          type: string
          description: Unique within the team, case-insensitively
          examples: ["support-tickets"]
        hook_url:
          type: string
          format: uri
          description: |
            The full address to give the provider: the brain's public
            webhook address, then `/hooks/<provider>/<id>` and the
            provider's route. Absent when the brain has no
            `WEBHOOK_PUBLIC_URL`, or no adapter for `provider` — never a
            guess at an address the provider might not reach.
          examples: ["https://hooks.example.com/hooks/custom/0192f5c4-7d1e-7c3a-9b2e-4f6a8d0c1e23"]
        can_reply:
          type: boolean
          description: |
            Whether this channel's provider sends replies at all.
        takes_reply_url:
          type: boolean
          description: |
            Whether replies go to an address the channel names. `custom`
            posts to `reply_url`; `telegram` and `slack` reply in the
            conversation a message came from and take none. Offer `reply_url` only when this is
            true; it is refused otherwise.
        can_notify:
          type: boolean
          description: |
            Whether this channel's provider tells a sender nobody has let in
            that they are waiting, and later that they are in. `telegram`
            and `slack` do; `custom` does not. Offer `notify_strangers` only when this
            is true; it is refused otherwise.
        notify_strangers:
          type: boolean
          description: |
            Whether this channel does. On by default where `can_notify`;
            always false where it is not. A sender is told once per wait,
            the first time they ask the bot (in a private chat, always; in a
            group, by naming it, replying to it or sending it a command),
            and told again when they are let in, if they were told they were
            waiting. Nothing they wrote is stored.
        can_show_events:
          type: boolean
          description: |
            Whether this channel's provider sends a run's steps as messages
            of their own. `telegram`, `slack` and `custom` do; the dashboard channel
            does not, since its stream is already every step. Offer
            `reply_mode` only when this is true; it is refused otherwise.
        reply_mode:
          type: string
          enum: [final, events]
          description: |
            What the conversation is sent while a run works. `final`, the
            default, is the answer alone. `events` is each step a person
            would follow, a message of its own that stays: "Using `<tool>`…"
            and "Asking `<agent>`…", then the answer. What the model writes
            on the way to a call is not sent. The run's own bookkeeping (finding
            tools, planning, reading files) and tools' results are never
            sent; nor is anything of a run another agent was handed. Always
            `final` where `can_show_events` is false.
        can_pair:
          type: boolean
          description: |
            Whether this channel's number is linked by pairing, as a
            `whatsapp` channel's is: a phone links it by scanning a QR or
            entering a code (`/teams/{id}/channels/{channelID}/pairing`).
        answers_in:
          $ref: "#/components/schemas/AnswersIn"
        can_trigger_word:
          type: boolean
          description: |
            Whether the channel can be called by a word, as a `whatsapp`
            channel can, so a client offers `trigger_word` only there.
        trigger_word:
          type: string
          nullable: true
          description: The word a message must hold to ask the channel (see `TriggerWord`); null is none.
        reply_url:
          type: string
          format: uri
          description: |
            Where the team's replies to this channel's conversations are
            posted. Absent for a channel that does not reply.
          examples: ["https://support.example.com/openarity/replies"]

    CreatedChannel:
      allOf:
        - $ref: "#/components/schemas/Channel"
        - type: object
          required: [connected]
          properties:
            connected:
              type: boolean
              description: |
                Whether the brain pointed the provider at this channel itself,
                as it does for `telegram` (setWebhook) when it has a public
                https webhook address. False for `custom`, and for a brain with
                no such address: the person then points the provider at
                `hook_url` with `signing_secret`.
            warnings:
              type: array
              items:
                type: string
              description: |
                What the person should know about how the provider's account is
                set up, read when the channel was connected. The channel is made
                either way. A `telegram` bot whose privacy mode is on is sent, in
                a group, only commands to it and replies to it, so a message that
                only @mentions it never arrives; the warning says how to turn it
                off. Absent when there is nothing to say.
            signing_secret:
              type: string
              description: |
                Present only when the server generated it, and only in this
                response. It is never returned again by any endpoint.

                A real one is `oawh_` followed by 32 random bytes in
                base64url. The example below is deliberately not that shape:
                an example that looks like a live credential is one a secret
                scanner reports and a reader copies.
              examples: ["oawh_EXAMPLE-NOT-A-REAL-SECRET"]

    CreateChannelRequest:
      type: object
      required: [provider, name]
      properties:
        provider:
          type: string
          examples: ["custom"]
        name:
          type: string
          maxLength: 200
          examples: ["support-tickets"]
        signing_secret:
          type: string
          description: |
            The provider's own signing secret, when the provider issues one.
            Omit it to have the server generate a strong one and return it
            once. Required for `slack`, which signs with the Signing Secret
            in the app's Basic Information: one the server made would refuse
            every delivery.
        reply_url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            Where replies are posted, for a provider that posts them to an
            address (`takes_reply_url`); see `updateChannel` for what is
            accepted and what is sent.
          examples: ["https://support.example.com/openarity/replies"]
        credentials:
          type: object
          additionalProperties:
            type: string
          description: |
            What the provider asks a person for, and nothing else: for
            `telegram`, `bot_token`, the token @BotFather gave. The brain
            asks the provider about them before the channel exists, so a
            token it does not know is refused (400) and a provider out of
            reach is a 502. They go to the secret store with the signing
            secret, as one secret, and are never returned. A provider that
            asks for nothing refuses any.
          examples: [{"bot_token": "<token from @BotFather>"}]
        answers_in:
          $ref: "#/components/schemas/AnswersIn"
        notify_strangers:
          type: boolean
          description: |
            Whether the channel tells a sender nobody has let in that they
            are waiting. On when left out, where the provider can (`telegram`,
            `whatsapp`); refused with 400 for one that cannot (`custom`).
            Checked, with `answers_in`, before the provider is asked about
            `credentials`.
        trigger_word:
          $ref: "#/components/schemas/TriggerWord"

    TriggerWord:
      type: string
      maxLength: 32
      examples: ["@Fduv"]
      description: |
        The word a message must hold to ask the channel, such as `@Fduv`:
        for a WhatsApp number that is also a person's own. With one, a
        message asks only when it holds the word, in any case and as a word
        of its own (`@fduv, now?` does, `@Fduvx` does not), in a direct chat
        or a group alike, and a mention of the number no longer does. The
        owner calls it from any chat: their own message holding the word is
        answered in that chat, from their number; their others are not kept.
        Still only within `answers_in`. One word of at most 32 characters,
        with a letter or digit in it; only where `can_trigger_word`.

    AnswersIn:
      type: string
      enum: [everywhere, groups, direct]
      description: |
        Where the channel answers. `everywhere`, the default: direct chats,
        and groups where it is mentioned. `groups`: only groups where it is
        mentioned, so the direct chats of a number that is also a person's
        own are left alone. `direct`: only direct chats. Outside it a message
        asks nothing: it is stored when its sender is let in, and starts no
        run, steers none, and queues and tells no stranger.

    PairChannelRequest:
      type: object
      additionalProperties: false
      required: [method]
      properties:
        method:
          type: string
          enum: [qr, code]
        phone:
          type: string
          description: |
            For `code` alone: the number to link, with its country code.
            Spaces, dashes, dots, brackets and a leading `+` are allowed.
          examples: ["+91 98765 43210"]

    ChannelPairing:
      type: object
      required: [state, held]
      properties:
        state:
          type: string
          enum: [unpaired, pairing, connected]
        method:
          type: string
          enum: [qr, code]
          description: What the pairing under way was asked to show.
        qr:
          type: string
          description: |
            The text to draw as a QR code, while a QR pairing waits to be
            scanned. It changes about every 20 seconds.
        code:
          type: string
          description: The code to enter on the phone, while a code pairing waits.
          examples: ["ABCD-1234"]
        phone:
          type: string
          description: The linked number, once `connected`.
          examples: ["919876543210"]
        error:
          type: string
          description: Why the last pairing stopped, or the device was unlinked.
        held:
          type: boolean
          description: |
            Whether a `brain whatsapp` role holds the channel now. Without
            one nothing pairs and nothing is sent: the deployment runs no
            role, or it is down.
        updated_at:
          type: string
          format: date-time
        shared_with:
          type: array
          description: |
            Once `connected`, the other channels linked to this number, in
            this team or another. Every message to the number reaches each of
            them, so each answers only messages that hold its trigger word,
            whoever sent them. Absent when the number is this channel's alone.
          items:
            $ref: "#/components/schemas/ChannelSharer"
        needs_trigger_word:
          type: boolean
          description: |
            True when the number is shared and this channel answers nothing
            yet: it, or another channel on the number, has no trigger word, or
            two words could be held by one message. Set the words with
            `PATCH /teams/{id}/channels/{channelID}`.

    ChannelSharer:
      type: object
      required: [channel_id, team_id, name, trigger_word, editable]
      properties:
        channel_id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        name:
          type: string
        trigger_word:
          type: string
          description: Its word; "" when it has none
        editable:
          type: boolean
          description: Whether the caller may set its word, with `channel:write` in its team

    UpdateChannelRequest:
      type: object
      minProperties: 1
      properties:
        answers_in:
          $ref: "#/components/schemas/AnswersIn"
        trigger_word:
          type: string
          maxLength: 32
          description: |
            The word a message must hold to ask the channel (see
            `TriggerWord`); "" takes it away. On a number other channels link
            too, it cannot be taken away, nor be a word one message could hold
            with another channel's on that number: 409, naming that channel.
        notify_strangers:
          type: boolean
          description: Whether the channel tells a sender nobody has let in that they are waiting, and that they are in
        reply_mode:
          type: string
          enum: [final, events]
          description: The run's answer alone, or each of its steps and then the answer
        reply_url:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: The URL replies go to; null or an empty string stops sending them

    ListedChannel:
      description: |
        A row of the channels list, with how recently it was used. Both facts
        count only the sessions the caller may open: their own direct
        sessions, and everyone's with `session:read_all`.
      allOf:
        - $ref: "#/components/schemas/Channel"
        - type: object
          required: [last_message_at, sessions_24h]
          properties:
            last_message_at:
              type: string
              format: date-time
              nullable: true
              description: The last message of its newest session; null for a channel never used
            sessions_24h:
              type: integer
              format: int64
              description: Its sessions with a message in the last 24 hours, on the brain's clock

    ChannelPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListedChannel"
        next_cursor:
          type: string
          description: Absent on the last page

    PendingSender:
      type: object
      required: [sender_ref, sender_name, seen_count, first_seen, last_seen]
      properties:
        sender_ref:
          type: string
          maxLength: 256
          description: |
            The provider's own id for this person, unique within the channel
            rather than globally — Slack's ids repeat across workspaces, which
            is why approval is per channel.
        sender_name:
          type: string
          maxLength: 64
          description: |
            What they call themselves, which they typed. Control characters
            are stripped and it is clipped on the way in, but two people may
            still share a name — that is the reason approval matches on
            `sender_ref` and shows this only as a hint.
        seen_count:
          type: integer
          format: int32
          description: How many messages they have sent that were dropped
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time

    PendingSenderPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PendingSender"
        next_cursor:
          type: string
          description: Absent on the last page

    TeamPendingSender:
      allOf:
        - $ref: "#/components/schemas/PendingSender"
        - type: object
          required: [channel_id, channel_name, channel_provider]
          properties:
            channel_id:
              type: string
              format: uuid
              description: The channel they wrote in on; approving them is done there.
            channel_name:
              type: string
            channel_provider:
              type: string
              examples: [slack]

    TeamPendingSenderPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TeamPendingSender"
        next_cursor:
          type: string
          description: Absent on the last page

    ChannelSender:
      type: object
      required: [sender_ref, user_id, created_at]
      properties:
        sender_ref:
          type: string
          maxLength: 256
        user_id:
          type: string
          format: uuid
          description: The user this sender speaks as
        created_at:
          type: string
          format: date-time
          description: When they were approved
        name:
          type: string
          description: The user's name, or their email; empty when they have neither
        role:
          type: string
          description: The user's role in this team; empty once they have left it
        channel_user:
          type: boolean
          description: Whether the sender has a user of their own, let in as someone new

    ChannelSenderPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChannelSender"
        next_cursor:
          type: string
          description: Absent on the last page

    ApproveSenderRequest:
      type: object
      required: [sender_ref]
      description: Exactly one of `user_id` and `new`.
      properties:
        sender_ref:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            Taken from the pending queue, or supplied directly when the
            provider id is already known.
        user_id:
          type: string
          format: uuid
          description: |
            Who this sender speaks as. Must already be a member of the
            channel's team.
        new:
          $ref: "#/components/schemas/NewSender"

    NewSender:
      type: object
      required: [role]
      description: The sender let in as someone new, with a user of their own.
      properties:
        role:
          type: string
          examples: ["guest"]
        name:
          type: string
          maxLength: 64
          description: Cleaned of control characters; empty takes the name they gave while waiting.

    UpdateMemberRequest:
      type: object
      description: At least one of `role` and `name`.
      additionalProperties: false
      properties:
        role:
          type: string
          minLength: 1
          examples: ["member"]
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: A channel user's only; a user who logs in has their identity provider's.

    Session:
      type: object
      required: [id, kind, status, started_at, last_message_at, builder]
      properties:
        builder:
          type: boolean
          description: |
            A conversation on the dashboard channel that the team's builder
            answers, rather than its hub. Fixed when the conversation starts.
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The channel it arrived on, absent when it did not arrive on one —
            a session started from the dashboard or the API has no webhook
            behind it.
        provider_ref:
          type: string
          maxLength: 256
          description: |
            The adapter's answer to "which conversation is this", and the whole
            of session identity. What goes in it differs by platform and is the
            adapter's decision: a Slack thread is `C123:1699999999.000100`, a
            Slack direct message is `D01ABC`, WhatsApp is a phone number
            because there is nothing else, and a custom webhook sends whatever
            its own service calls an episode.
        user_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Who a `direct` session is with, and absent for anything else — a
            group names nobody on purpose, because several people speak in it.

            It is also absent on a direct session whose participant has since
            been deleted. That session is readable by `session:read_all` only:
            absent means nobody, never everybody.
        kind:
          type: string
          enum: [direct, group, thread]
          description: |
            How many people can speak, not what the provider calls the room.
            Slack's `mpim` looks like a direct message and is a group.

            It decides who may read the session: a `group` or `thread` is the
            team's, a `direct` is one person's.
        status:
          $ref: "#/components/schemas/SessionStatus"
          description: |
            Always `open` today; nothing closes a session yet. It exists
            because a provider gives you identity and never episode — a thread
            ends on its own, a direct message never does — so an idle rule is
            the only thing that can say where a conversation stopped.
        started_at:
          type: string
          format: date-time
        last_message_at:
          type: string
          format: date-time
          description: The order these are listed in
        first_asked:
          type: string
          nullable: true
          description: |
            The input of the oldest top-level run started in this session, cut
            to 140 characters as `last_message` is, and null when no run was
            started in it. A direct session started from the dashboard or the
            API has no `provider_ref`, so this is what names it. A delegate's
            run is work handed on, not a question asked, so it never counts.
            Sent by the lists and by a single session's read.
        channel_name:
          type: string
          nullable: true
          description: |
            The channel's name, and null with no channel. Sent by the two
            lists, null or not; absent from a single session's read.
        participant:
          type: string
          nullable: true
          description: |
            Who the session is with, as an email, else as the provider's
            subject: for a `direct` session its participant, for a group or a
            thread whoever sent the newest message. Null with no messages.
            Sent by the lists only.
        last_message:
          type: string
          nullable: true
          description: |
            The newest message's text, cut to 140 characters where a
            character starts and ended with `…` when it was cut. Null with no
            messages. It is a stranger's text, and is rendered as text. Sent by
            the lists only.
        latest_run_status:
          $ref: "#/components/schemas/RunStatus"
          description: |
            How the newest top-level run in this session stands, and null
            with no run. A delegate's run is part of its parent's, so it never
            counts here. Sent by the lists only.

    SessionStatus:
      type: string
      enum: [open, closed]

    SessionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        next_cursor:
          type: string
          description: Absent on the last page

    Message:
      type: object
      required: [id, external_id, user_id, text, received_at]
      properties:
        id:
          type: string
          format: uuid
        external_id:
          type: string
          description: |
            The provider's own id for this message, unique within its channel
            rather than globally. It is the idempotency key: a provider
            retrying a delivery produces no second row.
        user_id:
          type: string
          format: uuid
          description: The approved user this sender speaks as
        text:
          type: string
          description: |
            As the provider sent it. Never rewritten, so what arrived is still
            auditable after anything renders it.
        sent_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the sender says they sent it, absent whenever the provider did
            not say. A clock nobody here controls, so nothing orders on it.
        received_at:
          type: string
          format: date-time
          description: When it reached us. This is the order.

    SayRequest:
      type: object
      required: [text, key]
      properties:
        text:
          type: string
          maxLength: 102400
          description: What the person says. At most 100 KiB, with no NUL character, and not blank.
        key:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
          description: |
            The caller's own name for this send. A retry carries the same key
            and is the same send.
        builder:
          type: boolean
          description: |
            On a new conversation only: the team's builder answers it rather
            than the hub. It reads the team and proposes blueprints, writes
            nothing, and runs on the team's model. Who answers a conversation
            is decided when it starts, so a message in one that sets it is
            refused with a 400.

    SayUpload:
      type: object
      required: [key]
      properties:
        text:
          type: string
          maxLength: 102400
          description: What the person says, as in `SayRequest`. It may be empty when a file is sent.
        key:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
          description: As in `SayRequest`.
        builder:
          type: boolean
          description: As in `SayRequest`, sent as `true` or `false`.
        files:
          type: array
          maxItems: 8
          description: |
            The files sent with the message, each at most 25 MB: images (png,
            jpeg, gif, webp), PDF, plain text, zip, mp3 or wav, as their bytes
            say. The part's filename is kept, cleaned, as the file's name.
          items:
            type: string
            format: binary

    Said:
      type: object
      required: [session_id, message_id]
      properties:
        session_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
          description: The run that answers it, absent when none does.
        steered:
          type: boolean
          description: The run was already working, and the message was sent to it.
        unanswered:
          type: string
          description: Why no run answers the message, which is stored all the same.

    SessionEventPart:
      type: object
      description: |
        One piece of what a message carries: its text, or a file sent with
        it. A part of a type a reader does not know is kept with its type.
      required: [type]
      properties:
        type:
          type: string
          description: "`text` or `file`."
        text:
          type: string
        file:
          type: object
          description: |
            A file sent with the message, named by its id; its bytes are read
            with `getSessionAttachment`.
          required: [id, filename, media_type, size]
          properties:
            id:
              type: string
              format: uuid
            filename:
              type: string
            media_type:
              type: string
            size:
              type: integer
              format: int64
              minimum: 0
    SessionEventMessage:
      type: object
      description: |
        The data of a `message` frame on a session's stream. Something a person said. `state` is `pending` while it waits for a run; a message that asks nothing, one said in a group without addressing the bot, has none.
      required: [id, parts]
      properties:
        at:
          type: string
          format: date-time
        run_id:
          type: string
          format: uuid
        id:
          type: string
        user_id:
          type: string
        parts:
          type: array
          items:
            $ref: "#/components/schemas/SessionEventPart"
        state:
          type: string
          enum: [pending]
    SessionEventMessageConsumed:
      type: object
      description: |
        The data of a `message_consumed` frame on a session's stream. A run taking messages: the one it started from, or ones sent while it worked.
      required: [message_ids]
      properties:
        at:
          type: string
          format: date-time
        run_id:
          type: string
          format: uuid
        message_ids:
          type: array
          items:
            type: string
    SessionEventRunStarted:
      type: object
      description: |
        The data of a `run_started` frame on a session's stream. A run beginning; `parent_run_id` names the run that handed it the work.
      required: [agent]
      properties:
        at:
          type: string
          format: date-time
        run_id:
          type: string
          format: uuid
        parent_run_id:
          type: string
        agent:
          type: string
    SessionEventStepStarted:
      type: object
      description: |
        The data of a `step_started` frame on a session's stream. A run making its next model call.
      required: [step]
      properties:
        at:
          type: string
          format: date-time
        run_id:
          type: string
          format: uuid
        step:
          type: integer
    SessionEventTextMessageChunk:
      type: object
      description: |
        The data of a `text_message_chunk` frame on a session's stream. A piece of what a run is saying, in order. Pieces with the same `message_id` are one model call's text; the last of a run's is its answer.
      required: [delta]
      properties:
        at:
          type: string
          format: date-time
        run_id:
          type: string
          format: uuid
        message_id:
          type: string
          description: |
            `<run_id>:<step>:text`. Absent on text recorded before messages were named; group it by the `step_started` before it.
        delta:
          type: string
        truncated:
          type: boolean
    SessionEventReasoningMessageChunk:
      type: object
      description: |
        The data of a `reasoning_message_chunk` frame on a session's stream. A piece of what a run is thinking rather than saying: the model's own reasoning, when its provider sends it, or a loop's plan or critique. Show it apart from the answer, folded away.
      required: [delta]
      properties:
        at:
          type: string
          format: date-time
        run_id:
          type: string
          format: uuid
        message_id:
          type: string
          description: |
            `<run_id>:<step>:reasoning`.
        delta:
          type: string
        truncated:
          type: boolean
    SessionEventToolCallChunk:
      type: object
      description: |
        The data of a `tool_call_chunk` frame on a session's stream. A run calling a tool, with all of its arguments as JSON text.
      required: [tool_call_id, name, arguments]
      properties:
        at:
          type: string
          format: date-time
        run_id:
          type: string
          format: uuid
        tool_call_id:
          type: string
        name:
          type: string
        arguments:
          type: string
        truncated:
          type: boolean
    SessionEventToolCallResult:
      type: object
      description: |
        The data of a `tool_call_result` frame on a session's stream. What a tool call returned, or why it failed.
      required: [tool_call_id, name, content, duration_ms]
      properties:
        at:
          type: string
          format: date-time
        run_id:
          type: string
          format: uuid
        tool_call_id:
          type: string
        name:
          type: string
        content:
          type: string
        error:
          type: string
        truncated:
          type: boolean
        duration_ms:
          type: integer
    SessionEventUsage:
      type: object
      description: |
        The data of a `usage` frame on a session's stream. What one model call spent.
      required: [model, input_tokens, output_tokens, cached_input_tokens]
      properties:
        at:
          type: string
          format: date-time
        run_id:
          type: string
          format: uuid
        model:
          type: string
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cached_input_tokens:
          type: integer
    SessionEventCompacted:
      type: object
      description: |
        The data of a `compacted` frame on a session's stream. A run shrinking its context to carry on.
      required: [reason, cleared, folded, before, after]
      properties:
        at:
          type: string
          format: date-time
        run_id:
          type: string
          format: uuid
        reason:
          type: string
        cleared:
          type: integer
        folded:
          type: integer
        before:
          type: integer
        after:
          type: integer
        summary:
          type: string
        error:
          type: string
    SessionEventRunFinished:
      type: object
      description: |
        The data of a `run_finished` frame on a session's stream. A run ending, with its whole answer when it has one.
      required: [status]
      properties:
        at:
          type: string
          format: date-time
        run_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [succeeded, failed, cancelled]
        output:
          type: string
        error:
          type: string
    SessionEventApprovalRequested:
      type: object
      description: |
        The data of an `approval_requested` frame on a session's stream. A run asking a person before a call: the call is not made, and the run says why in its own words and waits.
      required: [approval_id, tool_call_id, tool, class, summary, code, expires_at]
      properties:
        at:
          type: string
          format: date-time
        run_id:
          type: string
          format: uuid
        approval_id:
          type: string
        tool_call_id:
          type: string
        tool:
          type: string
        class:
          type: string
          enum: [read, write, destructive]
        summary:
          type: string
        code:
          type: string
        expires_at:
          type: string
          format: date-time
    SessionEventApprovalDecided:
      type: object
      description: |
        The data of an `approval_decided` frame on a session's stream. A request answered by a person, expired with nobody answering, or cancelled: with its run, or because the person wrote again instead (`superseded`).
      required: [approval_id, decision]
      properties:
        at:
          type: string
          format: date-time
        run_id:
          type: string
          format: uuid
        approval_id:
          type: string
        decision:
          type: string
          enum: [approved, denied, expired, cancelled]
        by:
          type: string
        via:
          type: string
        scope:
          type: string
          enum: [once, run]
        superseded:
          type: boolean
    SessionEventRunWaiting:
      type: object
      description: |
        The data of a `run_waiting` frame on a session's stream. A run that stopped for a person's answer rather than finishing; `said` is what it told them, in its own words.
      required: [reason]
      properties:
        at:
          type: string
          format: date-time
        run_id:
          type: string
          format: uuid
        reason:
          type: string
        said:
          type: string
    SessionEventCustom:
      type: object
      description: |
        The data of a `custom` frame on a session's stream. An event the catalog has no kind for, named by the kind the run recorded: `delegated`, `plan`, `wrap_up` and the like.
      required: [name]
      properties:
        at:
          type: string
          format: date-time
        run_id:
          type: string
          format: uuid
        name:
          type: string
        value: {}

    MessagePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        next_cursor:
          type: string
          description: Absent on the last page

    Attachment:
      type: object
      required: [id, message_id, filename, media_type, size_bytes, created_at]
      properties:
        id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
          description: The message this file arrived with
        filename:
          type: string
          description: |
            What the sender called it, with directory components and control
            characters removed and the length bounded. A label, not a path, and
            possibly empty — some providers send no name at all.
        media_type:
          type: string
          description: |
            Decided from the bytes when the file arrived, never from the
            filename and never from what the sender claimed. This is the exact
            value the download route sends as Content-Type.
        size_bytes:
          type: integer
          format: int64
          description: Measured, not claimed
        created_at:
          type: string
          format: date-time

    AttachmentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        next_cursor:
          type: string
          description: Absent on the last page

    User:
      type: object
      required: [id, issuer, subject]
      properties:
        id:
          type: string
          format: uuid
        issuer:
          type: string
          description: |
            The identity provider that issued their token, from the `iss`
            claim. Identity is `(issuer, subject)`, so this is not decoration:
            it is the half that makes two rows with the same subject two
            different people. Without it a listing cannot be read.
          examples: ["https://auth.example.com/application/o/openarity/"]
        subject:
          type: string
          description: The identifier at their provider
          examples: ["akadmin"]
        email:
          type: string
          format: email
          description: Absent when the provider released none

    UserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_cursor:
          type: string
          description: Absent on the last page

    SkillSummary:
      type: object
      required: [id, team_id, name, description, source, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        name:
          type: string
          description: |
            The frontmatter's name: 1-64 lower-case letters, digits and single
            hyphens. Unique within the team.
          examples: ["pdf-processing"]
        description:
          type: string
          description: What the model reads when deciding whether to load it
          examples: ["Extract PDF text, fill forms, merge files. Use when handling PDFs."]
        source:
          type: string
          enum: [upload, github, url]
          description: Where the directory came from
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Skill:
      allOf:
        - $ref: "#/components/schemas/SkillSummary"
        - type: object
          required: [metadata, body, files]
          properties:
            license:
              type: string
              description: Absent when the frontmatter sets none
            compatibility:
              type: string
              description: Absent when the frontmatter sets none
            metadata:
              type: object
              additionalProperties:
                type: string
              description: The frontmatter's metadata; empty when it sets none
            allowed_tools:
              type: string
              description: Absent when the frontmatter sets none
            source_ref:
              type: string
              description: What was imported; absent for an upload
              examples: ["github:anthropics/skills/skills/pdf@main"]
            source_sha:
              type: string
              description: The exact commit or digest imported; absent for an upload
            body:
              type: string
              description: SKILL.md after its frontmatter, loaded only when the model asks for it
            files:
              type: array
              description: Every file beside SKILL.md, in path order
              items:
                $ref: "#/components/schemas/SkillFile"

    SkillFile:
      type: object
      required: [path, size, sha256, media_type]
      properties:
        path:
          type: string
          examples: ["scripts/fill.py"]
        size:
          type: integer
          format: int64
          description: Bytes
        sha256:
          type: string
          description: Hex, as sha256sum prints it
        media_type:
          type: string
          description: Sniffed from the bytes when uploaded, never from the name
          examples: ["text/plain; charset=utf-8"]

    SkillUpload:
      type: object
      required: [files]
      properties:
        files:
          type: array
          description: One part per file; each part's filename is its path in the skill
          items:
            type: string
            format: binary

    SkillImportRequest:
      type: object
      required: [source]
      additionalProperties: false
      properties:
        source:
          type: string
          description: A GitHub folder, or the https address of a zip
          examples:
            - "github:anthropics/skills/skills/pdf@main"
            - "https://hub.example.com/skills/pdf.zip"

    ListedSkill:
      description: A row of the skills list, with how many agents hold the skill.
      allOf:
        - $ref: "#/components/schemas/SkillSummary"
        - type: object
          required: [agent_count]
          properties:
            agent_count:
              type: integer
              format: int64
              description: The team's agents granted this skill; zero when none is

    SkillPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListedSkill"
        next_cursor:
          type: string
          description: Absent on the last page

    MCPServer:
      type: object
      required: [id, team_id, name, env, auth_kind, bare, created_at, updated_at]
      description: Exactly one of `url` and `command` is present.
      properties:
        id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        name:
          type: string
          description: |
            Unique within the team, case-insensitively. Each tool reaches the
            model as `<name>__<tool>`.
          examples: ["github"]
        url:
          type: string
          format: uri
          description: A remote server, spoken to over streamable HTTP
          examples: ["https://mcp.example.com/v1"]
        command:
          type: array
          items:
            type: string
          description: A local server, started with this argv and spoken to over stdio
          examples: [["npx", "-y", "@modelcontextprotocol/server-filesystem"]]
        env:
          type: object
          additionalProperties:
            type: string
          description: |
            Variables set for a command server, each a secret reference.
            Always an object; empty for a url server.
          examples: [{"GITHUB_TOKEN": "teams/<team_id>/mcp/github#token"}]
        vars:
          type: object
          additionalProperties:
            type: string
          description: A command server's plain settings, set as they are in its room. Absent when there are none.
          examples: [{"IMAP_HOST": "imap.gmail.com"}]
        egress:
          type: array
          items:
            $ref: "#/components/schemas/Egress"
          description: Where a command server's room may connect; it reaches nothing else. Absent when there is nowhere.
        auth_secret_ref:
          type: string
          description: |
            A url server's bearer token. A secret reference, `teams/<team_id>/mcp/<name>#<key>`, in this team. The brain reads the secret when it connects; the value is never stored or returned.
        auth_kind:
          type: string
          enum: [static, oauth]
          description: |
            How the server is reached: `static`, with `auth_secret_ref` or no
            token at all, or `oauth`, signed in to on the dashboard as the
            client named here, or with none named, as one the brain registers.
        oauth_client_id:
          type: string
          description: |
            The OAuth client a server that signs in signs in as, when one was
            registered for it by hand. Absent, the brain registers its own; see
            `oauth_registration`.
        oauth_client_secret_ref:
          type: string
          description: The client's secret, when it is a confidential client. A secret reference; the value is never returned.
        oauth_scopes:
          type: array
          items:
            type: string
          description: The scopes a sign-in asks for. Absent, the ones the server's metadata offers.
        connection:
          $ref: "#/components/schemas/MCPServerConnection"
        oauth_registration:
          $ref: "#/components/schemas/MCPServerOAuthRegistration"
        bare:
          type: boolean
          description: Tools reach the model as `<tool>` rather than `<name>__<tool>`
        trust_hints:
          type: boolean
          description: Whether the server's own read-only and destructive hints are believed when a call is classed for approval. Set with the trust-hints route.
        discovered_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When its tools were last listed, and null until then. Always sent;
            optional here only so a generated client decodes null as absent
            rather than as the zero time.
        last_discovery_error:
          type: string
          nullable: true
          description: |
            Why the last discovery failed, in the words the caller was
            answered with; null when it succeeded or none has run. A server
            has failed when this is set. A failure that was the brain's own,
            such as the secret store being down, is not recorded. Always sent.
        last_discovery_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When discovery was last tried, whether or not it worked, and null
            until then. Always sent; optional here for the reason
            `discovered_at` is.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MCPServerOAuthRegistration:
      type: object
      nullable: true
      required: [client_id, registered_at]
      description: |
        The client the brain registered for a server with no
        `oauth_client_id` of its own, or null when it has registered none.
        Never its secret. Always sent.
      properties:
        client_id:
          type: string
          description: As the authorization server issued it, and shows on its consent screen
        registered_at:
          type: string
          format: date-time

    MCPServerConnection:
      type: object
      nullable: true
      required: [status, connected_at, scopes_granted]
      description: |
        A server's sign-in, or null when it has none: never made, or
        disconnected. Its tokens are never returned. Always sent.
      properties:
        status:
          type: string
          enum: [connected, needs_sign_in]
          description: |
            `needs_sign_in` once the authorization server refused a refresh,
            or the server refused a renewed token or asked for more scope.
            Calls to the server fail until someone connects it again.
        reason:
          type: string
          nullable: true
          description: Why it needs signing in again
        connected_by:
          type: string
          format: uuid
          nullable: true
          description: Who signed in; null once that person is gone
        connected_at:
          type: string
          format: date-time
        scopes_granted:
          type: array
          items:
            type: string
        access_expires_at:
          type: string
          format: date-time
          nullable: true

    MCPServerRequest:
      type: object
      required: [name]
      additionalProperties: false
      description: |
        Exactly one of `url` and `command`. Every value that is a credential
        is a secret reference rather than the secret, so none reaches the
        database.
      properties:
        name:
          type: string
          pattern: "^[a-zA-Z0-9_-]{1,64}$"
          examples: ["github"]
        url:
          type: string
          format: uri
          description: http or https, with no user, password, query string or fragment
          examples: ["https://mcp.example.com/v1"]
        command:
          type: array
          minItems: 1
          items:
            type: string
          description: The program and its arguments; the first is not empty
        env:
          type: object
          description: Only with `command`. Each key is a variable name and each value a secret reference.
          additionalProperties:
            type: string
            pattern: "^teams/[0-9a-f-]{36}/mcp/[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*#[A-Za-z0-9_-]+$"
          propertyNames:
            pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        auth_secret_ref:
          type: string
          pattern: "^teams/[0-9a-f-]{36}/mcp/[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*#[A-Za-z0-9_-]+$"
          description: Only with `url`. A secret reference, `teams/<team_id>/mcp/<name>#<key>`, in this team. The brain reads the secret when it connects; the value is never stored or returned.
          examples: ["teams/<team_id>/mcp/github#token"]
        vars:
          type: object
          maxProperties: 64
          additionalProperties:
            type: string
            maxLength: 4096
          propertyNames:
            pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
          description: |
            Only with `command`. Plain settings for its room, shown as they
            are; a secret goes in `env` as a reference. A name is in one or
            the other, never both.
        egress:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/Egress"
          description: |
            Only with `command`. Where its room may connect, each once: a host
            name or a public address, and a port. Name the package registry
            too, `registry.npmjs.org:443`, for a command that installs as it
            starts.
        bare:
          type: boolean
          default: false
        auth_kind:
          type: string
          enum: [static, oauth]
          default: static
          description: |
            `oauth` for a url server signed in to on the dashboard: it takes no
            `auth_secret_ref`, and `oauth_client_id` only for a client
            registered by hand; without one, the brain registers its own at the
            first sign-in. Changing the url, the
            client or the kind ends a sign-in already made; changing only the
            scopes keeps it, and connecting again asks for them.
        oauth_client_id:
          type: string
          minLength: 1
          maxLength: 512
          description: Only with `auth_kind` oauth, and optional there. A client registered by hand with the server's authorization server, its redirect URI `<PUBLIC_URL>/oauth/mcp/callback`. Absent, the brain registers one itself.
        oauth_client_secret_ref:
          type: string
          pattern: "^teams/[0-9a-f-]{36}/mcp/[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*#[A-Za-z0-9_-]+$"
          description: Only with `oauth_client_id`, for a confidential client. A secret reference in this team.
        oauth_scopes:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
          description: Only with `auth_kind` oauth. The scopes to ask for, in place of the ones the server's metadata offers.

    Egress:
      type: object
      required: [host, port]
      additionalProperties: false
      properties:
        host:
          type: string
          maxLength: 253
          description: A host name, or a public address; never private, loopback or link-local
          examples: ["imap.gmail.com"]
        port:
          type: integer
          minimum: 1
          maximum: 65535
          examples: [993]

    MCPServerPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MCPServer"
        next_cursor:
          type: string
          description: Absent on the last page

    MCPTool:
      type: object
      required: [name, description, input_schema]
      properties:
        name:
          type: string
          description: As the server names it, without the server's prefix
          examples: ["search_code"]
        description:
          type: string
        input_schema:
          type: object
          description: The JSON Schema of the tool's arguments, exactly as the server sent it

    MCPToolList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MCPTool"

    ModelRef:
      type: object
      required: [name, max_tokens]
      properties:
        name:
          type: string
          description: As the model gateway names it
          examples: ["anthropic/claude-opus-5"]
        max_tokens:
          type: integer
          format: int32
          minimum: 1
        temperature:
          type: number
          format: double
          minimum: 0
          maximum: 2

    ParserModel:
      type: object
      required: [name]
      description: Only with parser. max_tokens and temperature fall back to the SDK's defaults.
      properties:
        name:
          type: string
        max_tokens:
          type: integer
          format: int32
          minimum: 1
        temperature:
          type: number
          format: double
          minimum: 0
          maximum: 2

    OutputSchema:
      type: object
      required: [name, json]
      properties:
        name:
          type: string
          description: Names the schema to the model
          examples: ["verdict"]
        description:
          type: string
        json:
          type: object
          description: The JSON Schema the answer has to fit
        strict:
          type: boolean

    MCPServerGrant:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: An MCP server of the same team
        allow:
          type: array
          minItems: 1
          description: The tools granted, by their server-side names. Left out, every tool is granted.
          items:
            type: string
            pattern: "^[a-zA-Z0-9_-]{1,64}$"

    AgentSummary:
      type: object
      required: [id, team_id, name, description, kind, model, pattern, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        kind:
          type: string
          description: custom for agents a team defines; the brain's own agents carry other kinds
          examples: ["custom"]
        model:
          $ref: "#/components/schemas/ModelRef"
        pattern:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Agent:
      allOf:
        - $ref: "#/components/schemas/AgentSummary"
        - type: object
          required: [instructions, max_steps, steer_continuations, parser, mcp_servers, skills, delegation, delegates, web, browser, tool_notes]
          properties:
            instructions:
              type: string
            max_steps:
              type: integer
              format: int32
            steer_continuations:
              type: integer
              format: int32
            output_schema:
              $ref: "#/components/schemas/OutputSchema"
            parser:
              type: boolean
            parser_model:
              $ref: "#/components/schemas/ParserModel"
            mcp_servers:
              type: array
              description: Ordered by id
              items:
                $ref: "#/components/schemas/MCPServerGrant"
            skills:
              type: array
              description: Ordered by id
              items:
                type: string
                format: uuid
            token_budget:
              type: integer
              format: int64
              description: |
                What one run of the agent may spend, input and output tokens
                together. Absent when the agent uses the deployment's default.
            delegation:
              $ref: "#/components/schemas/Delegation"
            delegates:
              type: array
              description: The agents it may delegate to when delegation is listed. Ordered by id
              items:
                type: string
                format: uuid
            web:
              type: boolean
              description: |
                Whether the agent has web_search and web_fetch when it runs as
                itself. The team's hub has both whatever this says.
            browser:
              type: boolean
              description: |
                Whether the agent may drive the team's browser when it runs as
                itself. The team's hub may whatever this says.
            tool_notes:
              type: array
              description: |
                Usage notes on tools, for this agent, left by approved
                improvements and told with each tool in its runs. Read-only:
                a replace neither sends nor clears them. Ordered by server, then tool.
              items:
                $ref: "#/components/schemas/ToolNote"

    ToolNote:
      type: object
      required: [server, tool, note]
      properties:
        server:
          type: string
          format: uuid
        tool:
          type: string
        note:
          type: string

    AgentRequest:
      type: object
      required: [name, model, pattern, max_steps]
      additionalProperties: false
      properties:
        kind:
          type: string
          description: Optional. custom on create; on replace, the kind the agent already has.
        name:
          type: string
          maxLength: 200
          description: Unique within the team, case-insensitively
          examples: ["triage"]
        description:
          type: string
          description: What it is for, shown where agents are chosen
        instructions:
          type: string
          description: The system prompt
          examples: ["You sort incoming issues."]
        model:
          $ref: "#/components/schemas/ModelRef"
        pattern:
          type: string
          description: |
            The loop the agent works through a task with. It must be one the
            brain runs — `GET /teams/{id}/loops` lists them — and any other is
            a 400 naming those it does run.
          examples: ["react"]
        max_steps:
          type: integer
          format: int32
          minimum: 1
        steer_continuations:
          type: integer
          format: int32
          minimum: 0
          description: How many times a run may carry on for a message that arrived as it finished
        output_schema:
          $ref: "#/components/schemas/OutputSchema"
        parser:
          type: boolean
          description: A second model fits the answer to output_schema; needs output_schema
        parser_model:
          $ref: "#/components/schemas/ParserModel"
        mcp_servers:
          type: array
          items:
            $ref: "#/components/schemas/MCPServerGrant"
        skills:
          type: array
          items:
            type: string
            format: uuid
        token_budget:
          type: integer
          format: int64
          minimum: 1
          maximum: 100000000
          description: |
            What one run of the agent may spend, input and output tokens
            together; a run that goes past it fails, naming the budget. Leave
            it out for the deployment's default, 1,000,000. A run keeps the
            budget it started with if the agent is edited while it runs.
          examples: [200000]
        delegation:
          $ref: "#/components/schemas/Delegation"
        delegates:
          type: array
          description: |
            Read only when delegation is listed, and refused otherwise. Agents
            of this team, by id, each once; never the agent itself.
          items:
            type: string
            format: uuid
        web:
          type: boolean
          default: false
          description: |
            Gives the agent web_search and web_fetch. The team's hub has both
            whatever this says. web_search also needs the team's search
            provider; web_fetch needs nothing. Left out, it is false, and a
            PUT replaces the whole agent, so a replace that leaves it out
            takes the grant away.
        browser:
          type: boolean
          default: false
          description: |
            Gives the agent a browser to drive: open a page, read it, click
            and type. The team's hub has one whatever this says. It needs the
            team's browser provider, and is apart from web: a browser runs a
            page's scripts and acts on it. Left out, it is false, and a PUT
            that leaves it out takes the grant away.

    Delegation:
      type: string
      enum: [team, listed, none]
      default: none
      description: |
        Whom the agent may hand work to with the delegate tool: any other
        agent in its team, only its delegates, or no one. An agent set to
        none is not given the tool. Left out of a request, it is none: the
        agent works alone, and a PUT replaces the whole agent.

    ListedAgent:
      description: |
        A row of the agents list: the summary, how the agent works with the
        web and with other agents, and what it is granted, as counts. The
        grants themselves are read from the agent.
      allOf:
        - $ref: "#/components/schemas/AgentSummary"
        - type: object
          required: [delegation, web, browser, mcp_server_count, skill_count, delegate_count]
          properties:
            delegation:
              $ref: "#/components/schemas/Delegation"
            web:
              type: boolean
              description: Whether it has web_search and web_fetch by its own grant
            browser:
              type: boolean
              description: Whether it may drive the team's browser by its own grant
            mcp_server_count:
              type: integer
              format: int64
              description: The MCP servers it is granted
            skill_count:
              type: integer
              format: int64
              description: The skills it is granted
            delegate_count:
              type: integer
              format: int64
              description: The agents it lists as delegates; read only when delegation is listed

    Blueprint:
      type: object
      additionalProperties: false
      description: |
        What a team should hold. Items refer to each other, and to the team's
        own, by name. At most 50 of each kind.
      properties:
        mcp_servers:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/BlueprintMCPServer"
        skills:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/BlueprintSkill"
        agents:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/BlueprintAgent"
        approvals:
          $ref: "#/components/schemas/BlueprintApprovals"

    BlueprintApprovals:
      type: object
      additionalProperties: false
      description: |
        Standing answers for the team's tools. A blueprint can only make a
        team stricter: a rule asks or denies, never allows, and a rule the
        team holds may be made stricter (allow to ask to deny, or someone
        else to answer) but never looser. A rule the blueprint does not name
        is left as it is. Applying one needs `team:settings`. An export
        carries the rules that ask or deny.
      properties:
        rules:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/BlueprintApprovalRule"

    BlueprintApprovalRule:
      type: object
      required: [mode]
      additionalProperties: false
      description: Exactly one of `tool` and `server`.
      properties:
        tool:
          type: string
          maxLength: 200
          description: "`<server>__<tool>`, or a built-in's own name."
        server:
          type: string
          maxLength: 200
          description: Every tool of this MCP server.
        mode:
          type: string
          enum: [ask, deny]
        require_other:
          type: boolean
          description: The person a call is for may not approve it themselves.

    BlueprintMCPServer:
      type: object
      required: [name]
      additionalProperties: false
      description: An MCP server as the MCP server API takes it, with each secret reference relative to the team.
      properties:
        name:
          type: string
          pattern: "^[a-zA-Z0-9_-]{1,64}$"
        url:
          type: string
        command:
          type: array
          items:
            type: string
        env:
          type: object
          description: For a command server; each value a secret's name#key among the team's MCP secrets
          additionalProperties:
            type: string
        auth_secret:
          type: string
          description: For a url server; a secret's name#key among the team's MCP secrets, never the secret
          examples: ["helpdesk#token"]
        bare:
          type: boolean

    BlueprintSkill:
      type: object
      required: [files]
      additionalProperties: false
      description: A skill's files. Its SKILL.md names it.
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/BlueprintSkillFile"

    BlueprintSkillFile:
      type: object
      required: [path, data]
      additionalProperties: false
      properties:
        path:
          type: string
          examples: ["SKILL.md"]
        data:
          type: string
          format: byte
          description: The file's bytes, base64

    BlueprintAgent:
      type: object
      required: [name, model, pattern, max_steps]
      additionalProperties: false
      description: |
        An agent as the agents API takes it, except that its MCP servers,
        skills and delegates are named. Described whole: a field left out is
        its default, so leaving out skills takes its skills away.
      properties:
        kind:
          type: string
          description: Optional; custom. A blueprint describes custom agents only.
        name:
          type: string
          maxLength: 200
        description:
          type: string
        instructions:
          type: string
        model:
          $ref: "#/components/schemas/ModelRef"
        pattern:
          type: string
          examples: ["react"]
        max_steps:
          type: integer
          format: int32
          minimum: 1
        steer_continuations:
          type: integer
          format: int32
          minimum: 0
        output_schema:
          $ref: "#/components/schemas/OutputSchema"
        parser:
          type: boolean
        parser_model:
          $ref: "#/components/schemas/ParserModel"
        mcp_servers:
          type: array
          items:
            $ref: "#/components/schemas/BlueprintServerGrant"
        skills:
          type: array
          description: Skills by name, in this blueprint or already in the team
          items:
            type: string
        token_budget:
          type: integer
          format: int64
          minimum: 1
          maximum: 100000000
        delegation:
          $ref: "#/components/schemas/Delegation"
        delegates:
          type: array
          description: Agents by name, in this blueprint or already in the team
          items:
            type: string
        web:
          type: boolean
        browser:
          type: boolean

    BlueprintServerGrant:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: An MCP server in this blueprint or already in the team
        allow:
          type: array
          minItems: 1
          description: The tools granted. Left out, every tool is granted.
          items:
            type: string
            pattern: "^[a-zA-Z0-9_-]{1,64}$"

    BlueprintApply:
      type: object
      required: [blueprint, plan_digest]
      additionalProperties: false
      properties:
        blueprint:
          $ref: "#/components/schemas/Blueprint"
        plan_digest:
          type: string
          description: The digest of the plan that was shown
          examples: ["sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"]

    BlueprintChange:
      type: object
      required: [kind, name, action]
      properties:
        kind:
          type: string
          enum: [mcp_server, skill, agent, approval_rule]
        name:
          type: string
        action:
          type: string
          enum: [create, update, unchanged]
        fields:
          type: array
          description: What an update changes, by field name
          items:
            type: string
        id:
          type: string
          format: uuid
          description: The item's id, once it exists

    BlueprintRefusal:
      type: object
      required: [kind, name, message]
      properties:
        kind:
          type: string
          enum: [mcp_server, skill, agent, approval_rule]
        name:
          type: string
          description: The item's name, or "#n" for a skill whose files name none
        message:
          type: string

    Proposal:
      type: object
      required: [id, session_id, run_id, summary, state, created_at]
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
          description: The builder run that proposed it.
        summary:
          type: string
          description: What the proposal does, in the builder's words.
        state:
          type: string
          enum: [open, applied, superseded]
          description: |
            `open` until a person applies it or the builder proposes again in
            the same session, which supersedes it.
        created_at:
          type: string
          format: date-time
        applied_at:
          type: string
          format: date-time
          nullable: true
        blueprint:
          $ref: "#/components/schemas/Blueprint"
          description: Present when one proposal is read.
        plan:
          $ref: "#/components/schemas/BlueprintPlan"
          description: Present when one proposal is read.

    ProposalPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Proposal"
        next_cursor:
          type: string
          description: Absent on the last page

    ProposalApply:
      type: object
      required: [plan_digest]
      additionalProperties: false
      properties:
        plan_digest:
          type: string
          description: The digest of the plan read from the proposal.

    BlueprintPlan:
      type: object
      required: [changes, refusals, digest]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/BlueprintChange"
        refusals:
          type: array
          items:
            $ref: "#/components/schemas/BlueprintRefusal"
        digest:
          type: string
          description: Names this plan; send it to apply

    BlueprintApplied:
      type: object
      required: [changes, discovered]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/BlueprintChange"
        discovered:
          type: array
          description: |
            Each MCP server the apply created or changed, asked for its tools
            once the write committed, so an agent granted them can use them at
            once. A server that could not be asked says why; the apply stands.
          items:
            $ref: "#/components/schemas/BlueprintDiscovered"

    MCPSecretWrite:
      type: object
      required: [values]
      additionalProperties: false
      properties:
        values:
          type: object
          description: Each key and its value; 1 to 20 keys, each value up to 16 KiB
          minProperties: 1
          maxProperties: 20
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 16384

    BlueprintDiscovered:
      type: object
      required: [server, tools]
      properties:
        server:
          type: string
        tools:
          type: array
          items:
            type: string
        error:
          type: string
          description: Why the server has no tools yet, such as a secret not set; discover it again once fixed

    AgentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListedAgent"
        next_cursor:
          type: string
          description: Absent on the last page

    Loop:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The value an agent's `pattern` takes to use this loop
          examples: ["react"]

    LoopPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Loop"

    TeamSettings:
      type: object
      required: [search, sandbox, browser, improvement, compaction_messages, compaction_tokens_min, compaction_tokens_max]
      description: |
        `model`, `hub` and `updated_at` are always sent, null when unset;
        optional here only so a generated client decodes null as absent
        rather than as a zero value.
      properties:
        model:
          $ref: "#/components/schemas/ModelRef"
          nullable: true
          description: The model the team's built-in agents run on. Null until chosen, and until then they do not run.
        search:
          $ref: "#/components/schemas/SearchSettings"
        sandbox:
          $ref: "#/components/schemas/SandboxSettings"
        browser:
          $ref: "#/components/schemas/BrowserSettings"
        improvement:
          type: boolean
          description: |
            Whether the team's agents improve themselves from their runs. While
            it is on, every finished top-level run is judged in the background
            (was the task done?), members may give 👍/👎 on answers, and runs
            judged bad, plus a sampled share of good ones, are digested for the
            improver. The part that proposes changes arrives in a later release.
        judge_model:
          $ref: "#/components/schemas/ModelRef"
          nullable: true
          description: The model that judges and digests runs; null means the team's model.
        improvement_sample_share:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: The percentage of runs judged done that are digested anyway, for contrast. 10 until set.
        improvement_since:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: When improvement was last turned on; runs that finished before it are never judged.
        compaction_messages:
          type: integer
          format: int32
          minimum: 10
          maximum: 10000
          description: Messages in a run's request past which it compacts.
        compaction_tokens_min:
          type: integer
          format: int32
          minimum: 30000
          maximum: 1000000
          description: |
            A run also compacts when its next request would read more than a
            tenth of its token budget, held between compaction_tokens_min and
            compaction_tokens_max. 50,000 until saved.
        compaction_tokens_max:
          type: integer
          format: int32
          minimum: 30000
          maximum: 1000000
          description: The most a run's next request may read before it compacts. 60,000 until saved.
        hub:
          $ref: "#/components/schemas/HubRef"
          nullable: true
          description: |
            The agent that answers a run started for the team rather than
            for an agent. Null for the built-in orchestrator, which it is
            again when the chosen agent is deleted.
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Null for a team that never saved

    HubRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: ["triage"]

    SearchSettings:
      type: object
      required: [provider, key_set]
      properties:
        provider:
          $ref: "#/components/schemas/SearchProvider"
        url:
          type: string
          nullable: true
          description: The self-hosted instance's address, for searxng and firecrawl-oss; null for every other provider
          examples: ["http://searxng:8080"]
        key_set:
          type: boolean
          description: Whether a key is stored. The key itself is never returned.

    SearchProvider:
      type: string
      enum: [none, searxng, brave, tavily, firecrawl-cloud, firecrawl-oss]
      description: |
        `searxng` and `firecrawl-oss` are self-hosted and take a `url`;
        `brave`, `tavily` and `firecrawl-cloud` take a key and no url.
        `firecrawl-oss` takes a key only if the instance requires one.

    SandboxSettings:
      type: object
      required: [provider, key_set]
      description: |
        Where the team's command MCP servers run. What a room starts from is
        the brain's choice, but for an E2B team's template.
      properties:
        provider:
          $ref: "#/components/schemas/SandboxProvider"
        url:
          type: string
          nullable: true
          description: A self-hosted provider's API address, for sandboxd and a self-hosted Daytona; null otherwise
          examples: ["http://sandboxd:8090"]
        template:
          type: string
          nullable: true
          description: |
            E2B only: the template rooms start from, built in the team's E2B
            account; null for the brain's default, openarity-sandbox. Every
            other provider is given the brain's own image.
        key_set:
          type: boolean
          description: Whether a key is stored. The key itself is never returned.

    SandboxProvider:
      type: string
      enum: [none, e2b, daytona, sandboxd]
      description: |
        `none` runs no command servers. `e2b` is hosted and takes a key and no
        url; `daytona` takes a key, and a url when self-hosted; `sandboxd` is
        self-hosted and takes a url and its token as the key.

    BrowserSettings:
      type: object
      required: [provider, key_set]
      description: What the team's runs drive pages in.
      properties:
        provider:
          $ref: "#/components/schemas/BrowserProvider"
        url:
          type: string
          nullable: true
          description: |
            A self-hosted browser's address, for browserless, steel,
            lightpanda and cdp; null for a hosted one.
          examples: ["ws://lightpanda:9222"]
        key_set:
          type: boolean
          description: Whether a key is stored. The key itself is never returned.

    BrowserProvider:
      type: string
      enum: [none, browserless, steel, lightpanda, cdp, browserbase, hyperbrowser, anchor, kernel, brightdata]
      description: |
        `none` gives runs no browser. `browserless`, `steel` and `lightpanda`
        are hosted, taking a key and no url, or self-hosted at a url, where
        a key is optional. `cdp` is any browser that speaks the Chrome
        DevTools Protocol at a url, such as headless-shell, with an optional
        token. `browserbase`, `hyperbrowser`, `anchor`, `kernel` and
        `brightdata` are hosted only and take a key; Bright Data's is the
        zone's `USER:PASS`.

    TeamSettingsRequest:
      type: object
      additionalProperties: false
      required: [search, improvement, compaction_messages]
      properties:
        model:
          $ref: "#/components/schemas/ModelRef"
          nullable: true
          description: Null or absent for no model, which stops the built-in agents running.
        search:
          $ref: "#/components/schemas/SearchSettingsRequest"
        sandbox:
          $ref: "#/components/schemas/SandboxSettingsRequest"
        browser:
          $ref: "#/components/schemas/BrowserSettingsRequest"
        improvement:
          type: boolean
        judge_model:
          $ref: "#/components/schemas/ModelRef"
          nullable: true
          description: |
            Left out, the stored judge model stays; null clears it, so runs are
            judged on the team's model.
        improvement_sample_share:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: Left out, the stored share stays.
        compaction_messages:
          type: integer
          format: int32
          minimum: 10
          maximum: 10000
        compaction_tokens_min:
          type: integer
          format: int32
          minimum: 30000
          maximum: 1000000
          description: |
            Left out, the stored value stays, so a client that predates it
            cannot reset it. Must not be above compaction_tokens_max once the
            stored values fill in what is left out.
        compaction_tokens_max:
          type: integer
          format: int32
          minimum: 30000
          maximum: 1000000
          description: Left out, the stored value stays.
        hub:
          type: string
          nullable: true
          description: |
            The name of an agent in this team, ignoring case. Null or absent
            for the built-in orchestrator.
          examples: ["triage"]

    SearchSettingsRequest:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider:
          $ref: "#/components/schemas/SearchProvider"
        url:
          type: string
          description: Required for searxng and firecrawl-oss, refused for every other provider
        api_key:
          type: string
          writeOnly: true
          maxLength: 4096
          description: |
            The provider's key: required for brave, tavily and firecrawl-cloud,
            optional for firecrawl-oss, refused for none and searxng. Omit it
            to keep the stored one while the provider is unchanged. For
            firecrawl-oss an empty string removes the stored key; for the
            others it is refused.

    SandboxSettingsRequest:
      type: object
      additionalProperties: false
      required: [provider]
      description: Absent from a request, the stored sandbox is kept.
      properties:
        provider:
          $ref: "#/components/schemas/SandboxProvider"
        url:
          type: string
          description: Required for sandboxd, optional for daytona, refused for e2b and none
        template:
          type: string
          maxLength: 128
          pattern: '^[a-z0-9][a-z0-9_.-]*(/[a-z0-9][a-z0-9_.-]*)?$'
          description: E2B only, optional; a template name, or owner/name for another team's public one
          examples: ["openarity-sandbox"]
        api_key:
          type: string
          writeOnly: true
          maxLength: 4096
          description: |
            The provider's key, or sandboxd's token: required for every
            provider but none. Omit it to keep the stored one while the
            provider and its url are unchanged.

    BrowserSettingsRequest:
      type: object
      additionalProperties: false
      required: [provider]
      description: Absent from a request, the stored browser is kept.
      properties:
        provider:
          $ref: "#/components/schemas/BrowserProvider"
        url:
          type: string
          description: |
            Required for cdp, optional for browserless, steel and lightpanda
            (self-hosted), refused for every other provider. An http, https,
            ws or wss URL with no credentials or query: a token is the key.
          examples: ["ws://lightpanda:9222"]
        api_key:
          type: string
          writeOnly: true
          maxLength: 4096
          description: |
            The provider's key, sent as the provider wants it. Required for a
            hosted browser; optional for a self-hosted one, where an empty
            string removes the stored key. Omit it to keep the stored one
            while the provider and its url are unchanged; a key is sent again
            when either changes.

    RunRequest:
      type: object
      required: [input]
      additionalProperties: false
      properties:
        agent:
          type: string
          description: The name of an agent in this team. Absent or empty asks the team's hub.
          examples: ["triage"]
        input:
          type: string
          maxLength: 102400
          description: What the agent is asked to do. At most 100 KiB, with no NUL character.
          examples: ["Sort the issues opened today."]
        session_id:
          type: string
          format: uuid
          description: |
            The conversation the run belongs to. Leave it out and the run gets
            a direct session of its own.
        builder:
          type: boolean
          description: |
            Refused with a 400. The builder answers on the dashboard channel:
            start a conversation with it at `POST /teams/{id}/sessions` with
            `builder`.

    ApprovalStatus:
      type: string
      enum: [pending, approved, denied, expired, cancelled]
      description: |
        Where a request stands. `pending` waits for a person; `expired` is
        one nobody answered in time; `cancelled` ended with its run, or was
        given up by its person writing again instead of answering.

    Approval:
      type: object
      description: One call an agent asked a person about before making it.
      required:
        - id
        - run_id
        - root_run_id
        - call_id
        - tool
        - class
        - arguments
        - summary
        - code
        - status
        - requested_for
        - require_other
        - decided_by
        - decided_via
        - scope
        - reason
        - expires_at
        - decided_at
        - used_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
          description: The run that asked, which may be a delegate's.
        root_run_id:
          type: string
          format: uuid
          description: The top-level run its tree waits under.
        call_id:
          type: string
        tool:
          type: string
          description: "`<server>__<tool>`, or a built-in's own name."
        class:
          type: string
          enum: [read, write, destructive]
        arguments:
          type: object
          additionalProperties: true
          description: The call's arguments, exactly as they will be made if approved.
        summary:
          type: string
          description: The arguments as a person reads them, a few fields long.
        code:
          type: string
          description: Four characters a person can type back into a chat to name this request.
        status:
          $ref: "#/components/schemas/ApprovalStatus"
        requested_for:
          type: string
          format: uuid
          nullable: true
          description: The person the run works for, who may approve their own when their role allows.
        require_other:
          type: boolean
          description: A rule wants someone other than `requested_for` to answer.
        decided_by:
          type: string
          format: uuid
          nullable: true
        decided_via:
          type: string
          nullable: true
          description: dashboard, channel, cli, or sweep when the brain answered.
        scope:
          type: string
          nullable: true
          enum: [once, run, null]
        reason:
          type: string
          nullable: true
          description: What the person said with their answer.
        expires_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
          nullable: true
        used_at:
          type: string
          format: date-time
          nullable: true
          description: When an approved call was made.
        created_at:
          type: string
          format: date-time

    ImprovementStatus:
      type: string
      enum: [waiting, applied, rejected, reverted, withdrawn]

    ImprovementKind:
      type: string
      enum: [instructions, description, skill_grant, skill_drop, skill_new, skill_edit,
             server_grant, server_drop, tools_narrow, builtin_tool, tool_note,
             limits, delegation, pattern]

    ImprovementMark:
      type: string
      description: |
        What kind of change it is beyond its kind, computed by the brain:
        widens_access (a server or built-in tool granted, or a skill that
        names tools), widens_reach (wider delegation), raises_cost (a limit
        raised), changes_code (a script added or changed), changes_discovery
        (the description, which others find it by), changes_behaviour (its loop).
      enum: [widens_access, widens_reach, raises_cost, changes_code, changes_discovery, changes_behaviour]

    NamedRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The name, or the id when it no longer exists

    ImprovementChange:
      type: object
      required: [field, type, before, after]
      properties:
        field:
          type: string
          description: |
            What changes: instructions, description, pattern, max_tokens,
            max_steps, steer_continuations, token_budget, delegation, web,
            browser, skills, delegates, mcp_servers, notes, body, or
            files/<path> for a skill's file.
        type:
          type: string
          enum: [text, list, value]
          description: text is whole before and after, for a line diff; list is names; value is one value
        before:
          description: A string for text and value, an array of names for list; null for a file the change adds
        after:
          description: A string for text and value, an array of names for list; null for a file the change removes

    Improvement:
      type: object
      required: [id, kind, status, agent, why, hypothesis, scope, marks, reaches, changes, runs, outsider, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ImprovementKind"
        status:
          $ref: "#/components/schemas/ImprovementStatus"
        agent:
          $ref: "#/components/schemas/NamedRef"
        skill:
          description: The skill a skill_edit changes; null for every other kind
          nullable: true
          allOf:
            - $ref: "#/components/schemas/NamedRef"
        why:
          type: string
          description: The pattern and the evidence for it, in words
        hypothesis:
          type: string
          description: What the change is expected to do
        scope:
          type: string
          enum: [invariant, domain]
          description: A general weakness of agents, or knowledge of this team's domain
        signature:
          type: string
          nullable: true
        marks:
          type: array
          items:
            $ref: "#/components/schemas/ImprovementMark"
        reaches:
          type: array
          description: For a skill_edit, every agent that holds the skill now
          items:
            $ref: "#/components/schemas/NamedRef"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ImprovementChange"
        runs:
          type: array
          description: The runs it cites; readable says whether the caller may open each
          items:
            type: object
            required: [id, readable]
            properties:
              id:
                type: string
                format: uuid
              readable:
                type: boolean
              session_id:
                type: string
                format: uuid
                description: The conversation the run is read in; present only when readable
        outsider:
          type: boolean
          description: A channel sender who is not a member spoke in a session it came from
        created_at:
          type: string
          format: date-time
        decided_by:
          type: string
          format: uuid
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true
        reverted_by:
          type: string
          format: uuid
          nullable: true
        reverted_at:
          type: string
          format: date-time
          nullable: true

    ImprovementPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Improvement"
        next_cursor:
          type: string
          description: Absent on the last page

    ImprovementDecision:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject, revert]

    ApprovalPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
        next_cursor:
          type: string
          description: Absent on the last page

    ApprovalDecision:
      type: object
      required: [approve]
      properties:
        approve:
          type: boolean
        scope:
          type: string
          enum: [once, run]
          description: Absent is once. Only a yes may be for the rest of the run.
        reason:
          type: string
          description: Told to the agent with the answer; at most 1,000 characters are kept.
        via:
          type: string
          enum: [dashboard, cli]
          description: Where the person answered. Absent is dashboard. A record, never a permission.

    ApprovalSettings:
      type: object
      required: [mode, ttl_minutes]
      properties:
        mode:
          type: string
          enum: ["off", writes, destructive, all]
          description: |
            Which calls ask: none, every call that is not a read, only those
            that destroy, or every call. A guest's calls, and those of a run
            nobody is present for, are held to more.
        ttl_minutes:
          type: integer
          format: int32
          minimum: 5
          maximum: 1440
          description: How long a request waits before it expires.

    ApprovalRule:
      type: object
      required: [id, target_kind, target, mode, require_other, created_at]
      properties:
        id:
          type: string
          format: uuid
        target_kind:
          type: string
          enum: [tool, server]
        target:
          type: string
        mode:
          type: string
          enum: [allow, ask, deny]
        require_other:
          type: boolean
        created_at:
          type: string
          format: date-time

    ApprovalRuleRequest:
      type: object
      required: [target_kind, target, mode]
      properties:
        target_kind:
          type: string
          enum: [tool, server]
        target:
          type: string
          minLength: 1
          maxLength: 200
        mode:
          type: string
          enum: [allow, ask, deny]
        require_other:
          type: boolean

    ApprovalRulePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalRule"

    RunStatus:
      type: string
      enum: [queued, running, waiting, succeeded, failed, cancelled]
      description: |
        Where a run stands. `queued` and `running` are live; `waiting` is a
        run that stopped for a person's answer, holding nothing, and carries
        on when it is answered; the other three are final.

    Run:
      type: object
      required:
        - id
        - session_id
        - agent
        - status
        - input
        - input_tokens
        - output_tokens
        - created_at
        - depth
        - hub
        - builder
        - delegates
        - reply
      properties:
        message_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The message the run was started to answer, whose files are listed
            under the session's attachments with this `message_id`. Null for a
            run started any other way.
        reply:
          $ref: "#/components/schemas/Reply"
          nullable: true
          description: |
            What became of the run's answer to the channel conversation it
            came from; null for a run that answers none, such as one started
            from the dashboard or a delegate's.
        outcome:
          $ref: "#/components/schemas/RunOutcome"
          description: |
            How the run was judged, on a single run's read only, once it has
            been; absent before, in lists, and for a team that never had
            improvement on.
        my_feedback:
          $ref: "#/components/schemas/RunFeedback"
          description: The caller's 👍/👎 on the run, on a single run's read only; absent when none.
        parent_run_id:
          type: string
          format: uuid
          nullable: true
          description: The run that delegated this one; null for a run a person started
        depth:
          type: integer
          format: int32
          description: 0 for a run a person started, one more for each delegation beneath it
        builder:
          type: boolean
          description: Whether the run is the team's builder, which proposes and writes nothing.
        hub:
          type: boolean
          description: |
            Whether the run was started for the team rather than for an
            agent. Its `agent` is the hub's name: the chosen agent's, or
            `orchestrator`.
        delegates:
          type: array
          items:
            type: string
          description: |
            The agents a top-level run handed work to directly, by name, each
            once, in the order it first did; empty when it handed none.
            Always empty on a delegate's own run, whose delegates are in its
            parent's trace. A run that is still going may add more.
          examples: [["log-reader", "billing"]]
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        agent:
          type: string
          description: The agent's name when the run started, kept if it is later renamed or deleted
        status:
          $ref: "#/components/schemas/RunStatus"
        input:
          type: string
        output:
          type: string
          nullable: true
          description: |
            The agent's answer, null until it succeeds. A run stopped at its
            token budget or wall clock keeps what it had, its latest summary
            when it compacted, beside its error.
        error:
          type: string
          nullable: true
          description: Why it failed, null unless it did
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
          description: When a worker first took it, null while queued
        finished_at:
          type: string
          format: date-time
          nullable: true

    RunOutcome:
      type: object
      required: [verdict, missed, why, implicit, effective, judged_at, feedback]
      description: |
        The judge's verdict on a run, and what it comes to once members'
        feedback is weighed. Visible to whoever may read the run.
      properties:
        verdict:
          type: string
          enum: [done, partly, not_done, wrong, cant_tell]
          description: The judge model's verdict on whether the task was done
        missed:
          type: string
          description: What was asked and not delivered; empty when nothing was
        why:
          type: string
          description: The judge's reason
        implicit:
          type: string
          enum: [none, correction, repeat, retry, thanks]
          description: |
            What the judge read in the people's next messages. Evidence only:
            channel text never decides an outcome on its own.
        effective:
          type: string
          enum: [good, bad, neither]
          description: A member's 👎 or 👍 if there is one, else the verdict
        judged_at:
          type: string
          format: date-time
        feedback:
          type: object
          required: [up, down]
          description: How many members gave 👍 and 👎; never who
          properties:
            up:
              type: integer
              format: int32
            down:
              type: integer
              format: int32

    RunFeedback:
      type: object
      required: [value, note, updated_at]
      properties:
        value:
          type: string
          enum: [up, down]
        note:
          type: string
          description: What was wrong, if they said; empty otherwise
        updated_at:
          type: string
          format: date-time

    RunFeedbackRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          enum: [up, down]
        note:
          type: string
          maxLength: 1000
        via:
          type: string
          enum: [dashboard, cli]
          description: Where it was given; dashboard when left out

    SessionFeedback:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/RunFeedback"
              - type: object
                required: [run_id]
                properties:
                  run_id:
                    type: string
                    format: uuid

    Reply:
      type: object
      description: |
        A run's reply to its channel, as the outbox holds it. It is sent in
        order within its conversation and retried for about two and a half
        hours before it is given up.
      required: [kind, status, attempts, last_error, sent_at, next_attempt_at]
      properties:
        kind:
          type: string
          description: |
            `answer`, or `apology` when the run failed or answered nothing; an
            apology never carries the error.
          examples: ["answer"]
        status:
          type: string
          description: |
            `pending` until the channel takes it, then `sent`; `failed` once it
            is given up, because the channel has no reply URL or every attempt
            failed.
          examples: ["sent"]
        attempts:
          type: integer
          format: int32
          description: How many times it was tried; 0 before the first
        last_error:
          type: string
          nullable: true
          description: Why the last attempt failed, null when none has
          examples: ["the reply URL answered 503"]
        sent_at:
          type: string
          format: date-time
          nullable: true
          description: When the channel took it, null until it has
        next_attempt_at:
          type: string
          format: date-time
          nullable: true
          description: When a pending reply is tried next; null once it is sent or given up

    RunPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        next_cursor:
          type: string
          description: Absent on the last page
