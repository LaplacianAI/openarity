openapi: 3.1.0

info:
  title: Openarity brain
  version: 0.1.0
  description: |
    The brain's HTTP API.

    This document is the contract between the service and everything that
    talks to it, including the CLI. It is hand-written and reviewed as a diff:
    a change here is a change to what callers may rely on.

    A test compares the routes the service registers against the paths below.
    Adding an endpoint without describing it here fails the build.

    **Errors are `text/plain`, not JSON.** Successful responses are JSON;
    failures carry a short sentence and nothing machine-readable. Clients
    should branch on the status code, never on the body.
  license:
    name: MIT
    url: https://github.com/LaplacianAI/openarity/blob/main/LICENSE

servers:
  - url: http://127.0.0.1:21120
    description: The API listener, OPENARITY_API_BIND

tags:
  - name: probes
    description: Unauthenticated, for orchestrators
  - name: discovery
    description: How to authenticate, readable before you can
  - name: identity
    description: Who the caller is
  - name: teams
    description: Teams and their membership
  - name: channels
    description: Where a team's messages arrive from
  - name: skills
    description: Instructions an agent loads when a task calls for them
  - name: agents
    description: The agents a team defines, and the servers and skills each is granted
  - name: mcp-servers
    description: The MCP servers a team's agents may be granted, and the tools each offers
  - name: blueprints
    description: A team's agents, skills and MCP servers described in one document, planned and applied
  - name: graph
    description: A team's agents, tools and skills as the graph index holds them
  - name: sessions
    description: Conversations, and what was said in them
  - name: runs
    description: An agent working on one input, and what it did as it went
  - name: users
    description: Finding a user's id
  - name: settings
    description: A team's model, web search, learning and compaction

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [probes]
      summary: Liveness
      description: |
        Answers as long as the process is running. It never touches the
        database, so a Postgres outage must not restart the pod.
      security: []
      responses:
        "200":
          description: The process is up
          content:
            text/plain:
              schema:
                type: string
                examples: ["ok"]

  /readyz:
    get:
      operationId: getReady
      tags: [probes]
      summary: Readiness
      description: |
        Pings Postgres. The body never names the underlying error; the reason
        is logged instead.
      security: []
      responses:
        "200":
          description: Ready to serve
          content:
            text/plain:
              schema:
                type: string
                examples: ["ready"]
        "503":
          description: A dependency is unreachable
          content:
            text/plain:
              schema:
                type: string
                examples: ["not ready"]

  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [discovery]
      summary: How to obtain a token
      description: |
        Unauthenticated, because a client holding no credential has to start
        somewhere. It reports which flow this deployment accepts and the
        parameters that flow needs, so a client is configured with one address
        rather than with a copy of the service's own settings.

        It carries no secret. The issuer and client id are public by OAuth's
        design for a public client, and the development token is reported as
        accepted, never as a value.
      security: []
      responses:
        "200":
          description: How to authenticate here
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"

  /whoami:
    get:
      operationId: getWhoami
      tags: [identity]
      summary: The authenticated caller
      description: |
        Resolves the token to a user, creating the row on first sight, and
        returns their team memberships.

        The id is the caller's own, so publishing it discloses nothing they
        did not already send. It is what someone pastes into a request to be
        added to a team.
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whoami"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List teams
      description: |
        A super admin sees every team, paged. Everyone else sees the teams
        they belong to, with their role in each, in a single page with no
        cursor — a person's own memberships are bounded.

        Deleted teams are left out. A super admin asks for them with
        `deleted=true`, which lists only deleted teams, each with the date it
        is purged; from anyone else the parameter is ignored.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: deleted
          in: query
          required: false
          description: List only deleted teams. Super admins only; ignored otherwise.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: A page of teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team
      description: |
        Super admins only. Creating a team is platform-scoped, so there is no
        team to check a role against.

        The new team has no members. A super admin adds the first one, who is
        then able to manage the rest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: The team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A team already has that name
          content:
            text/plain:
              schema:
                type: string
                examples: ["a team with that name already exists"]

  /teams/{id}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: getTeam
      tags: [teams]
      summary: Read one team
      description: |
        Members and super admins only. A team the caller may not see and a
        team that does not exist answer identically — a 403 would confirm the
        id is real.

        A deleted team is 404 for its members. A super admin still reads it,
        with `deleted_at` and `purge_at` set.
      responses:
        "200":
          description: The team, carrying the caller's role if they are a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team
      description: |
        Super admins only. The team is hidden and stopped at once: its members
        no longer see it, its channels refuse webhooks, and no run can start
        in it. Nothing is erased until `purge_at`, which is
        `TEAM_PURGE_AFTER` (a week by default) after the delete; until then
        `POST /teams/{id}/restore` brings it back whole.

        Refused while a run in the team is queued or running: a delete does
        not cancel work. Deleting a deleted team answers 204 and does not
        move its purge date, so repeating the call cannot postpone an erasure.
      responses:
        "204":
          description: Deleted, or already deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A run in the team is queued or running
          content:
            text/plain:
              schema:
                type: string
                examples: ["the team has runs in progress"]

  /teams/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    post:
      operationId: restoreTeam
      tags: [teams]
      summary: Restore a deleted team
      description: |
        Super admins only. Everything comes back as it was — members,
        channels, sessions, settings, grants — because nothing was removed.
        Restoring a team that is not deleted answers 200 and changes nothing.

        A deleted team's name is free for a new team at once, so the restore
        is refused for as long as a live team holds it. A purged team is
        gone and answers 404.
      responses:
        "200":
          description: The team, live again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A live team now has this team's name
          content:
            text/plain:
              schema:
                type: string
                examples: ["a team with that name already exists"]

  /teams/{id}/permissions:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: getTeamPermissions
      tags: [teams]
      summary: What the caller may do in a team
      description: |
        The permissions the caller holds in this team, from their role, so
        a client can offer only the actions the brain will allow. Advice,
        not authority: every route still checks for itself.

        Requires only membership. A super admin may do everything in every
        team whatever `actions` lists, and `super_admin` says so; a client
        treats it as holding every permission.
      responses:
        "200":
          description: The caller's permissions in the team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamPermissions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/members:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listTeamMembers
      tags: [teams]
      summary: List a team's members
      description: |
        A read, so seeing the team is enough — no action is required.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: addTeamMember
      tags: [teams]
      summary: Add a member
      description: |
        Requires `membership:write` in this team, and nothing else — naming
        somebody by `subject` deliberately does not require permission to read
        the directory, because "add the person I can name" is a smaller
        authority than "show me everyone".

        The role is checked by the database rather than the service: roles are
        rows, so an unknown one is a rejected foreign key and comes back as a
        400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "204":
          description: Added
        "400":
          description: |
            The body is malformed, names a user or role that does not exist,
            or carries neither `user_id` nor `subject` — or both.
          content:
            text/plain:
              schema:
                type: string
                examples: ["unknown role"]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            No such team, or none the caller may see. A `subject` nobody has
            is a 404 too: the caller named a person, and there is no person.
          content:
            text/plain:
              schema:
                type: string
                examples: ["no user has that subject"]
        "409":
          description: |
            Already a member, or the `subject` matched more than one person.

            The second needs no federation, which an earlier version of this
            description got wrong. A user row is keyed on `(issuer, subject)`
            and rows accumulate, so one provider whose issuer URL changed —
            moved behind a tunnel, addressed by IP rather than by name — leaves
            the same person behind under both. Observed in a single-provider
            deployment.

            The reply names the issuer beside each id, because the id alone
            gives no basis to choose and the wrong choice grants a role to an
            identity nobody can authenticate as.
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "already a member"
                  - "2 users have that subject — retry with user_id:
                     47c93149-6e9e-49ea-a9f6-34011f1e1e04 (https://auth.example.com/),
                     e096f85a-a05b-4699-919a-e0c5c5b57072 (https://auth.internal/)"

  /teams/{id}/members/{userID}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: userID
        in: path
        required: true
        description: The user to remove
        schema:
          type: string
          format: uuid
    delete:
      operationId: removeTeamMember
      tags: [teams]
      summary: Remove a member
      description: |
        Requires `membership:write` in this team. Removing someone who is not a
        member succeeds: the caller asked for a state, and that state holds.
      responses:
        "204":
          description: No longer a member
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /teams/{id}/channels:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listChannels
      tags: [channels]
      summary: List a team's channels
      description: |
        A read, so belonging to the team is enough. A channel id is not a
        secret — it is the routing key in that channel's own hook URL, and
        every member needs to know which channels exist.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of channels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: createChannel
      tags: [channels]
      summary: Connect a channel
      description: |
        Requires `channel:write` in this team.

        `provider` must name an adapter this build has. Refusing an unknown
        one here makes it a 400 now rather than a 404 on every webhook later,
        when nobody is watching.

        The signing secret is written to the secret store and never to
        Postgres, and no endpoint ever returns it again. Supply one when the
        provider issues it — Slack's Signing Secret, Meta's App Secret — and
        omit it otherwise: the server then generates one and echoes it in this
        response only, which is the last time anyone sees it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
      responses:
        "201":
          description: |
            Connected. `signing_secret` is present only when the server
            generated it. Store it now; it cannot be read back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedChannel"
        "400":
          description: |
            The body is malformed, the name is empty or over 200 characters,
            `provider` names no adapter, `signing_secret` was supplied blank,
            `reply_url` is refused (see `updateChannel`), a credential the
            provider asks for is missing or one it does not ask for is
            given, or the provider refused the credentials (Telegram does
            not know the bot token).
          content:
            text/plain:
              schema:
                type: string
                examples: ["unknown provider", "the bot token is not one Telegram knows"]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The team already has a channel with that name
          content:
            text/plain:
              schema:
                type: string
                examples: ["a channel with that name already exists"]
        "502":
          description: |
            The provider could not be reached to check the credentials, or
            to be pointed at the channel, or it would not post to the
            channel's address (Telegram's own reason follows). The channel
            was not created; nothing of it is left. Try again.
          content:
            text/plain:
              schema:
                type: string
                examples: ["could not reach telegram to check the credentials; try again"]
        "503":
          description: |
            The secret store is unreachable, so the channel was not created.
            A row whose secret is missing would refuse every webhook with no
            explanation, so it is rolled back rather than left behind.
          content:
            text/plain:
              schema:
                type: string
                examples: ["the secret store is unavailable"]

  /teams/{id}/channels/{channelID}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: channelID
        in: path
        required: true
        description: The channel
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateChannel
      tags: [channels]
      summary: Change a channel's reply URL or its notices to strangers
      description: |
        Requires `channel:write` in this team. Send `reply_url`,
        `notify_strangers` or both; what is not sent is left as it is.

        `notify_strangers` switches the notices a sender nobody has let in
        gets (see `Channel`). It is refused with 400 on a channel whose
        provider sends none (`can_notify` false).

        `reply_url`: a URL sets it, `null` or `""` clears it, and a reply
        waiting to be sent to a channel with none fails rather than waiting
        for one.

        The URL must be http or https with a host, and carry no credentials,
        query or fragment: every member can read it, and the receiver
        authenticates a reply by its signature. A literal private, loopback or
        link-local address is refused here, and a name resolving to one is
        refused when the reply is sent.

        A reply is a POST of `{"id", "session": {"ref", "kind"},
        "in_reply_to", "kind", "text"}`, signed as a webhook is, with
        `X-Openarity-Timestamp` and `X-Openarity-Signature`, the HMAC-SHA256
        taken over `reply:v1:<timestamp>:<body>`. Any 2xx is delivered;
        anything else is retried for about two and a half hours. A reply can
        arrive twice; drop a repeat by `id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          description: |
            The body is malformed or names nothing to change, the URL is
            refused, the channel's provider sends no replies, or it sends no
            notices and `notify_strangers` was sent.
          content:
            text/plain:
              schema:
                type: string
                examples: ["reply_url must not have a query or a fragment; the signature is what authenticates a reply"]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteChannel
      tags: [channels]
      summary: Disconnect a channel
      description: |
        Requires `channel:write` in this team. Its signing secret is deleted
        with it — Postgres cascades do not reach the secret store.

        A `telegram` channel's bot is told to stop posting (deleteWebhook)
        first. That is best effort: Telegram refusing or out of reach never
        keeps the channel.

        A channel belonging to another team answers 404, not 403: the caller
        was authorised for the team they named, not for a channel they only
        guessed the id of, and confirming the id exists would let anyone walk
        the uuid space.
      responses:
        "204":
          description: Disconnected
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/senders/pending:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listTeamPendingSenders
      tags: [channels]
      summary: List senders waiting on any of the team's channels
      description: |
        Every channel's queue as one list, oldest first: the sender who has
        waited longest comes first, whichever channel they wrote in on. Each
        item is the channel's own pending sender, with the channel it waits
        on.

        Requires `channel:read` in this team, as each channel's queue does,
        and for the same reason: `sender_name` is text a stranger chose.
        Render it as data.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of pending senders, first seen first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamPendingSenderPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/channels/{channelID}/senders/pending:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/ChannelID"
    get:
      operationId: listPendingSenders
      tags: [channels]
      summary: List senders waiting to be approved
      description: |
        Requires `channel:read` in this team. The queue holds text a
        stranger chose, so it goes only to those who can act on it: every
        role the brain ships with `channel:read` also holds `sender:approve`.

        A sender the brain has never linked to a user has their provider-side
        id and display name recorded here, bounded to 50 per channel, and
        their message is dropped. Nothing they wrote is stored.

        `sender_name` is attacker-controlled on every platform: it is whatever
        the person typed into their profile. Control characters are stripped
        and it is clipped to 64 characters on the way in, but it is still
        theirs. Render it as data.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of pending senders, most recently first seen first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingSenderPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/channels/{channelID}/senders:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/ChannelID"
    get:
      operationId: listChannelSenders
      tags: [channels]
      summary: List approved senders
      description: |
        Requires `channel:read` in this team. Who may speak to the agent
        through this channel, and as whom.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of approved senders, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelSenderPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: approveChannelSender
      tags: [channels]
      summary: Approve a sender
      description: |
        Requires `sender:approve` in this team, which `admin` and `approver`
        hold. Links a provider-side sender to a user and takes them out of the
        pending queue, in one statement.

        This is what lets somebody instruct an agent as a named user, so it
        takes a permission of its own rather than one every member holds. It
        is apart from `channel:write`, so an approver can let people in
        without being able to rewire the channel or its signing secret.
        `user_id` must already be a member of this team — otherwise approving
        would be a way to give somebody a voice in a team they do not belong
        to, needing only `sender:approve` rather than `membership:write`.

        The caller must also hold every permission `user_id` holds in this
        team, and every permission of whoever the ref is bound to now, when
        that is somebody else: an approver may let a stranger speak as a
        member or an approver, never as an admin, and may not take an admin's
        binding. Otherwise 403.

        A `sender_ref` that was never pending is accepted: an admin who
        already knows a provider id may link it before its owner has spoken.

        Approving somebody already approved moves them to the new user, so
        correcting a mistake is one call rather than a remove and an add.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveSenderRequest"
      responses:
        "204":
          description: Approved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The sender's binding changed between the check and the write
          content:
            text/plain:
              schema:
                type: string
                examples: ["the sender's binding changed while this was being decided; look again and retry"]
    delete:
      operationId: removeChannelSender
      tags: [channels]
      summary: Remove a sender, or dismiss a pending one
      description: |
        Requires `sender:approve` in this team, and every permission the user
        the ref is bound to holds, if it is bound to a member of the team:
        removing a binding cuts its user off from the channel. Otherwise 403.
        Clears both the approval and
        any pending row for that ref, because the caller cannot always tell
        which they are looking at and the wrong guess leaves one behind.

        Not a block. Their next message queues them again, which is what makes
        a mistaken removal recoverable — and what makes removal alone
        ineffective against somebody persistent.

        Removing a ref that was never linked is 204, not 404: the caller asked
        for a state and that state holds, and a 404 would let an admin probe
        which provider ids are linked one request at a time.

        The ref is a query parameter rather than a path segment because it is
        provider-controlled text. A ref of `.` or `..` in a path is rewritten
        by the router before any handler runs, and the standard path-escaping
        functions leave dots alone — so such a sender could never be removed.
      parameters:
        - name: ref
          in: query
          required: true
          description: The provider-side sender id, exactly as it was recorded
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The sender's binding changed between the check and the write
          content:
            text/plain:
              schema:
                type: string
                examples: ["the sender's binding changed while this was being decided; look again and retry"]

  /teams/{id}/channels/{channelID}/sessions:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/ChannelID"
    get:
      operationId: listChannelSessions
      tags: [sessions]
      summary: List a channel's conversations
      description: |
        Membership in the team is what reaches this route, and what it
        returns depends on who is asking. A `group` or `thread` session is
        the team's — it is the conversation they are already having in the
        provider. A `direct` session is one person's, and appears only for
        them or for a caller holding `session:read_all`.

        Hidden means absent, not redacted: nothing here says how many
        conversations were left out.

        Most recently spoken in first. Each item carries `channel_name`,
        `participant`, `last_message` and `latest_run_status`, as on the
        team's list, so the two never disagree about a row.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/sessions:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List every conversation in a team
      description: |
        Every session the team owns, whichever channel it arrived on — and
        those that arrived on none. A session belongs to a team rather than to
        a channel, because a channel is only one way one starts.

        Direct sessions are filtered the same way as on the channel list: the
        participant's own, plus everything if the caller holds
        `session:read_all`.

        Most recently spoken in first. Each item carries `channel_name`,
        `participant`, `last_message` and `latest_run_status`, so a list can
        be read without opening each session.

        A value outside a filter's set is a 400, not an ignored filter. A
        cursor is only meaningful with the filters it was issued under.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: channel_id
          in: query
          description: |
            Only sessions that arrived on this channel. A channel of another
            team matches nothing.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Only sessions in one of these states. Repeat it for more than one.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/SessionStatus"
        - name: run_status
          in: query
          description: |
            Only sessions whose newest top-level run is in one of these
            states. Repeat it for more than one. A session with no run
            matches none, so it is left out whenever this is given.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RunStatus"
      responses:
        "200":
          description: A page of sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/sessions/{sessionID}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: sessionID
        in: path
        required: true
        description: The conversation
        schema:
          type: string
          format: uuid
    get:
      operationId: getSession
      tags: [sessions]
      summary: Read a conversation's details
      description: |
        The session as the lists return it. Visible exactly where its
        messages are: a session in another team, or somebody else's `direct`
        session without `session:read_all`, answers 404 with the same body as
        one that does not exist.
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/sessions/{sessionID}/messages:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: sessionID
        in: path
        required: true
        description: The conversation
        schema:
          type: string
          format: uuid
    get:
      operationId: listSessionMessages
      tags: [sessions]
      summary: Read a conversation
      description: |
        Every message here came from a sender somebody approved. A message
        from anyone else was dropped before it was written, so this is not a
        filtered view of what arrived — it is everything that was ever stored.

        Ordered by `received_at`, newest first, and never by `sent_at`.
        `sent_at` is the sender's clock: a provider with a wrong one, or
        somebody setting it deliberately, would otherwise reorder a
        conversation they do not own.

        `text` is whatever a person typed. Render it as data.

        A session in another team answers 404, not 403 — the caller was
        authorised for the team they named, not for a session id they may have
        guessed, and confirming it exists would let anyone walk the uuid space.

        Somebody else's `direct` session answers the same 404, with the same
        body. A 403 there would confirm that a private conversation exists,
        which is most of what it is private about. Reading one needs to be its
        participant, or to hold `session:read_all` in the team.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of messages, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/sessions/{sessionID}/runs:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: sessionID
        in: path
        required: true
        description: The conversation
        schema:
          type: string
          format: uuid
    get:
      operationId: listSessionRuns
      tags: [runs]
      summary: List the runs in a conversation
      description: |
        The runs started in this session, newest first. Only top-level runs
        are listed: a delegate's run belongs to the run that started it.

        Each item is the run as `GET /teams/{id}/runs/{runID}` returns it;
        follow `/runs/{runID}/events` for what it did.

        Visible exactly where the session is: a session in another team, or
        somebody else's `direct` session without `session:read_all`, answers
        404 with the same body as a session that does not exist.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of runs, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/sessions/{sessionID}/attachments:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: sessionID
        in: path
        required: true
        description: The conversation
        schema:
          type: string
          format: uuid
    get:
      operationId: listSessionAttachments
      tags: [sessions]
      summary: List the files in a conversation
      description: |
        Every file that arrived in this conversation, across every message in
        it — which is what an agent reads to answer "the one I sent earlier".

        `media_type` and `size_bytes` are what the brain measured from the
        bytes it received, never what the sender claimed. `filename` is the
        sender's, cleaned: directory components and control characters are
        removed, and it is bounded. Treat it as a label, never as a path.

        No object key is returned. The bytes are reached through the route
        below and nowhere else.

        Visibility is the session's. Somebody else's `direct` session answers
        404 here for the same reason it does for messages.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of attachments, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/sessions/{sessionID}/attachments/{attachmentID}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: sessionID
        in: path
        required: true
        description: The conversation
        schema:
          type: string
          format: uuid
      - name: attachmentID
        in: path
        required: true
        description: The file
        schema:
          type: string
          format: uuid
    get:
      operationId: getSessionAttachment
      tags: [sessions]
      summary: Download a file
      description: |
        The bytes, decrypted on the way out. The brain proxies them rather than
        redirecting: the object store holds ciphertext under a per-team key it
        does not have, so there is no URL that would serve anything readable.

        `Content-Type` is the type recorded when the file arrived, sent with
        `X-Content-Type-Options: nosniff`. It is never derived from the
        filename. A file is only inert as the type it was recorded as — an SVG
        carrying a script is stored as `text/plain`, and stays harmless because
        that is what it is served as.

        `Content-Disposition` is `inline` for `image/png`, `image/jpeg`,
        `image/gif`, `image/webp` and `text/plain`, which a browser can display
        without executing anything. Everything else downloads, including PDFs:
        a same-origin PDF runs JavaScript in every major viewer.

        An attachment id belonging to another conversation answers 404, the
        same as one that does not exist.
      responses:
        "200":
          description: |
            The file. The body is the bytes; everything about them is in the
            headers.
          headers:
            Content-Disposition:
              description: inline for the types listed above, otherwise attachment
              schema:
                type: string
            X-Content-Type-Options:
              description: Always nosniff
              schema:
                type: string
            Cache-Control:
              description: Always `private, no-store`
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/skills:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listSkills
      tags: [skills]
      summary: List a team's skills
      description: |
        A read, so belonging to the team is enough: granting a skill to an
        agent starts with seeing which exist.

        Bodies and files are left out. A page is descriptions to choose
        between; fetch one skill to read the rest.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Query"
      responses:
        "200":
          description: A page of skills, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: createSkill
      tags: [skills]
      summary: Upload a skill
      description: |
        Requires `skill:write` in this team. The brain parses `SKILL.md`; its
        frontmatter is the skill's name, description and the rest, so nothing
        is typed twice.
      requestBody:
        required: true
        description: |
          The skill's directory, as the [Agent Skills
          specification](https://agentskills.io/specification) lays it out:
          `SKILL.md`, and any files beside it. `SKILL.md` sits at the top, or
          inside one folder named as the skill, which is stripped.

          Either a zip, or `multipart/form-data` with one `files` part per
          file whose filename is its path — what a browser sends for a folder
          upload, and what `curl -F "files=@SKILL.md;filename=SKILL.md"` sends.

          Limits: 5 MiB a file, 20 MiB and 200 files a skill, `SKILL.md`
          256 KiB, a path 1024 bytes. A path is refused rather than cleaned:
          absolute, `.` or `..` segments, empty segments, backslashes and
          control characters are all a 400 naming the path.
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SkillUpload"
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Stored, described as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          description: |
            The upload is not a skill: `SKILL.md` is missing, misplaced or
            breaks the specification, a path is not clean, a limit is passed,
            or the archive or multipart body is malformed. The sentence names
            the file and the rule.
          content:
            text/plain:
              schema:
                type: string
                examples: ['"scripts/../run.py" is not a relative path inside the skill']
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The team already has a skill with that name
          content:
            text/plain:
              schema:
                type: string
                examples: ["a skill with that name already exists"]
        "413":
          description: The request body is over 21 MiB
          content:
            text/plain:
              schema:
                type: string
                examples: ["an upload is at most 21 MiB"]
        "415":
          description: The body is neither a zip nor multipart/form-data
          content:
            text/plain:
              schema:
                type: string
                examples: ["send the skill as multipart/form-data or application/zip"]

  /teams/{id}/skills/{skillID}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/SkillID"
    get:
      operationId: getSkill
      tags: [skills]
      summary: Read a skill
      description: |
        The manifest's fields, the body, where the skill came from, and a
        description of each file beside `SKILL.md`. A file's bytes are a
        separate request.

        A skill of another team answers 404, not 403: confirming the id
        exists would let anyone walk the uuid space.
      responses:
        "200":
          description: The skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: replaceSkill
      tags: [skills]
      summary: Replace a skill
      description: |
        Requires `skill:write` in this team. The whole directory is replaced:
        files the new upload leaves out are deleted. An imported skill
        replaced by an upload becomes the team's own, and its origin is
        cleared. Agents granted it see the new version from their next run.
      requestBody:
        required: true
        description: |
          The skill's directory, as the [Agent Skills
          specification](https://agentskills.io/specification) lays it out:
          `SKILL.md`, and any files beside it. `SKILL.md` sits at the top, or
          inside one folder named as the skill, which is stripped.

          Either a zip, or `multipart/form-data` with one `files` part per
          file whose filename is its path — what a browser sends for a folder
          upload, and what `curl -F "files=@SKILL.md;filename=SKILL.md"` sends.

          Limits: 5 MiB a file, 20 MiB and 200 files a skill, `SKILL.md`
          256 KiB, a path 1024 bytes. A path is refused rather than cleaned:
          absolute, `.` or `..` segments, empty segments, backslashes and
          control characters are all a 400 naming the path.
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SkillUpload"
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Replaced, described as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          description: |
            The upload is not a skill: `SKILL.md` is missing, misplaced or
            breaks the specification, a path is not clean, a limit is passed,
            or the archive or multipart body is malformed. The sentence names
            the file and the rule.
          content:
            text/plain:
              schema:
                type: string
                examples: ['"scripts/../run.py" is not a relative path inside the skill']
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another skill in the team already has that name
          content:
            text/plain:
              schema:
                type: string
                examples: ["a skill with that name already exists"]
        "413":
          description: The request body is over 21 MiB
          content:
            text/plain:
              schema:
                type: string
                examples: ["an upload is at most 21 MiB"]
        "415":
          description: The body is neither a zip nor multipart/form-data
          content:
            text/plain:
              schema:
                type: string
                examples: ["send the skill as multipart/form-data or application/zip"]

    delete:
      operationId: deleteSkill
      tags: [skills]
      summary: Delete a skill
      description: |
        Requires `skill:write` in this team. Its files go with it.

        A skill still granted to an agent is not deleted: removing it would
        change what that agent can do without anyone changing the agent.
        Revoke it from each agent first.
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An agent is still granted this skill
          content:
            text/plain:
              schema:
                type: string
                examples: ["the skill is granted to an agent"]

  /teams/{id}/skills/{skillID}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/SkillID"
      - name: path
        in: path
        required: true
        description: |
          The file's path inside the skill, folders included, as `files`
          lists it — `scripts/fill.py`. Its slashes are not escaped.
        schema:
          type: string
    get:
      operationId: getSkillFile
      tags: [skills]
      summary: Download one of a skill's files
      description: |
        The bytes, decrypted on the way out, as for an attachment.

        `Content-Type` is the type recorded when the file was uploaded, sent
        with `X-Content-Type-Options: nosniff`, never derived from the name.
        `Content-Disposition` is always `attachment`: a skill's files are
        scripts and references for an agent, and nothing is gained by
        rendering one in a browser.
      responses:
        "200":
          description: |
            The file. The body is the bytes; everything about them is in the
            headers.
          headers:
            Content-Disposition:
              description: Always attachment, with the file's name
              schema:
                type: string
            X-Content-Type-Options:
              description: Always nosniff
              schema:
                type: string
            Cache-Control:
              description: Always `private, no-store`
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/skills/import:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    post:
      operationId: importSkill
      tags: [skills]
      summary: Import a skill from GitHub or a zip on the web
      description: |
        Requires `skill:write` in this team. The brain fetches the source
        itself, then stores what it found exactly as an upload is stored, with
        the source recorded so the skill can be synced later.

        `github:owner/repo/path@ref` takes one folder of a repository. The ref
        is resolved to a commit first, and the commit is what is fetched and
        recorded, so a branch moving mid-import changes nothing. Without
        `@ref` it is the default branch.

        An `https://` address is a zip, fetched only from a host the operator
        allows. It may not carry a user, password or query string: the
        address is stored and shown to the team, and a signed link keeps its
        credential in the query.

        The fetch has 30 seconds, and connects only to public addresses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillImportRequest"
      responses:
        "201":
          description: Imported, described as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          description: |
            The body is malformed, the source is neither form, or it names a
            host the operator does not allow.
          content:
            text/plain:
              schema:
                type: string
                examples: ["not a skill source: a zip source may not carry a query string; the address is stored and shown"]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The team already has a skill with that name
          content:
            text/plain:
              schema:
                type: string
                examples: ["a skill with that name already exists"]
        "422":
          $ref: "#/components/responses/SourceNotASkill"
        "502":
          $ref: "#/components/responses/SourceUnavailable"
        "504":
          $ref: "#/components/responses/SourceTimedOut"

  /teams/{id}/skills/{skillID}/sync:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/SkillID"
    post:
      operationId: syncSkill
      tags: [skills]
      summary: Fetch an imported skill's source again
      description: |
        Requires `skill:write` in this team. The recorded `source_ref` is
        fetched again. When it names a different commit or digest than
        `source_sha`, the whole directory is replaced; when it names the same
        one, nothing is written and the skill is returned as it is.

        A skill that was uploaded has no source, and answers 409.
      responses:
        "200":
          description: The skill, replaced or unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The skill was uploaded and has no source, or the source now names
            a skill another in the team already has the name of.
          content:
            text/plain:
              schema:
                type: string
                examples: ["an uploaded skill has no source to sync from"]
        "422":
          $ref: "#/components/responses/SourceNotASkill"
        "502":
          $ref: "#/components/responses/SourceUnavailable"
        "504":
          $ref: "#/components/responses/SourceTimedOut"

  /teams/{id}/agents:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listAgents
      tags: [agents]
      summary: List a team's agents
      description: |
        A read, so belonging to the team is enough. Instructions, limits and
        grants are left out; fetch one agent for the rest.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Query"
      responses:
        "200":
          description: A page of agents, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: createAgent
      tags: [agents]
      summary: Define an agent
      description: |
        Requires `agent:write` in this team. The agent and its grants are
        written in one step. Only `custom` agents are created here; the other
        kinds are agents the brain provides.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRequest"
      responses:
        "201":
          description: Created, described as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          description: |
            The body breaks a rule, named in the sentence: a limit, a model
            setting, the parser and its schema, a grant listed twice, a
            pattern the brain does not run, or a granted server or skill that
            is not this team's. Nothing is written.
          content:
            text/plain:
              schema:
                type: string
                examples: ["a granted server or skill does not exist in this team"]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The team already has an agent with that name, case-insensitively
          content:
            text/plain:
              schema:
                type: string
                examples: ["an agent with that name already exists"]

  /teams/{id}/agents/{agentID}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/AgentID"
    get:
      operationId: getAgent
      tags: [agents]
      summary: Read an agent, with its grants
      description: |
        An agent of another team answers 404, not 403: confirming the id
        exists would let anyone walk the uuid space.
      responses:
        "200":
          description: The agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: replaceAgent
      tags: [agents]
      summary: Replace an agent and its grants
      description: |
        Requires `agent:write` in this team. Every field and every grant is
        replaced in one step, so a field left out is cleared and a grant left
        out is revoked. `kind` cannot change: leave it out, or send the kind
        the agent already has.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRequest"
      responses:
        "200":
          description: Replaced, described as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          description: |
            The body breaks a rule, named in the sentence: a limit, a model
            setting, the parser and its schema, a grant listed twice, a
            pattern the brain does not run, or a granted server or skill that
            is not this team's. Nothing is written.
          content:
            text/plain:
              schema:
                type: string
                examples: ["a granted server or skill does not exist in this team"]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another agent in the team already has that name
          content:
            text/plain:
              schema:
                type: string
                examples: ["an agent with that name already exists"]

    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete an agent
      description: |
        Requires `agent:write` in this team. Its grants go with it; the
        servers and skills it was granted are untouched.
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/blueprint:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: exportBlueprint
      tags: [blueprints]
      summary: The team as a blueprint
      description: |
        A read, so belonging to the team is enough. Says the team's MCP
        servers and custom agents as a blueprint, grants by name and secret
        references relative to the team, so planning it changes nothing and
        an edit starts from the agent whole. Skills are left out: a skill is
        its files, and one a blueprint does not name is left alone; agents
        still grant them by name. Built-in agents are never in it. With
        `agent` or `mcp_server`, only those are.
      parameters:
        - name: agent
          in: query
          description: An agent to export, by name; repeat for more.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: mcp_server
          in: query
          description: An MCP server to export, by name; repeat for more.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        "200":
          description: The blueprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blueprint"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/blueprints/plan:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    post:
      operationId: planBlueprint
      tags: [blueprints]
      summary: Show what applying a blueprint would change
      description: |
        A read, so belonging to the team is enough. Compares each item the
        blueprint names with the team's item of that name and says whether it
        would be created, updated (naming the fields, never their values) or
        left unchanged. Items the blueprint does not name are not compared
        and never removed. Every reason the blueprint cannot be applied is a
        refusal, including a write permission the caller does not hold.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Blueprint"
      responses:
        "200":
          description: The plan, refusals included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/proposals:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listProposals
      tags: [blueprints]
      summary: The builder's proposals, newest first
      description: |
        A read, so belonging to the team is enough. A proposal in a direct
        session is seen only by that session's person, or with
        `session:read_all`, as the session's runs are.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: session
          in: query
          description: Only this session's proposals.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of proposals, without their blueprints and plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/proposals/{proposalID}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: proposalID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProposal
      tags: [blueprints]
      summary: A proposal, its blueprint and its plan
      description: |
        For an open proposal, the plan is made now, as the caller: what
        applying it would do, and a refusal for any write they may not make.
        For one applied or superseded, it is the plan the builder had.
      responses:
        "200":
          description: The proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/proposals/{proposalID}/apply:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: proposalID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: applyProposal
      tags: [blueprints]
      summary: Apply a proposal, as the caller
      description: |
        As `POST /teams/{id}/blueprints/apply`, for the proposal's blueprint:
        planned again with the caller's permissions, written only if its
        digest is the one sent, and the proposal marked applied in the same
        transaction, so it is applied once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalApply"
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintApplied"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The team changed since the plan sent (the body is the new plan),
            or, in plain text, the proposal is applied or superseded. Nothing
            was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintPlan"
            text/plain:
              schema:
                type: string
        "422":
          description: The plan has refusals, and nothing was written. The body is the plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintPlan"

  /teams/{id}/blueprints/apply:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    post:
      operationId: applyBlueprint
      tags: [blueprints]
      summary: Apply a blueprint
      description: |
        Plans again and applies only the plan whose digest is the one sent.
        Each write needs its own permission: `tool:write` for an MCP server,
        `skill:write` for a skill, `agent:write` for an agent and its grants.
        Changed skills' files are stored first, then every row is written in
        one transaction, so a failure leaves nothing half-applied. MCP
        discovery is not run, and no secret is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueprintApply"
      responses:
        "200":
          description: Applied. Each change carries the id of the item it made or changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintApplied"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The team changed since the plan that was sent: the body is the new
            plan, and nothing was written. A plain-text 409 is a name taken
            while this was applying; plan again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintPlan"
            text/plain:
              schema:
                type: string
        "422":
          description: The plan has refusals, and nothing was written. The body is the plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintPlan"

  /teams/{id}/loops:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listLoops
      tags: [agents]
      summary: List the loops an agent may use
      description: |
        A read, so belonging to the team is enough. These are the loops the
        brain runs, sorted by name, and the only values an agent's `pattern`
        accepts. The list is short and always whole, so it takes no `limit`
        or `cursor` and never has a `next_cursor`.
      responses:
        "200":
          description: Every loop the brain runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoopPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/runs:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listTeamRuns
      tags: [runs]
      summary: List the team's runs
      description: |
        The team's run history, newest first. Only top-level runs are
        listed: a delegate's run belongs to the run that started it.

        A run is listed where its session is visible: every run in a `group`
        or `thread` session, and a `direct` session's runs only for its
        participant or a caller holding `session:read_all`. Hidden means
        absent; nothing says how many were left out.

        Each item is the run as `GET /teams/{id}/runs/{runID}` returns it.
        A value outside a filter's set is a 400, not an ignored filter. A
        cursor is only meaningful with the filters it was issued under.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          description: Only runs in one of these states. Repeat it for more than one.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RunStatus"
        - name: since
          in: query
          description: Only runs created at or after this time, in RFC 3339.
          schema:
            type: string
            format: date-time
            examples: ["2026-11-04T09:30:00Z"]
        - name: hub
          in: query
          description: |
            `true` for only the hub's runs, `false` for only those started
            for a named agent; absent for both.
          schema:
            type: boolean
        - name: builder
          in: query
          description: |
            `true` for only the team's builder's runs, which is how a client
            finds the builder conversations it can carry on; `false` for
            every other run; absent for both.
          schema:
            type: boolean
      responses:
        "200":
          description: A page of runs, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: startRun
      tags: [runs]
      summary: Start a run of an agent, or ask the team's hub
      description: |
        Requires `run:write` in this team. The run is recorded and queued
        before the reply, and a worker picks it up; follow it with
        `GET /teams/{id}/runs/{runID}/events`.

        With no `agent` the run is the team's hub's: the agent chosen in the
        team's settings, or the built-in orchestrator when none is. The
        orchestrator runs on the team's model, so with none set it is
        refused with a 409.

        With `builder` the run is the team's builder, on the team's model
        too: it reads the team and records proposals, and writes nothing.

        With no `session_id` the run gets a direct session of its own, owned
        by the caller. A named session must be one the caller can read: a
        `group` or `thread` session of this team, their own `direct` one, or
        any with `session:read_all`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "202":
          description: Queued, described as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: |
            The body breaks a rule, named in the sentence: no input, input
            over 100 KiB or holding a NUL character, or a body that is not
            the shape above. Nothing is written.
          content:
            text/plain:
              schema:
                type: string
                examples: ["input must be at most 100 KiB"]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            No agent in this team has that name, or the session is not one
            the caller can read. Neither repeats what was asked for, and
            nothing is written.
          content:
            text/plain:
              schema:
                type: string
                examples: ["no agent in this team has that name"]
        "409":
          description: |
            The run names no agent, the team chose no hub, and its settings
            have no model for the built-in orchestrator. Nothing is written.
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "the team has no model set, so its orchestrator cannot run; set one in the team's settings"

  /teams/{id}/runs/{runID}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/RunID"
    get:
      operationId: getRun
      tags: [runs]
      summary: Read a run
      description: |
        A run is visible exactly where its session is: someone else's direct
        run answers 404 unless the caller holds `session:read_all`.
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/runs/{runID}/events:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/RunID"
    get:
      operationId: streamRunEvents
      tags: [runs]
      summary: Follow what a run does
      description: |
        A server-sent event stream, visible where the run is. Each frame is
        one event the run recorded:

        ```text
        id: 3
        event: tool_call
        data: {"name": "search", ...}
        ```

        The `id` is the event's sequence within the run, so a client that
        reconnects sends it back as `Last-Event-ID` and misses nothing. Once
        the run has finished and its last event is sent, a final `end` frame
        carries its status, `data: {"status":"succeeded"}`, and the stream
        closes. A run cancelled before any worker took it has no events, and
        its stream is that one frame. A comment, `: keep-alive`, is sent
        every 15 seconds while nothing happens.

        A builder run also streams its reply as it is written: `text` frames,
        `data: {"text": "I propose…", "truncated": false}`, each a piece of
        the model's text in order, written before the tool call it led to.
        Joined, the pieces after the last `tool_result` are the run's output.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Resume after this sequence number. Wins over `after`.
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: after
          in: query
          required: false
          description: Resume after this sequence number, for a client that cannot set a header.
          schema:
            type: integer
            format: int32
            minimum: 0
      responses:
        "200":
          description: The stream, until the run ends or the client leaves
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/runs/{runID}/cancel:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/RunID"
    post:
      operationId: cancelRun
      tags: [runs]
      summary: Cancel a run
      description: |
        Requires `run:write` in this team, and the run must be visible to the
        caller. A queued run ends at once. A running one is marked, and its
        worker stops it at its next heartbeat, within 15 seconds; read the
        run, or its events, to see it finish.
      responses:
        "202":
          description: Cancelled, or asked to stop, described as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The run has already finished
          content:
            text/plain:
              schema:
                type: string
                examples: ["the run has already finished"]

  /teams/{id}/settings:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: getTeamSettings
      tags: [settings]
      summary: Read a team's settings
      description: |
        Any member may read them. A team that never saved reads the
        defaults: no model, search off, learning off, compaction at 100
        messages, the built-in orchestrator as its hub, and `updated_at`
        null. The search key is never returned; `search.key_set` says
        whether there is one.
      responses:
        "200":
          description: The settings, or the defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: saveTeamSettings
      tags: [settings]
      summary: Change a team's settings
      description: |
        Requires `team:settings` in this team. The whole set every time: a
        field left out is not a field left alone. A missing `model` means no
        model, the same as null, and a missing `hub` means the built-in
        orchestrator.

        The search key is the exception, because it cannot be read back to
        send again. Leave out `search.api_key` and the stored key is kept,
        provided the provider is unchanged; switching to another provider
        that takes a key needs a new one. A key sent is stored in the secret
        store, never in the database, and never returned.

        A self-hosted provider's URL whose host is an address rather than a
        name must be a public one, or within the deployment's
        `MCP_PRIVATE_NETWORKS`. A name is checked when the brain connects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamSettingsRequest"
      responses:
        "200":
          description: Saved, described as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamSettings"
        "400":
          description: |
            The body breaks a rule, named in the sentence by its field.
            Nothing is written, and no key reaches the secret store.
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "search.api_key is needed to switch to tavily"
                  - 'no agent in this team is named "triage"'
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: |
            The secret store is unreachable, so nothing was saved: settings
            naming a key the store does not hold would fail every search.
          content:
            text/plain:
              schema:
                type: string
                examples: ["the secret store is unavailable"]

  /teams/{id}/mcp-servers:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: listMCPServers
      tags: [mcp-servers]
      summary: List a team's MCP servers
      description: |
        A read, so belonging to the team is enough: granting a server to an
        agent starts with seeing which exist. A server holds references to
        secrets, never a secret, so there is nothing here to hide from a
        member.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Query"
      responses:
        "200":
          description: A page of servers, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServerPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: createMCPServer
      tags: [mcp-servers]
      summary: Register an MCP server
      description: |
        Requires `tool:write` in this team. Nothing connects to the server
        here: its tools are listed once discovery has run, and
        `discovered_at` says when that was.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPServerRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServer"
        "400":
          description: |
            The body breaks a rule: the name, both or neither transport, a
            url with a user, query or fragment, `env` on a url server or
            `auth_secret_ref` on a command one, or a value that is not a
            secret reference under this team's `mcp/` path. The sentence
            names the field and never repeats its value.
          content:
            text/plain:
              schema:
                type: string
                examples: ["env GITHUB_TOKEN is a secret reference, teams/<team_id>/mcp/<name>#<key>, not a secret"]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The team already has a server with that name, case-insensitively
          content:
            text/plain:
              schema:
                type: string
                examples: ["an MCP server with that name already exists"]

  /teams/{id}/mcp-servers/{serverID}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/ServerID"
    get:
      operationId: getMCPServer
      tags: [mcp-servers]
      summary: Read an MCP server
      description: |
        A server of another team answers 404, not 403: confirming the id
        exists would let anyone walk the uuid space.
      responses:
        "200":
          description: The server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateMCPServer
      tags: [mcp-servers]
      summary: Replace an MCP server
      description: |
        Requires `tool:write` in this team. Every field is replaced, so a
        field left out is cleared. Pointing the server somewhere else — a
        different url or command — clears `discovered_at` and the last
        attempt, `last_discovery_error` and `last_discovery_at`; the tools already
        listed stay until the next discovery replaces them, so an agent
        granted this server keeps what it had rather than losing every tool
        to an edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPServerRequest"
      responses:
        "200":
          description: Replaced, described as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServer"
        "400":
          description: |
            The body breaks a rule: the name, both or neither transport, a
            url with a user, query or fragment, `env` on a url server or
            `auth_secret_ref` on a command one, or a value that is not a
            secret reference under this team's `mcp/` path. The sentence
            names the field and never repeats its value.
          content:
            text/plain:
              schema:
                type: string
                examples: ["env GITHUB_TOKEN is a secret reference, teams/<team_id>/mcp/<name>#<key>, not a secret"]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another server in the team already has that name
          content:
            text/plain:
              schema:
                type: string
                examples: ["an MCP server with that name already exists"]

    delete:
      operationId: deleteMCPServer
      tags: [mcp-servers]
      summary: Delete an MCP server
      description: |
        Requires `tool:write` in this team. Its tools go with it. The secrets
        it referred to are not touched: they are the team's, and another
        server may name the same one.

        A server still granted to an agent is not deleted: removing it would
        change what that agent can do without anyone changing the agent.
        Revoke it from each agent first.
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An agent is still granted this server
          content:
            text/plain:
              schema:
                type: string
                examples: ["the MCP server is granted to an agent"]

  /teams/{id}/mcp-servers/{serverID}/tools:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/ServerID"
    get:
      operationId: listMCPTools
      tags: [mcp-servers]
      summary: List the tools a server offers
      description: |
        What the last discovery found, by name. Not paged: a server offers
        tens of tools, not thousands. Empty until discovery has run.
      responses:
        "200":
          description: The server's tools
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPToolList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/mcp-servers/{serverID}/discover:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/ServerID"
    post:
      operationId: discoverMCPServer
      tags: [mcp-servers]
      summary: Ask a server which tools it offers, and store them
      description: |
        Requires `tool:write` in this team. The brain connects to the server's
        url, sending `auth_secret_ref`'s secret as a bearer token over https,
        lists its tools within 15 seconds, and replaces the stored list in one
        step: new tools are added, changed ones rewritten, and ones the server
        no longer offers removed. Any failure leaves the previous list as it
        was, so an agent granted the server keeps what it had.

        Every attempt sets the server's `last_discovery_at`. A success clears
        `last_discovery_error`; a failure stores the sentence it was answered
        with, unless the server was edited meanwhile or the failure was the
        brain's own.

        The brain reaches public addresses only, plus the private ranges its
        operator lists in `OPENARITY_MCP_PRIVATE_NETWORKS`. Link-local
        addresses, where cloud metadata answers, are never reached. Redirects
        are not followed.

        No body is read.
      responses:
        "200":
          description: Discovered and stored; the tools as the server listed them
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPToolList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            A command server, which cannot be discovered until agents run in a
            sandbox; or the server was edited while it was being discovered,
            and nothing was stored.
          content:
            text/plain:
              schema:
                type: string
                examples: ["the server changed while it was being discovered; discover it again"]
        "422":
          description: |
            The brain will not use this server as it is: its address is one
            the brain may not reach, it redirected, its token would go over
            plain http, `auth_secret_ref` names a missing or empty secret, or
            what it offers cannot be stored — more than 500 tools, a name that
            is not usable, a description over 16 KiB, a schema over 64 KiB, or
            a NUL character. The address the brain resolved is logged, never
            returned.
          content:
            text/plain:
              schema:
                type: string
                examples: ["the server offers something that cannot be stored: search is offered twice"]
        "502":
          description: The server did not answer as an MCP server. The detail is logged.
          content:
            text/plain:
              schema:
                type: string
                examples: ["the server did not answer as an MCP server"]
        "504":
          description: The server did not finish answering within 15 seconds.
          content:
            text/plain:
              schema:
                type: string
                examples: ["the server did not answer in time"]

  /teams/{id}/mcp-secrets/{name}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: name
        in: path
        required: true
        description: The secret's name, the part before `#` in a reference such as `stripe#token`
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,128}$"
    put:
      operationId: putMCPSecret
      tags: [mcp-servers]
      summary: Write one of the team's MCP secrets
      description: |
        Writes `teams/{id}/mcp/{name}` in the secret store with exactly these
        keys, so a server or a blueprint names one as `{name}#{key}`. Every
        key the secret holds is written together, because a write replaces
        the keys it held. The values go to the secret store only: they are
        never returned, logged or readable through the API. Needs
        `tool:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPSecretWrite"
      responses:
        "204":
          description: Written
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          description: This brain does not write secrets; write it to the secret store yourself.
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: The secret store did not take the write. Nothing is known to be written.
          content:
            text/plain:
              schema:
                type: string
                examples: ["the secret store is unavailable"]

  /teams/{id}/summary:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: getTeamSummary
      tags: [teams]
      summary: The team at a glance
      description: |
        Counts for a team's home: the last day's runs by status, the
        conversations, the senders waiting to be let in, and the MCP servers
        whose last discovery failed.

        Each count obeys the rule of the list it summarises, so it never
        counts what the caller could not list. Runs and sessions follow the
        session rule: a `direct` session, and its runs, count only for its
        participant or a caller holding `session:read_all`.
        `waiting_senders` is null without `channel:read`.

        The counts are read in one statement, so they agree with each other.
        Lists carry no totals; this is where totals come from.
      responses:
        "200":
          description: The team's counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamSummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/graph:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: getTeamGraph
      tags: [graph]
      summary: The team's graph
      description: |
        The team's agents, toolkits, tools and skills, and the edges between
        them, as the graph index holds them now. Not as Postgres holds them:
        the graph catches up within about a minute of a change, and what is
        shown here is what selection will search.

        Vectors are not returned. `model` says which model embedded a node,
        and is absent for a node that carries no vector.

        Requires only membership. At most `limit` nodes are returned, and
        `truncated` says when there were more; an edge is returned only when
        both of its ends are.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2000
            default: 500
      responses:
        "200":
          description: The graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamGraph"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: |
            There is no graph to show: no embedding model is configured, so
            nothing is projected, or the graph store cannot be reached. The
            rest of the API does not depend on it.
          content:
            text/plain:
              schema:
                type: string
                examples: ["the graph is not enabled on this brain"]

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Find a user
      description: |
        Adding someone to a team needs their id, and an id is the one thing
        nobody can tell you over chat. This is where it is looked up.

        Requires `user:read` in at least one team, and super admins always.
        Not every authenticated caller: the directory is every subject and
        email the deployment has ever seen, and a filtered read of it is an
        existence oracle for anyone who can guess a username.

        The check is "somewhere" rather than "in this team", because the
        caller is looking someone up precisely to find out which team they
        should be in — there is no team to check against yet.

        `subject` narrows to an exact match. There is no prefix or substring
        search, deliberately: a directory that answers "who starts with s" is
        one someone walks.
      parameters:
        - name: subject
          in: query
          required: false
          description: |
            The identifier at the provider, matched exactly. An unknown one is
            an empty page, not a 404.
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        An OIDC access token, or the shared development token when
        OPENARITY_DEV_TOKEN is set. The scheme is matched case-insensitively.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: |
        Rows per page. A value above the maximum is clamped rather than
        refused; zero, a negative and anything unparseable are 400.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        An opaque position, taken verbatim from the `next_cursor` of the
        previous page. It is not constructible by a client, and one that has
        been altered is a 400 rather than a silent restart.
      schema:
        type: string

    Query:
      name: q
      in: query
      required: false
      description: |
        Only the rows whose name contains this, ignoring case. It is taken
        literally, so `%` and `_` are characters, not wildcards. Spaces around
        it are dropped, and an empty one lists everything. A cursor from a
        search goes on within the same search.
      schema:
        type: string
        maxLength: 200
        examples: [invoice]

    TeamID:
      name: id
      in: path
      required: true
      description: The team
      schema:
        type: string
        format: uuid

    ChannelID:
      name: channelID
      in: path
      required: true
      description: The channel
      schema:
        type: string
        format: uuid

    SkillID:
      name: skillID
      in: path
      required: true
      description: The skill
      schema:
        type: string
        format: uuid

    AgentID:
      name: agentID
      in: path
      required: true
      description: The agent
      schema:
        type: string
        format: uuid

    ServerID:
      name: serverID
      in: path
      required: true
      description: The MCP server
      schema:
        type: string
        format: uuid

    RunID:
      name: runID
      in: path
      required: true
      description: The run
      schema:
        type: string
        format: uuid

  responses:
    Unauthenticated:
      description: |
        No token, or one that no configured verifier accepts. Carries a
        `WWW-Authenticate: Bearer` header.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            examples: ["Bearer"]
      content:
        text/plain:
          schema:
            type: string
            examples: ["unauthorized"]

    Forbidden:
      description: |
        The token is valid; the caller may not do this. They should not be
        asked to authenticate again.
      content:
        text/plain:
          schema:
            type: string
            examples: ["forbidden"]

    NotFound:
      description: |
        No such resource, or none the caller may see. The two are
        indistinguishable on purpose.
      content:
        text/plain:
          schema:
            type: string
            examples: ["not found"]

    SourceNotASkill:
      description: |
        The source was fetched and is not a skill the brain will store:
        nothing is at that ref or address, `SKILL.md` is missing or breaks
        the specification, a limit is passed, or the download is too large.
        The sentence says which.
      content:
        text/plain:
          schema:
            type: string
            examples: ["not found: GitHub has no such repository or ref, or cannot show it without a token"]
    SourceUnavailable:
      description: |
        The source failed to answer usefully: it is down, answered an error,
        dropped the connection, or refused the brain's token or rate limit.
        Nothing was stored; trying again later may work.
      content:
        text/plain:
          schema:
            type: string
            examples: ["the source could not be reached: GitHub answered 503"]
    SourceTimedOut:
      description: The source did not finish answering within 30 seconds. Nothing was stored.
      content:
        text/plain:
          schema:
            type: string
            examples: ["the source did not answer within 30s"]
    BadRequest:
      description: |
        The request is malformed. The reply names the problem and never echoes
        the value back, because a body can carry a credential.
      content:
        text/plain:
          schema:
            type: string
            examples: ["id must be a uuid"]

  schemas:
    TeamPermissions:
      type: object
      additionalProperties: false
      required: [actions, super_admin]
      properties:
        actions:
          type: array
          description: |
            The permissions the caller's role grants in this team, sorted.
            Empty for a super admin who is not a member.
          items:
            type: string
          examples: [["agent:write", "skill:write", "tool:write"]]
        super_admin:
          type: boolean
          description: Holds every permission in every team, whatever the role

    TeamSummary:
      type: object
      required: [runs_24h, sessions, waiting_senders, servers_failing, agents]
      properties:
        runs_24h:
          $ref: "#/components/schemas/RunCounts"
        sessions:
          type: integer
          format: int64
          description: The sessions the caller can see, open or closed
        waiting_senders:
          type: integer
          format: int64
          nullable: true
          description: |
            The senders waiting to be let in, across every channel of the
            team. Null without `channel:read`: a caller who cannot list the
            queue is not told its length. Always sent.
        servers_failing:
          type: integer
          format: int64
          description: The MCP servers whose last discovery failed
        agents:
          type: integer
          format: int64
          description: The team's agents, as the agents list lists them

    RunCounts:
      type: object
      required: [queued, running, succeeded, failed, cancelled]
      description: |
        Top-level runs created in the last 24 hours, on the brain's clock, by
        status. A delegate's run is part of its parent's and is not counted.
        Every status is present, zero included.
      properties:
        queued:
          type: integer
          format: int64
        running:
          type: integer
          format: int64
        succeeded:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        cancelled:
          type: integer
          format: int64

    TeamGraph:
      type: object
      additionalProperties: false
      required: [nodes, edges, truncated]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"
        truncated:
          type: boolean
          description: More nodes exist than were returned

    GraphNode:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: string
          format: uuid
          description: The id of the row behind it; the team's own id for the team
        label:
          type: string
          enum: [Team, Agent, Toolkit, Tool, Skill]
          description: A Toolkit is an MCP server
        name:
          type: string
        description:
          type: string
        kind:
          type: string
          description: An agent's kind, or a toolkit's transport family
        model:
          type: string
          description: The model that embedded it; absent when it carries no vector

    GraphEdge:
      type: object
      additionalProperties: false
      required: [type, from, to]
      properties:
        type:
          type: string
          enum: [OWNS, GRANTED, CONTAINS, HAS_SKILL]
        from:
          type: string
          format: uuid
        to:
          type: string
          format: uuid
        only:
          type: array
          description: On GRANTED, the tools granted; absent when every tool is
          items:
            type: string

    AuthConfig:
      type: object
      required: [environment, dev_token_accepted]
      properties:
        environment:
          type: string
          description: |
            What this deployment considers itself. A client uses it to decide
            whether a shared token is even worth trying.
          enum: [development, staging, production, test]
        dev_token_accepted:
          type: boolean
          description: |
            True only when a development token is configured *and* the
            environment is development. The value is never published — a
            client sends the one it already holds in its own environment.
        oidc:
          $ref: "#/components/schemas/OIDCConfig"

    OIDCConfig:
      type: object
      required: [issuer, client_id]
      description: |
        Absent when no identity provider is configured, rather than present
        and blank: a client that branches on the key being there would
        otherwise build a discovery URL out of an empty issuer.
      properties:
        issuer:
          type: string
          description: |
            Served verbatim, trailing slash included. Discovery lives at
            `<issuer>/.well-known/openid-configuration`, and the device
            authorization endpoint is read from there rather than guessed.
          examples: ["http://localhost:9000/application/o/openarity/"]
        client_id:
          type: string
          description: |
            OPENARITY_OIDC_AUDIENCE. The brain checks it as an audience; a
            client sends it as a client id. Same value, two names, because
            each side calls it what its own specification calls it.

    Whoami:
      type: object
      required: [id, kind, subject, teams]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Always present: every principal is resolved to a row on first
            sight, a development token included. It is the caller's own id, so
            publishing it discloses nothing they did not already send.
        kind:
          type: string
          description: How the caller authenticated
          enum: [user, service, dev]
        issuer:
          type: string
          description: The identity provider that issued the token
        subject:
          type: string
          description: |
            The caller's stable identifier at that issuer. This is what
            OPENARITY_SUPER_ADMINS matches on.
        email:
          type: string
          format: email
          description: Absent when the provider released none
        teams:
          type: array
          description: Every team the caller belongs to, never a page
          items:
            $ref: "#/components/schemas/Membership"

    Membership:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          examples: ["admin"]

    Team:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
          examples: ["platform"]
        role:
          type: string
          description: |
            The caller's role in this team. Absent when they are not a member,
            which is the normal case for a super admin.
          examples: ["admin"]
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the team was deleted. Absent for a live team. Only a super
            admin ever sees a deleted team.
        purge_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When a deleted team is erased for good, `deleted_at` plus
            `TEAM_PURGE_AFTER`. Computed, never stored, so changing the setting
            moves every pending purge. Absent for a live team.

    Member:
      type: object
      required: [user_id, subject, role]
      properties:
        user_id:
          type: string
          format: uuid
        subject:
          type: string
          description: The member's identifier at their provider
        email:
          type: string
          format: email
          description: Absent when the provider released none
        role:
          type: string
          examples: ["member"]

    CreateTeamRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Trimmed before it is stored, and unique across teams. A name of
            only whitespace is a 400.

    AddMemberRequest:
      type: object
      required: [role]
      additionalProperties: false
      description: |
        Exactly one of `user_id` and `subject`. Neither is a 400, and so is
        both — guessing which the caller meant is how somebody ends up in a
        team they were never named for.

        `subject` exists so that adding a person you can name does not require
        permission to read the whole directory. It is the smaller authority,
        and it is the one this endpoint should need.

        The exactly-one rule is enforced by the service and stated here rather
        than written as a `oneOf`: oapi-codegen turns a top-level `oneOf` into
        a `json.RawMessage` union with a hand-rolled `MarshalJSON`, and every
        client then builds this body through generated accessors instead of a
        struct literal. Verified, not assumed.
      properties:
        user_id:
          type: string
          format: uuid
          description: |
            Unambiguous, and the only form that works when two providers issue
            the same subject. `GET /users` is where one comes from.
        subject:
          type: string
          description: |
            The identifier at the provider, matched exactly. Unique only per
            issuer, and rows survive a change of issuer, so this can match more
            than one person without a second provider ever being configured —
            that answers 409, never a guess.
          examples: ["alice"]
        role:
          type: string
          description: |
            Must name a row in `roles`. Ships with `admin` and `member`;
            deployments may add their own.
          examples: ["member"]

    TeamPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Team"
        next_cursor:
          type: string
          description: |
            Absent on the last page. Its absence is the only end-of-collection
            signal — there is no separate flag to disagree with it.

    MemberPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        next_cursor:
          type: string
          description: Absent on the last page

    Channel:
      type: object
      required: [id, team_id, provider, name, can_reply, takes_reply_url, can_notify, notify_strangers]
      properties:
        id:
          type: string
          format: uuid
          description: |
            The routing key in this channel's hook URL. Not a secret — what
            authenticates a webhook is its signature, never knowledge of the
            URL.
        team_id:
          type: string
          format: uuid
        provider:
          type: string
          description: |
            The adapter that parses this channel's webhooks, lower case and
            matched exactly: `custom` or `telegram`.
          examples: ["custom"]
        name:
          type: string
          description: Unique within the team, case-insensitively
          examples: ["support-tickets"]
        hook_url:
          type: string
          format: uri
          description: |
            The full address to give the provider: the brain's public
            webhook address, then `/hooks/<provider>/<id>` and the
            provider's route. Absent when the brain has no
            `WEBHOOK_PUBLIC_URL`, or no adapter for `provider` — never a
            guess at an address the provider might not reach.
          examples: ["https://hooks.example.com/hooks/custom/0192f5c4-7d1e-7c3a-9b2e-4f6a8d0c1e23"]
        can_reply:
          type: boolean
          description: |
            Whether this channel's provider sends replies at all.
        takes_reply_url:
          type: boolean
          description: |
            Whether replies go to an address the channel names. `custom`
            posts to `reply_url`; `telegram` replies in the chat a message
            came from and takes none. Offer `reply_url` only when this is
            true; it is refused otherwise.
        can_notify:
          type: boolean
          description: |
            Whether this channel's provider tells a sender nobody has let in
            that they are waiting, and later that they are in. `telegram`
            does; `custom` does not. Offer `notify_strangers` only when this
            is true; it is refused otherwise.
        notify_strangers:
          type: boolean
          description: |
            Whether this channel does. On by default where `can_notify`;
            always false where it is not. A sender is told once per wait,
            the first time they ask the bot (in a private chat, always; in a
            group, by naming it, replying to it or sending it a command),
            and told again when they are let in, if they were told they were
            waiting. Nothing they wrote is stored.
        reply_url:
          type: string
          format: uri
          description: |
            Where the team's replies to this channel's conversations are
            posted. Absent for a channel that does not reply.
          examples: ["https://support.example.com/openarity/replies"]

    CreatedChannel:
      allOf:
        - $ref: "#/components/schemas/Channel"
        - type: object
          required: [connected]
          properties:
            connected:
              type: boolean
              description: |
                Whether the brain pointed the provider at this channel itself,
                as it does for `telegram` (setWebhook) when it has a public
                https webhook address. False for `custom`, and for a brain with
                no such address: the person then points the provider at
                `hook_url` with `signing_secret`.
            warnings:
              type: array
              items:
                type: string
              description: |
                What the person should know about how the provider's account is
                set up, read when the channel was connected. The channel is made
                either way. A `telegram` bot whose privacy mode is on is sent, in
                a group, only commands to it and replies to it, so a message that
                only @mentions it never arrives; the warning says how to turn it
                off. Absent when there is nothing to say.
            signing_secret:
              type: string
              description: |
                Present only when the server generated it, and only in this
                response. It is never returned again by any endpoint.

                A real one is `oawh_` followed by 32 random bytes in
                base64url. The example below is deliberately not that shape:
                an example that looks like a live credential is one a secret
                scanner reports and a reader copies.
              examples: ["oawh_EXAMPLE-NOT-A-REAL-SECRET"]

    CreateChannelRequest:
      type: object
      required: [provider, name]
      properties:
        provider:
          type: string
          examples: ["custom"]
        name:
          type: string
          maxLength: 200
          examples: ["support-tickets"]
        signing_secret:
          type: string
          description: |
            The provider's own signing secret, when the provider issues one.
            Omit it to have the server generate a strong one and return it
            once.
        reply_url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            Where replies are posted, for a provider that posts them to an
            address (`takes_reply_url`); see `updateChannel` for what is
            accepted and what is sent.
          examples: ["https://support.example.com/openarity/replies"]
        credentials:
          type: object
          additionalProperties:
            type: string
          description: |
            What the provider asks a person for, and nothing else: for
            `telegram`, `bot_token`, the token @BotFather gave. The brain
            asks the provider about them before the channel exists, so a
            token it does not know is refused (400) and a provider out of
            reach is a 502. They go to the secret store with the signing
            secret, as one secret, and are never returned. A provider that
            asks for nothing refuses any.
          examples: [{"bot_token": "<token from @BotFather>"}]

    UpdateChannelRequest:
      type: object
      minProperties: 1
      properties:
        notify_strangers:
          type: boolean
          description: Whether the channel tells a sender nobody has let in that they are waiting, and that they are in
        reply_url:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: The URL replies go to; null or an empty string stops sending them

    ListedChannel:
      description: |
        A row of the channels list, with how recently it was used. Both facts
        count only the sessions the caller may open: their own direct
        sessions, and everyone's with `session:read_all`.
      allOf:
        - $ref: "#/components/schemas/Channel"
        - type: object
          required: [last_message_at, sessions_24h]
          properties:
            last_message_at:
              type: string
              format: date-time
              nullable: true
              description: The last message of its newest session; null for a channel never used
            sessions_24h:
              type: integer
              format: int64
              description: Its sessions with a message in the last 24 hours, on the brain's clock

    ChannelPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListedChannel"
        next_cursor:
          type: string
          description: Absent on the last page

    PendingSender:
      type: object
      required: [sender_ref, sender_name, seen_count, first_seen, last_seen]
      properties:
        sender_ref:
          type: string
          maxLength: 256
          description: |
            The provider's own id for this person, unique within the channel
            rather than globally — Slack's ids repeat across workspaces, which
            is why approval is per channel.
        sender_name:
          type: string
          maxLength: 64
          description: |
            What they call themselves, which they typed. Control characters
            are stripped and it is clipped on the way in, but two people may
            still share a name — that is the reason approval matches on
            `sender_ref` and shows this only as a hint.
        seen_count:
          type: integer
          format: int32
          description: How many messages they have sent that were dropped
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time

    PendingSenderPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PendingSender"
        next_cursor:
          type: string
          description: Absent on the last page

    TeamPendingSender:
      allOf:
        - $ref: "#/components/schemas/PendingSender"
        - type: object
          required: [channel_id, channel_name, channel_provider]
          properties:
            channel_id:
              type: string
              format: uuid
              description: The channel they wrote in on; approving them is done there.
            channel_name:
              type: string
            channel_provider:
              type: string
              examples: [slack]

    TeamPendingSenderPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TeamPendingSender"
        next_cursor:
          type: string
          description: Absent on the last page

    ChannelSender:
      type: object
      required: [sender_ref, user_id, created_at]
      properties:
        sender_ref:
          type: string
          maxLength: 256
        user_id:
          type: string
          format: uuid
          description: The user this sender speaks as
        created_at:
          type: string
          format: date-time
          description: When they were approved

    ChannelSenderPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChannelSender"
        next_cursor:
          type: string
          description: Absent on the last page

    ApproveSenderRequest:
      type: object
      required: [sender_ref, user_id]
      properties:
        sender_ref:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            Taken from the pending queue, or supplied directly when the
            provider id is already known.
        user_id:
          type: string
          format: uuid
          description: |
            Who this sender speaks as. Must already be a member of the
            channel's team.

    Session:
      type: object
      required: [id, kind, status, started_at, last_message_at]
      properties:
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The channel it arrived on, absent when it did not arrive on one —
            a session started from the dashboard or the API has no webhook
            behind it.
        provider_ref:
          type: string
          maxLength: 256
          description: |
            The adapter's answer to "which conversation is this", and the whole
            of session identity. What goes in it differs by platform and is the
            adapter's decision: a Slack thread is `C123:1699999999.000100`, a
            Slack direct message is `D01ABC`, WhatsApp is a phone number
            because there is nothing else, and a custom webhook sends whatever
            its own service calls an episode.
        user_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Who a `direct` session is with, and absent for anything else — a
            group names nobody on purpose, because several people speak in it.

            It is also absent on a direct session whose participant has since
            been deleted. That session is readable by `session:read_all` only:
            absent means nobody, never everybody.
        kind:
          type: string
          enum: [direct, group, thread]
          description: |
            How many people can speak, not what the provider calls the room.
            Slack's `mpim` looks like a direct message and is a group.

            It decides who may read the session: a `group` or `thread` is the
            team's, a `direct` is one person's.
        status:
          $ref: "#/components/schemas/SessionStatus"
          description: |
            Always `open` today; nothing closes a session yet. It exists
            because a provider gives you identity and never episode — a thread
            ends on its own, a direct message never does — so an idle rule is
            the only thing that can say where a conversation stopped.
        started_at:
          type: string
          format: date-time
        last_message_at:
          type: string
          format: date-time
          description: The order these are listed in
        first_asked:
          type: string
          nullable: true
          description: |
            The input of the oldest top-level run started in this session, cut
            to 140 characters as `last_message` is, and null when no run was
            started in it. A direct session started from the dashboard or the
            API has no `provider_ref`, so this is what names it. A delegate's
            run is work handed on, not a question asked, so it never counts.
            Sent by the lists and by a single session's read.
        channel_name:
          type: string
          nullable: true
          description: |
            The channel's name, and null with no channel. Sent by the two
            lists, null or not; absent from a single session's read.
        participant:
          type: string
          nullable: true
          description: |
            Who the session is with, as an email, else as the provider's
            subject: for a `direct` session its participant, for a group or a
            thread whoever sent the newest message. Null with no messages.
            Sent by the lists only.
        last_message:
          type: string
          nullable: true
          description: |
            The newest message's text, cut to 140 characters where a
            character starts and ended with `…` when it was cut. Null with no
            messages. It is a stranger's text, and is rendered as text. Sent by
            the lists only.
        latest_run_status:
          $ref: "#/components/schemas/RunStatus"
          description: |
            How the newest top-level run in this session stands, and null
            with no run. A delegate's run is part of its parent's, so it never
            counts here. Sent by the lists only.

    SessionStatus:
      type: string
      enum: [open, closed]

    SessionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        next_cursor:
          type: string
          description: Absent on the last page

    Message:
      type: object
      required: [id, external_id, user_id, text, received_at]
      properties:
        id:
          type: string
          format: uuid
        external_id:
          type: string
          description: |
            The provider's own id for this message, unique within its channel
            rather than globally. It is the idempotency key: a provider
            retrying a delivery produces no second row.
        user_id:
          type: string
          format: uuid
          description: The approved user this sender speaks as
        text:
          type: string
          description: |
            As the provider sent it. Never rewritten, so what arrived is still
            auditable after anything renders it.
        sent_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the sender says they sent it, absent whenever the provider did
            not say. A clock nobody here controls, so nothing orders on it.
        received_at:
          type: string
          format: date-time
          description: When it reached us. This is the order.

    MessagePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        next_cursor:
          type: string
          description: Absent on the last page

    Attachment:
      type: object
      required: [id, message_id, filename, media_type, size_bytes, created_at]
      properties:
        id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
          description: The message this file arrived with
        filename:
          type: string
          description: |
            What the sender called it, with directory components and control
            characters removed and the length bounded. A label, not a path, and
            possibly empty — some providers send no name at all.
        media_type:
          type: string
          description: |
            Decided from the bytes when the file arrived, never from the
            filename and never from what the sender claimed. This is the exact
            value the download route sends as Content-Type.
        size_bytes:
          type: integer
          format: int64
          description: Measured, not claimed
        created_at:
          type: string
          format: date-time

    AttachmentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        next_cursor:
          type: string
          description: Absent on the last page

    User:
      type: object
      required: [id, issuer, subject]
      properties:
        id:
          type: string
          format: uuid
        issuer:
          type: string
          description: |
            The identity provider that issued their token, from the `iss`
            claim. Identity is `(issuer, subject)`, so this is not decoration:
            it is the half that makes two rows with the same subject two
            different people. Without it a listing cannot be read.
          examples: ["https://auth.example.com/application/o/openarity/"]
        subject:
          type: string
          description: The identifier at their provider
          examples: ["akadmin"]
        email:
          type: string
          format: email
          description: Absent when the provider released none

    UserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_cursor:
          type: string
          description: Absent on the last page

    SkillSummary:
      type: object
      required: [id, team_id, name, description, source, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        name:
          type: string
          description: |
            The frontmatter's name: 1-64 lower-case letters, digits and single
            hyphens. Unique within the team.
          examples: ["pdf-processing"]
        description:
          type: string
          description: What the model reads when deciding whether to load it
          examples: ["Extract PDF text, fill forms, merge files. Use when handling PDFs."]
        source:
          type: string
          enum: [upload, github, url]
          description: Where the directory came from
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Skill:
      allOf:
        - $ref: "#/components/schemas/SkillSummary"
        - type: object
          required: [metadata, body, files]
          properties:
            license:
              type: string
              description: Absent when the frontmatter sets none
            compatibility:
              type: string
              description: Absent when the frontmatter sets none
            metadata:
              type: object
              additionalProperties:
                type: string
              description: The frontmatter's metadata; empty when it sets none
            allowed_tools:
              type: string
              description: Absent when the frontmatter sets none
            source_ref:
              type: string
              description: What was imported; absent for an upload
              examples: ["github:anthropics/skills/skills/pdf@main"]
            source_sha:
              type: string
              description: The exact commit or digest imported; absent for an upload
            body:
              type: string
              description: SKILL.md after its frontmatter, loaded only when the model asks for it
            files:
              type: array
              description: Every file beside SKILL.md, in path order
              items:
                $ref: "#/components/schemas/SkillFile"

    SkillFile:
      type: object
      required: [path, size, sha256, media_type]
      properties:
        path:
          type: string
          examples: ["scripts/fill.py"]
        size:
          type: integer
          format: int64
          description: Bytes
        sha256:
          type: string
          description: Hex, as sha256sum prints it
        media_type:
          type: string
          description: Sniffed from the bytes when uploaded, never from the name
          examples: ["text/plain; charset=utf-8"]

    SkillUpload:
      type: object
      required: [files]
      properties:
        files:
          type: array
          description: One part per file; each part's filename is its path in the skill
          items:
            type: string
            format: binary

    SkillImportRequest:
      type: object
      required: [source]
      additionalProperties: false
      properties:
        source:
          type: string
          description: A GitHub folder, or the https address of a zip
          examples:
            - "github:anthropics/skills/skills/pdf@main"
            - "https://hub.example.com/skills/pdf.zip"

    ListedSkill:
      description: A row of the skills list, with how many agents hold the skill.
      allOf:
        - $ref: "#/components/schemas/SkillSummary"
        - type: object
          required: [agent_count]
          properties:
            agent_count:
              type: integer
              format: int64
              description: The team's agents granted this skill; zero when none is

    SkillPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListedSkill"
        next_cursor:
          type: string
          description: Absent on the last page

    MCPServer:
      type: object
      required: [id, team_id, name, env, bare, created_at, updated_at]
      description: Exactly one of `url` and `command` is present.
      properties:
        id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        name:
          type: string
          description: |
            Unique within the team, case-insensitively. Each tool reaches the
            model as `<name>__<tool>`.
          examples: ["github"]
        url:
          type: string
          format: uri
          description: A remote server, spoken to over streamable HTTP
          examples: ["https://mcp.example.com/v1"]
        command:
          type: array
          items:
            type: string
          description: A local server, started with this argv and spoken to over stdio
          examples: [["npx", "-y", "@modelcontextprotocol/server-filesystem"]]
        env:
          type: object
          additionalProperties:
            type: string
          description: |
            Variables set for a command server, each a secret reference.
            Always an object; empty for a url server.
          examples: [{"GITHUB_TOKEN": "teams/<team_id>/mcp/github#token"}]
        auth_secret_ref:
          type: string
          description: |
            A url server's bearer token. A secret reference, `teams/<team_id>/mcp/<name>#<key>`, in this team. The brain reads the secret when it connects; the value is never stored or returned.
        bare:
          type: boolean
          description: Tools reach the model as `<tool>` rather than `<name>__<tool>`
        discovered_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When its tools were last listed, and null until then. Always sent;
            optional here only so a generated client decodes null as absent
            rather than as the zero time.
        last_discovery_error:
          type: string
          nullable: true
          description: |
            Why the last discovery failed, in the words the caller was
            answered with; null when it succeeded or none has run. A server
            has failed when this is set. A failure that was the brain's own,
            such as the secret store being down, is not recorded. Always sent.
        last_discovery_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When discovery was last tried, whether or not it worked, and null
            until then. Always sent; optional here for the reason
            `discovered_at` is.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MCPServerRequest:
      type: object
      required: [name]
      additionalProperties: false
      description: |
        Exactly one of `url` and `command`. Every value that is a credential
        is a secret reference rather than the secret, so none reaches the
        database.
      properties:
        name:
          type: string
          pattern: "^[a-zA-Z0-9_-]{1,64}$"
          examples: ["github"]
        url:
          type: string
          format: uri
          description: http or https, with no user, password, query string or fragment
          examples: ["https://mcp.example.com/v1"]
        command:
          type: array
          minItems: 1
          items:
            type: string
          description: The program and its arguments; the first is not empty
        env:
          type: object
          description: Only with `command`. Each key is a variable name and each value a secret reference.
          additionalProperties:
            type: string
            pattern: "^teams/[0-9a-f-]{36}/mcp/[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*#[A-Za-z0-9_-]+$"
          propertyNames:
            pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        auth_secret_ref:
          type: string
          pattern: "^teams/[0-9a-f-]{36}/mcp/[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*#[A-Za-z0-9_-]+$"
          description: Only with `url`. A secret reference, `teams/<team_id>/mcp/<name>#<key>`, in this team. The brain reads the secret when it connects; the value is never stored or returned.
          examples: ["teams/<team_id>/mcp/github#token"]
        bare:
          type: boolean
          default: false

    MCPServerPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MCPServer"
        next_cursor:
          type: string
          description: Absent on the last page

    MCPTool:
      type: object
      required: [name, description, input_schema]
      properties:
        name:
          type: string
          description: As the server names it, without the server's prefix
          examples: ["search_code"]
        description:
          type: string
        input_schema:
          type: object
          description: The JSON Schema of the tool's arguments, exactly as the server sent it

    MCPToolList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MCPTool"

    ModelRef:
      type: object
      required: [name, max_tokens]
      properties:
        name:
          type: string
          description: As the model gateway names it
          examples: ["anthropic/claude-opus-5"]
        max_tokens:
          type: integer
          format: int32
          minimum: 1
        temperature:
          type: number
          format: double
          minimum: 0
          maximum: 2

    ParserModel:
      type: object
      required: [name]
      description: Only with parser. max_tokens and temperature fall back to the SDK's defaults.
      properties:
        name:
          type: string
        max_tokens:
          type: integer
          format: int32
          minimum: 1
        temperature:
          type: number
          format: double
          minimum: 0
          maximum: 2

    OutputSchema:
      type: object
      required: [name, json]
      properties:
        name:
          type: string
          description: Names the schema to the model
          examples: ["verdict"]
        description:
          type: string
        json:
          type: object
          description: The JSON Schema the answer has to fit
        strict:
          type: boolean

    MCPServerGrant:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: An MCP server of the same team
        allow:
          type: array
          minItems: 1
          description: The tools granted, by their server-side names. Left out, every tool is granted.
          items:
            type: string
            pattern: "^[a-zA-Z0-9_-]{1,64}$"

    AgentSummary:
      type: object
      required: [id, team_id, name, description, kind, model, pattern, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        kind:
          type: string
          description: custom for agents a team defines; the brain's own agents carry other kinds
          examples: ["custom"]
        model:
          $ref: "#/components/schemas/ModelRef"
        pattern:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Agent:
      allOf:
        - $ref: "#/components/schemas/AgentSummary"
        - type: object
          required: [instructions, max_steps, steer_continuations, parser, mcp_servers, skills, delegation, delegates, web]
          properties:
            instructions:
              type: string
            max_steps:
              type: integer
              format: int32
            steer_continuations:
              type: integer
              format: int32
            output_schema:
              $ref: "#/components/schemas/OutputSchema"
            parser:
              type: boolean
            parser_model:
              $ref: "#/components/schemas/ParserModel"
            mcp_servers:
              type: array
              description: Ordered by id
              items:
                $ref: "#/components/schemas/MCPServerGrant"
            skills:
              type: array
              description: Ordered by id
              items:
                type: string
                format: uuid
            token_budget:
              type: integer
              format: int64
              description: |
                What one run of the agent may spend, input and output tokens
                together. Absent when the agent uses the deployment's default.
            delegation:
              $ref: "#/components/schemas/Delegation"
            delegates:
              type: array
              description: The agents it may delegate to when delegation is listed. Ordered by id
              items:
                type: string
                format: uuid
            web:
              type: boolean
              description: |
                Whether the agent has web_search and web_fetch when it runs as
                itself. The team's hub has both whatever this says.

    AgentRequest:
      type: object
      required: [name, model, pattern, max_steps]
      additionalProperties: false
      properties:
        kind:
          type: string
          description: Optional. custom on create; on replace, the kind the agent already has.
        name:
          type: string
          maxLength: 200
          description: Unique within the team, case-insensitively
          examples: ["triage"]
        description:
          type: string
          description: What it is for, shown where agents are chosen
        instructions:
          type: string
          description: The system prompt
          examples: ["You sort incoming issues."]
        model:
          $ref: "#/components/schemas/ModelRef"
        pattern:
          type: string
          description: |
            The loop the agent works through a task with. It must be one the
            brain runs — `GET /teams/{id}/loops` lists them — and any other is
            a 400 naming those it does run.
          examples: ["react"]
        max_steps:
          type: integer
          format: int32
          minimum: 1
        steer_continuations:
          type: integer
          format: int32
          minimum: 0
          description: How many times a run may carry on for a message that arrived as it finished
        output_schema:
          $ref: "#/components/schemas/OutputSchema"
        parser:
          type: boolean
          description: A second model fits the answer to output_schema; needs output_schema
        parser_model:
          $ref: "#/components/schemas/ParserModel"
        mcp_servers:
          type: array
          items:
            $ref: "#/components/schemas/MCPServerGrant"
        skills:
          type: array
          items:
            type: string
            format: uuid
        token_budget:
          type: integer
          format: int64
          minimum: 1
          maximum: 100000000
          description: |
            What one run of the agent may spend, input and output tokens
            together; a run that goes past it fails, naming the budget. Leave
            it out for the deployment's default, 1,000,000. A run keeps the
            budget it started with if the agent is edited while it runs.
          examples: [200000]
        delegation:
          $ref: "#/components/schemas/Delegation"
        delegates:
          type: array
          description: |
            Read only when delegation is listed, and refused otherwise. Agents
            of this team, by id, each once; never the agent itself.
          items:
            type: string
            format: uuid
        web:
          type: boolean
          default: false
          description: |
            Gives the agent web_search and web_fetch. The team's hub has both
            whatever this says. web_search also needs the team's search
            provider; web_fetch needs nothing. Left out, it is false, and a
            PUT replaces the whole agent, so a replace that leaves it out
            takes the grant away.

    Delegation:
      type: string
      enum: [team, listed, none]
      default: none
      description: |
        Whom the agent may hand work to with the delegate tool: any other
        agent in its team, only its delegates, or no one. An agent set to
        none is not given the tool. Left out of a request, it is none: the
        agent works alone, and a PUT replaces the whole agent.

    ListedAgent:
      description: |
        A row of the agents list: the summary, how the agent works with the
        web and with other agents, and what it is granted, as counts. The
        grants themselves are read from the agent.
      allOf:
        - $ref: "#/components/schemas/AgentSummary"
        - type: object
          required: [delegation, web, mcp_server_count, skill_count, delegate_count]
          properties:
            delegation:
              $ref: "#/components/schemas/Delegation"
            web:
              type: boolean
              description: Whether it has web_search and web_fetch by its own grant
            mcp_server_count:
              type: integer
              format: int64
              description: The MCP servers it is granted
            skill_count:
              type: integer
              format: int64
              description: The skills it is granted
            delegate_count:
              type: integer
              format: int64
              description: The agents it lists as delegates; read only when delegation is listed

    Blueprint:
      type: object
      additionalProperties: false
      description: |
        What a team should hold. Items refer to each other, and to the team's
        own, by name. At most 50 of each kind.
      properties:
        mcp_servers:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/BlueprintMCPServer"
        skills:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/BlueprintSkill"
        agents:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/BlueprintAgent"

    BlueprintMCPServer:
      type: object
      required: [name]
      additionalProperties: false
      description: An MCP server as the MCP server API takes it, with each secret reference relative to the team.
      properties:
        name:
          type: string
          pattern: "^[a-zA-Z0-9_-]{1,64}$"
        url:
          type: string
        command:
          type: array
          items:
            type: string
        env:
          type: object
          description: For a command server; each value a secret's name#key among the team's MCP secrets
          additionalProperties:
            type: string
        auth_secret:
          type: string
          description: For a url server; a secret's name#key among the team's MCP secrets, never the secret
          examples: ["helpdesk#token"]
        bare:
          type: boolean

    BlueprintSkill:
      type: object
      required: [files]
      additionalProperties: false
      description: A skill's files. Its SKILL.md names it.
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/BlueprintSkillFile"

    BlueprintSkillFile:
      type: object
      required: [path, data]
      additionalProperties: false
      properties:
        path:
          type: string
          examples: ["SKILL.md"]
        data:
          type: string
          format: byte
          description: The file's bytes, base64

    BlueprintAgent:
      type: object
      required: [name, model, pattern, max_steps]
      additionalProperties: false
      description: |
        An agent as the agents API takes it, except that its MCP servers,
        skills and delegates are named. Described whole: a field left out is
        its default, so leaving out skills takes its skills away.
      properties:
        kind:
          type: string
          description: Optional; custom. A blueprint describes custom agents only.
        name:
          type: string
          maxLength: 200
        description:
          type: string
        instructions:
          type: string
        model:
          $ref: "#/components/schemas/ModelRef"
        pattern:
          type: string
          examples: ["react"]
        max_steps:
          type: integer
          format: int32
          minimum: 1
        steer_continuations:
          type: integer
          format: int32
          minimum: 0
        output_schema:
          $ref: "#/components/schemas/OutputSchema"
        parser:
          type: boolean
        parser_model:
          $ref: "#/components/schemas/ParserModel"
        mcp_servers:
          type: array
          items:
            $ref: "#/components/schemas/BlueprintServerGrant"
        skills:
          type: array
          description: Skills by name, in this blueprint or already in the team
          items:
            type: string
        token_budget:
          type: integer
          format: int64
          minimum: 1
          maximum: 100000000
        delegation:
          $ref: "#/components/schemas/Delegation"
        delegates:
          type: array
          description: Agents by name, in this blueprint or already in the team
          items:
            type: string
        web:
          type: boolean

    BlueprintServerGrant:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: An MCP server in this blueprint or already in the team
        allow:
          type: array
          minItems: 1
          description: The tools granted. Left out, every tool is granted.
          items:
            type: string
            pattern: "^[a-zA-Z0-9_-]{1,64}$"

    BlueprintApply:
      type: object
      required: [blueprint, plan_digest]
      additionalProperties: false
      properties:
        blueprint:
          $ref: "#/components/schemas/Blueprint"
        plan_digest:
          type: string
          description: The digest of the plan that was shown
          examples: ["sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"]

    BlueprintChange:
      type: object
      required: [kind, name, action]
      properties:
        kind:
          type: string
          enum: [mcp_server, skill, agent]
        name:
          type: string
        action:
          type: string
          enum: [create, update, unchanged]
        fields:
          type: array
          description: What an update changes, by field name
          items:
            type: string
        id:
          type: string
          format: uuid
          description: The item's id, once it exists

    BlueprintRefusal:
      type: object
      required: [kind, name, message]
      properties:
        kind:
          type: string
          enum: [mcp_server, skill, agent]
        name:
          type: string
          description: The item's name, or "#n" for a skill whose files name none
        message:
          type: string

    Proposal:
      type: object
      required: [id, session_id, run_id, summary, state, created_at]
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
          description: The builder run that proposed it.
        summary:
          type: string
          description: What the proposal does, in the builder's words.
        state:
          type: string
          enum: [open, applied, superseded]
          description: |
            `open` until a person applies it or the builder proposes again in
            the same session, which supersedes it.
        created_at:
          type: string
          format: date-time
        applied_at:
          type: string
          format: date-time
          nullable: true
        blueprint:
          $ref: "#/components/schemas/Blueprint"
          description: Present when one proposal is read.
        plan:
          $ref: "#/components/schemas/BlueprintPlan"
          description: Present when one proposal is read.

    ProposalPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Proposal"
        next_cursor:
          type: string
          description: Absent on the last page

    ProposalApply:
      type: object
      required: [plan_digest]
      additionalProperties: false
      properties:
        plan_digest:
          type: string
          description: The digest of the plan read from the proposal.

    BlueprintPlan:
      type: object
      required: [changes, refusals, digest]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/BlueprintChange"
        refusals:
          type: array
          items:
            $ref: "#/components/schemas/BlueprintRefusal"
        digest:
          type: string
          description: Names this plan; send it to apply

    BlueprintApplied:
      type: object
      required: [changes, discovered]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/BlueprintChange"
        discovered:
          type: array
          description: |
            Each MCP server the apply created or changed, asked for its tools
            once the write committed, so an agent granted them can use them at
            once. A server that could not be asked says why; the apply stands.
          items:
            $ref: "#/components/schemas/BlueprintDiscovered"

    MCPSecretWrite:
      type: object
      required: [values]
      additionalProperties: false
      properties:
        values:
          type: object
          description: Each key and its value; 1 to 20 keys, each value up to 16 KiB
          minProperties: 1
          maxProperties: 20
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 16384

    BlueprintDiscovered:
      type: object
      required: [server, tools]
      properties:
        server:
          type: string
        tools:
          type: array
          items:
            type: string
        error:
          type: string
          description: Why the server has no tools yet, such as a secret not set; discover it again once fixed

    AgentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListedAgent"
        next_cursor:
          type: string
          description: Absent on the last page

    Loop:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The value an agent's `pattern` takes to use this loop
          examples: ["react"]

    LoopPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Loop"

    TeamSettings:
      type: object
      required: [search, learning, compaction_messages]
      description: |
        `model`, `hub` and `updated_at` are always sent, null when unset;
        optional here only so a generated client decodes null as absent
        rather than as a zero value.
      properties:
        model:
          $ref: "#/components/schemas/ModelRef"
          nullable: true
          description: The model the team's built-in agents run on. Null until chosen, and until then they do not run.
        search:
          $ref: "#/components/schemas/SearchSettings"
        learning:
          type: boolean
          description: Whether the learner writes learnings after each run, for approval
        compaction_messages:
          type: integer
          format: int32
          minimum: 10
          maximum: 10000
          description: Messages before a transcript compacts. Stored now; compaction reads it from a later release.
        hub:
          $ref: "#/components/schemas/HubRef"
          nullable: true
          description: |
            The agent that answers a run started for the team rather than
            for an agent. Null for the built-in orchestrator, which it is
            again when the chosen agent is deleted.
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Null for a team that never saved

    HubRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: ["triage"]

    SearchSettings:
      type: object
      required: [provider, key_set]
      properties:
        provider:
          $ref: "#/components/schemas/SearchProvider"
        url:
          type: string
          nullable: true
          description: The self-hosted instance's address, for searxng and firecrawl-oss; null for every other provider
          examples: ["http://searxng:8080"]
        key_set:
          type: boolean
          description: Whether a key is stored. The key itself is never returned.

    SearchProvider:
      type: string
      enum: [none, searxng, brave, tavily, firecrawl-cloud, firecrawl-oss]
      description: |
        `searxng` and `firecrawl-oss` are self-hosted and take a `url`;
        `brave`, `tavily` and `firecrawl-cloud` take a key and no url.
        `firecrawl-oss` takes a key only if the instance requires one.

    TeamSettingsRequest:
      type: object
      additionalProperties: false
      required: [search, learning, compaction_messages]
      properties:
        model:
          $ref: "#/components/schemas/ModelRef"
          nullable: true
          description: Null or absent for no model, which stops the built-in agents running.
        search:
          $ref: "#/components/schemas/SearchSettingsRequest"
        learning:
          type: boolean
        compaction_messages:
          type: integer
          format: int32
          minimum: 10
          maximum: 10000
        hub:
          type: string
          nullable: true
          description: |
            The name of an agent in this team, ignoring case. Null or absent
            for the built-in orchestrator.
          examples: ["triage"]

    SearchSettingsRequest:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider:
          $ref: "#/components/schemas/SearchProvider"
        url:
          type: string
          description: Required for searxng and firecrawl-oss, refused for every other provider
        api_key:
          type: string
          writeOnly: true
          maxLength: 4096
          description: |
            The provider's key: required for brave, tavily and firecrawl-cloud,
            optional for firecrawl-oss, refused for none and searxng. Omit it
            to keep the stored one while the provider is unchanged. For
            firecrawl-oss an empty string removes the stored key; for the
            others it is refused.

    RunRequest:
      type: object
      required: [input]
      additionalProperties: false
      properties:
        agent:
          type: string
          description: The name of an agent in this team. Absent or empty asks the team's hub.
          examples: ["triage"]
        input:
          type: string
          maxLength: 102400
          description: What the agent is asked to do. At most 100 KiB, with no NUL character.
          examples: ["Sort the issues opened today."]
        session_id:
          type: string
          format: uuid
          description: |
            The conversation the run belongs to. Leave it out and the run gets
            a direct session of its own.
        builder:
          type: boolean
          description: |
            Start the team's builder rather than an agent or the hub. It reads
            the team and proposes blueprints, and writes nothing; refused with
            `agent`. A builder run reads its earlier turns in the session.

    RunStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
      description: |
        Where a run stands. `queued` and `running` are live; the other three
        are final.

    Run:
      type: object
      required:
        - id
        - session_id
        - agent
        - status
        - input
        - input_tokens
        - output_tokens
        - created_at
        - depth
        - hub
        - builder
        - delegates
        - reply
      properties:
        reply:
          $ref: "#/components/schemas/Reply"
          nullable: true
          description: |
            What became of the run's answer to the channel conversation it
            came from; null for a run that answers none, such as one started
            from the dashboard or a delegate's.
        parent_run_id:
          type: string
          format: uuid
          nullable: true
          description: The run that delegated this one; null for a run a person started
        depth:
          type: integer
          format: int32
          description: 0 for a run a person started, one more for each delegation beneath it
        builder:
          type: boolean
          description: Whether the run is the team's builder, which proposes and writes nothing.
        hub:
          type: boolean
          description: |
            Whether the run was started for the team rather than for an
            agent. Its `agent` is the hub's name: the chosen agent's, or
            `orchestrator`.
        delegates:
          type: array
          items:
            type: string
          description: |
            The agents a top-level run handed work to directly, by name, each
            once, in the order it first did; empty when it handed none.
            Always empty on a delegate's own run, whose delegates are in its
            parent's trace. A run that is still going may add more.
          examples: [["log-reader", "billing"]]
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        agent:
          type: string
          description: The agent's name when the run started, kept if it is later renamed or deleted
        status:
          $ref: "#/components/schemas/RunStatus"
        input:
          type: string
        output:
          type: string
          nullable: true
          description: The agent's answer, null until it succeeds
        error:
          type: string
          nullable: true
          description: Why it failed, null unless it did
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
          description: When a worker first took it, null while queued
        finished_at:
          type: string
          format: date-time
          nullable: true

    Reply:
      type: object
      description: |
        A run's reply to its channel, as the outbox holds it. It is sent in
        order within its conversation and retried for about two and a half
        hours before it is given up.
      required: [kind, status, attempts, last_error, sent_at, next_attempt_at]
      properties:
        kind:
          type: string
          description: |
            `answer`, or `apology` when the run failed or answered nothing; an
            apology never carries the error.
          examples: ["answer"]
        status:
          type: string
          description: |
            `pending` until the channel takes it, then `sent`; `failed` once it
            is given up, because the channel has no reply URL or every attempt
            failed.
          examples: ["sent"]
        attempts:
          type: integer
          format: int32
          description: How many times it was tried; 0 before the first
        last_error:
          type: string
          nullable: true
          description: Why the last attempt failed, null when none has
          examples: ["the reply URL answered 503"]
        sent_at:
          type: string
          format: date-time
          nullable: true
          description: When the channel took it, null until it has
        next_attempt_at:
          type: string
          format: date-time
          nullable: true
          description: When a pending reply is tried next; null once it is sent or given up

    RunPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        next_cursor:
          type: string
          description: Absent on the last page
