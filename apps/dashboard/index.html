<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Vite rewrites this to /ui/favicon.svg, because base is "/ui/". That
         prefix is what makes a file safe to use here at all: an icon at the
         root would be an unmatched path, and an unmatched path reaches the
         authentication middleware before it reaches the router — so the miss
         is a 401 in the console on every page load rather than a quiet 404.

         public/favicon.svg is a copy of assets/favicon.svg; Vite's publicDir
         cannot reach outside the app. favicon.test.ts fails when they drift. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Openarity</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
