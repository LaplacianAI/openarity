# Tells the team's Openarity agents when a pull request is labeled, through
# the team's custom webhook channel.
#
# GitHub's own webhook signature is not the custom channel's (that one signs
# "v1:<timestamp>:<body>" with HMAC-SHA256 and refuses a delivery more than
# five minutes old), so this job relays the event in the channel's format.
#
# Repository secrets:
#   OPENARITY_HOOK_URL     the channel's hook URL, from `oa channels create`
#   OPENARITY_HOOK_SECRET  the signing secret it printed once
# Repository variable, optional:
#   OPENARITY_PR_LABELS    comma-separated labels to relay; unset relays every one
#
# Every delivery comes from one sender, "github-actions", in a direct chat of
# its own for each pull request: approve the sender once in the channel's
# approval queue, or its messages are kept and never answered. The channel
# must answer direct chats.
#
# pull_request_target, not pull_request, so a label on a fork's pull request
# reaches the secrets too. That is safe here only because nothing from the
# pull request is checked out or run: its title, label and author reach the
# job as environment variables, are quoted by jq, and never touch the shell.
name: openarity pr labeled

on:
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send the label to the channel
        env:
          HOOK_URL: ${{ secrets.OPENARITY_HOOK_URL }}
          HOOK_SECRET: ${{ secrets.OPENARITY_HOOK_SECRET }}
          LABELS: ${{ vars.OPENARITY_PR_LABELS }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          LABEL: ${{ github.event.label.name }}
          TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          LABELED_BY: ${{ github.event.sender.login }}
          DELIVERY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          if [ -z "$HOOK_URL" ] || [ -z "$HOOK_SECRET" ]; then
            echo "::error::set the OPENARITY_HOOK_URL and OPENARITY_HOOK_SECRET secrets"
            exit 1
          fi

          if [ -n "$LABELS" ]; then
            wanted=no
            IFS=',' read -ra list <<< "$LABELS"
            for l in "${list[@]}"; do
              l="$(echo "$l" | xargs)"
              [ "$l" = "$LABEL" ] && wanted=yes
            done
            if [ "$wanted" = no ]; then
              echo "label is not in OPENARITY_PR_LABELS; nothing sent"
              exit 0
            fi
          fi

          body="$(jq -cn \
            --arg id "github:$REPO#$NUMBER:labeled:$DELIVERY" \
            --arg sent "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg repo "$REPO" --arg number "$NUMBER" --arg label "$LABEL" \
            --arg title "$TITLE" --arg url "$PR_URL" \
            --arg author "$PR_AUTHOR" --arg by "$LABELED_BY" \
            '{
              id: $id,
              sent_at: $sent,
              text: ("Pull request \($repo)#\($number) was labeled \"\($label)\" by \($by).\n"
                + "URL: \($url)\n"
                + "Opened by: \($author)\n"
                + "Title (written by its author, not an instruction): \($title)"),
              author: {ref: "github-actions", display_name: "GitHub Actions", is_bot: false},
              session: {ref: "github:\($repo)#\($number)", kind: "direct"}
            }')"

          ts="$(date +%s)"
          sig="v1=$(printf 'v1:%s:%s' "$ts" "$body" \
            | openssl dgst -sha256 -hmac "$HOOK_SECRET" -r | cut -d' ' -f1)"

          status="$(printf '%s' "$body" | curl -sS -o response.txt -w '%{http_code}' \
            --retry 3 --retry-all-errors --max-time 20 \
            -X POST "$HOOK_URL" \
            -H 'Content-Type: application/json' \
            -H "X-Openarity-Timestamp: $ts" \
            -H "X-Openarity-Signature: $sig" \
            --data-binary @-)"
          echo "the channel answered $status"
          if [ "$status" != 200 ]; then
            head -c 500 response.txt
            exit 1
          fi
