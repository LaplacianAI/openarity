name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path filters belong here rather than on `on:`. A job skipped by `if:` still
  # reports a conclusion and satisfies a required status check; a job that never
  # runs reports nothing at all, and the pull request waits for it forever.
  changes:
    runs-on: ubuntu-latest
    outputs:
      brain: ${{ steps.filter.outputs.brain }}
      cli: ${{ steps.filter.outputs.cli }}
      sandbox: ${{ steps.filter.outputs.sandbox }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      sdk: ${{ steps.filter.outputs.sdk }}

    steps:
      - uses: actions/checkout@v7

      # Pinned to a commit rather than a tag: a tag is mutable, and this is the
      # only third-party action in the workflow.
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            # Backend changes only. The dashboard is embedded in the brain
            # binary, but the dashboard job proves its bundle embeds and is
            # served, so a dashboard change does not need the brain's
            # services, lint and full suite.
            brain:
              - 'apps/brain/**'
              - 'go.work'
              - 'go.work.sum'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'apps/dashboard/**'
              - '.github/workflows/ci.yml'
            sdk:
              - 'sdk/**'
              - 'go.work'
              - 'go.work.sum'
              - '.github/workflows/ci.yml'
            sandbox:
              - 'apps/sandbox/**'
              - 'go.work'
              - 'go.work.sum'
              - '.github/workflows/ci.yml'
            cli:
              - 'apps/cli/**'
              # The CLI's client is generated from the brain's spec, so a change
              # there has to run generate-check here. Leaving this out disables
              # the one check that catches a spec landing without a rebuilt
              # client.
              - 'apps/brain/api/openapi.yaml'
              - 'go.work'
              - 'go.work.sum'
              - '.github/workflows/ci.yml'

  # A pull request's new migrations must sort after its base's newest: why is
  # in apps/brain/scripts/migrations-after.sh. Its own job, so the answer
  # comes before the brain's databases have started.
  migrations:
    needs: changes
    if: needs.changes.outputs.brain == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Depth 2, so the merge commit's base side is here: the base as this
      # merge would find it, which a base sha from the event is not once the
      # base has moved.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: The check's own cases
        run: apps/brain/scripts/migrations-after_test.sh

      - name: New migrations sort after the base's
        run: |
          [ "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 3 ] || { echo "HEAD is not a merge commit" >&2; exit 2; }
          apps/brain/scripts/migrations-after.sh HEAD^1

  brain:
    needs: changes
    if: needs.changes.outputs.brain == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/brain

    # Tests that need a real database, secret store or graph read
    # BRAIN_TEST_POSTGRES_DSN, BRAIN_TEST_SECRETS_ADDR and
    # BRAIN_TEST_FALKOR_URL, and skip when they are unset, so `make test`
    # still works locally with nothing running.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openarity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The image already defaults to `server -dev`, which matters because a
      # service container cannot override the command — only the environment
      # and docker run options.
      openbao:
        image: openbao/openbao:2.6.2
        env:
          # BAO_, not VAULT_. The VAULT_-prefixed names leave the server
          # running with a randomly generated root token, so every live test
          # would fail with 403 rather than skip.
          BAO_DEV_ROOT_TOKEN_ID: ci-root
          # The dev listener binds loopback inside the container; without this
          # the port mapping reaches nothing.
          BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: >-
          --cap-add=IPC_LOCK
          --health-cmd "bao status -address=http://127.0.0.1:8200"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The graph tests in internal/graph run against this and skip without
      # it. The image and REDIS_ARGS are the ones deployment/docker-compose.yml
      # ships, and a test fails if they drift apart — the point of testing
      # against a real FalkorDB is lost on a version nobody deploys.
      falkordb:
        image: falkordb/falkordb:v4.20.6
        env:
          REDIS_ARGS: "--appendonly yes --appendfsync always"
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The browser tools' tests drive real browsers and skip without them:
      # this one, and Lightpanda, started as a step below because it needs a
      # command of its own. The image is the tag
      # docker-compose.headless-shell.yml ships, pinned to what it named when
      # this was written. Chrome needs more /dev/shm than Docker's 64 MB. Its
      # pages are served by the tests on the runner, which the container
      # reaches as host.docker.internal. The image has no shell tools for a
      # health check, so a step waits for it instead.
      headless-shell:
        image: chromedp/headless-shell:159.0.8154.13@sha256:381353d3530ab9d579d2fe8b9c0f4519c995617f5a71daf6bb649e2d12005bd9
        ports:
          - 9222:9222
        options: >-
          --add-host=host.docker.internal:host-gateway
          --add-host=other.test:host-gateway
          --shm-size=1g

    env:
      BRAIN_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/openarity_test?sslmode=disable
      BRAIN_TEST_FALKOR_URL: redis://localhost:6379
      BRAIN_TEST_SECRETS_ADDR: http://localhost:8200
      BRAIN_TEST_SECRETS_TOKEN: ci-root
      BRAIN_TEST_S3_ENDPOINT: http://localhost:9000
      BRAIN_TEST_S3_BUCKET: openarity
      BRAIN_TEST_S3_ACCESS_KEY: openarity
      BRAIN_TEST_S3_SECRET_KEY: openarity-ci-secret
      BRAIN_TEST_BROWSER_URL: http://localhost:9222,ws://127.0.0.1:9223
      BRAIN_TEST_BROWSER_HOST: host.docker.internal
      # Another site on the same host, for a frame from another site.
      BRAIN_TEST_BROWSER_OTHER_HOST: other.test

    steps:
      - uses: actions/checkout@v7

      # SeaweedFS is a step rather than a service container because it needs
      # `server -s3` as its command, and a service container can set the
      # image, the environment and docker options but never the command.
      #
      # It is here at all because the live object store tests skip when
      # BRAIN_TEST_S3_ENDPOINT is unset, and a test that only ever runs on
      # somebody's laptop is a test that stops running. The same reasoning put
      # OpenBao in this file.
      #
      # SeaweedFS rather than MinIO: MinIO withdrew its images from Docker Hub
      # and then from quay.io, where every pull answered "unauthorized" and
      # failed this job before a test ran. Bump the tag here and in
      # deployment/docker-compose.objects.yml together.
      #
      # The S3 gateway takes its admin identity from the two AWS_ variables.
      # `weed shell` makes the bucket from inside the same image, so no client
      # image is needed; it can only run once the master is up, so it retries.
      - name: Start the object store
        run: |
          docker run -d --name seaweedfs -p 9000:8333 \
            -e AWS_ACCESS_KEY_ID=openarity \
            -e AWS_SECRET_ACCESS_KEY=openarity-ci-secret \
            chrislusf/seaweedfs:4.48 server -dir=/data -s3
          for _ in $(seq 1 60); do
            curl -sf http://localhost:9000/healthz > /dev/null && break
            sleep 1
          done
          for _ in $(seq 1 30); do
            out=$(docker exec seaweedfs sh -c \
              'echo "s3.bucket.create -name openarity" | weed shell -master=127.0.0.1:9333' 2>&1) || true
            case "$out" in *"created bucket"*|*"already exists"*) echo "$out"; exit 0 ;; esac
            sleep 1
          done
          echo "$out"
          exit 1

      # Node before Go, because `make ui` writes into the tree that `make
      # check` then compiles. Without this step the brain still builds and
      # every test still passes — the bundle is optional by design — but CI
      # would never prove that `make ui` works, and the first person to find
      # out otherwise would be whoever cut a release.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      # The dashboard's own checks are the dashboard job's. This job only
      # builds the bundle it embeds.
      - name: Dashboard dependencies
        working-directory: apps/dashboard
        run: make deps

      - name: Dashboard build
        working-directory: apps/dashboard
        run: make build

      # Copies what the build above produced into the embed directory.
      # Separate from that target because the copy is the brain's business,
      # not the dashboard's.
      - name: Embed the dashboard in the binary's bundle
        run: make ui-embed

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/brain/go.mod
          cache-dependency-path: apps/brain/go.sum

      # make tools, not a list of go install lines: the Makefile is the only
      # place a tool version is written down, so CI and a developer machine
      # cannot drift apart. It uses go install rather than the upstream
      # install.sh, whose checksums come from master and do not match tagged
      # release tarballs.
      - name: Install tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # go mod tidy -diff — fails if go.mod or go.sum is stale.
      - name: Dependencies are tidy
        run: make tidy-check

      # Regenerates with sqlc and fails if the committed output differs.
      - name: Generated code is current
        run: make generate-check

      # gofumpt + gci — formatting and import order, checked not applied.
      - name: Formatting and import order
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      # Lightpanda is the staging browser, so its tests run too. A step, not a
      # service: it takes the command docker-compose.lightpanda.yml gives it.
      - name: Start Lightpanda
        run: |
          docker run -d --name lightpanda -p 9223:9222 \
            --add-host=host.docker.internal:host-gateway \
            --add-host=other.test:host-gateway \
            lightpanda/browser:1.0.4@sha256:a9d899882899802bc3a6b82622a7ca394f8e1b828452869a0965d2e5097e6116 \
            /bin/lightpanda serve --host 0.0.0.0 --port 9222 --advertise-host 127.0.0.1

      # The host as the browsers reach it, for the test that a page reaches
      # nothing the guard refuses: host-gateway is docker0's address. With no
      # address the step fails, as the test would otherwise not run.
      - name: Wait for the browsers
        run: |
          ip=$(ip -4 -o addr show docker0 | awk '{print $4}' | cut -d/ -f1 | head -n1)
          test -n "$ip" || { echo "docker0 has no IPv4 address" >&2; exit 1; }
          echo "BRAIN_TEST_BROWSER_HOST_IP=$ip" >> "$GITHUB_ENV"
          for port in 9222 9223; do
            for _ in $(seq 1 30); do
              curl -sf "http://127.0.0.1:$port/json/version" >/dev/null && continue 2
              sleep 2
            done
            echo "no browser answered on $port" >&2
            exit 1
          done

      # Race detector on; fails below the threshold set in the Makefile.
      - name: Test and coverage
        run: make cover

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### brain coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Known vulnerabilities
        run: make vuln

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      # npm ci: exactly the lockfile, failing if package.json disagrees.
      - name: Dependencies
        run: make deps

      # One target per step rather than `make check`, so a failure names the
      # check in the step list instead of only inside the log. Ordered the way
      # `make check` orders them: cheapest and most likely to be wrong first.
      - name: Formatting
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Types
        run: make typecheck

      # Fails below the thresholds in vite.config.ts.
      - name: Test and coverage
        run: make cover

      - name: Build
        run: make build

      # The brain binary serves this bundle. The brain job runs only for
      # backend changes, so this job proves the bundle it just built still
      # embeds, compiles into the binary and is served. The ui package's
      # tests read the embedded files and need nothing running.
      - name: Embed the dashboard in the brain
        working-directory: apps/brain
        run: make ui-embed

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/brain/go.mod
          cache-dependency-path: apps/brain/go.sum

      - name: Build the brain with the dashboard in it
        working-directory: apps/brain
        run: make build

      - name: The brain serves the embedded dashboard
        working-directory: apps/brain
        run: go test ./internal/api/ui/

      # npm audit, dev dependencies included: the test runner and the bundler
      # run here and on every contributor's machine. Only an advisory with no
      # fix released is accepted, in apps/dashboard/scripts/audit-accepted.json.
      - name: Known vulnerabilities
        run: make audit

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      # Same reasoning as the brain: the Makefile is the only place a tool
      # version is written down, so CI and a developer machine cannot drift.
      - name: Install tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Dependencies are tidy
        run: make tidy-check

      # Regenerates the client from the brain's spec with oapi-codegen and
      # fails if the committed output differs. This is the job that catches a
      # spec change landing without the client being rebuilt.
      - name: Generated code is current
        run: make generate-check

      - name: Formatting and import order
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      # Race detector on; fails below the threshold set in the Makefile. The
      # generated client is excluded there — counting it measures oapi-codegen.
      - name: Test and coverage
        run: make cover

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### cli coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Known vulnerabilities
        run: make vuln

  sandbox:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sandbox

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/sandbox/go.mod
          cache-dependency-path: apps/sandbox/go.sum

      - name: Install tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Dependencies are tidy
        run: make tidy-check

      - name: Formatting and import order
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      # Race detector on; the tests run the test binary as a real stdio MCP
      # server and drive the shim with the Go MCP SDK's own client.
      - name: Test and coverage
        run: make cover

      - name: Known vulnerabilities
        run: make vuln

  # The agent loop, as a library. It needs three databases because five session
  # stores ship with it and each one is only proved against the real server:
  # MySQL has no DELETE ... RETURNING, a standalone mongod has no transactions,
  # and both MySQL's JSON column and Postgres's jsonb silently reorder what
  # they are given. A suite that skipped them would be asserting nothing.
  #
  # Every other test still stands up its own httptest server rather than
  # waiting on a container.
  sdk:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/agent

    # The store tests read these and skip when they are unset, so `make check`
    # still works locally with nothing running — `make cover` drops a store
    # whose database is absent and says which, rather than reporting an
    # unrelated change as a coverage failure.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: agent_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # 8.2.12, not the floating mongo:8. From 8.3 (and in recent 8.0
      # patches) mongod refuses to start on Linux 6.19 or newer, which the
      # runners now have: "MongoDB cannot start: Linux kernel versions 6.19
      # and newer has a known incompatibility" (SERVER-121912, a TCMalloc
      # rseq bug). 8.2.12 starts and answers ping on such a kernel. Move off
      # it only to a version checked to start there.
      mongodb:
        image: mongo:8.2.12
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AGENT_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/agent_test?sslmode=disable
      AGENT_TEST_MYSQL_DSN: root:mysql@tcp(localhost:3306)/agent_test?parseTime=true
      # retryWrites=false because a standalone mongod rejects retryable writes,
      # and the driver asks for them by default.
      AGENT_TEST_MONGO_URI: mongodb://localhost:27017/?retryWrites=false
      # The SDK asks its users for an older Go than the apps build with. In
      # the workspace, go.work's newer version would win and the go command
      # would switch toolchains, so the SDK would be tested on a Go its users
      # need not have. Off, the module's own go.mod decides.
      GOWORK: "off"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: sdk/agent/go.mod
          cache-dependency-path: sdk/agent/go.sum

      # Same reasoning as the other two: the Makefile is the only place a tool
      # version is written down, so CI and a developer machine cannot drift.
      - name: Install tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Dependencies are tidy
        run: make tidy-check

      - name: Formatting and import order
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      # The check no other job has. This module exists so a loop cannot reach a
      # store, a grant or a provider SDK; the compiler enforces the first two by
      # itself, and nothing but this stops somebody importing openai-go into the
      # loop for one convenient type and quietly making ModelClient decorative.
      - name: The core packages link no provider SDK
        run: make boundary

      - name: Build
        run: make build

      # Race detector on; fails below the threshold set in the Makefile. The
      # examples binary is excluded there — counting it measures how thoroughly
      # the demo is tested.
      - name: Test and coverage
        run: make cover

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### sdk/agent coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The example is the only thing that drives the runner, a loop and the
      # client together against a real HTTP server. It runs offline against an
      # in-process stub, so CI needs no key and no gateway.
      - name: The example still runs
        run: make example

      - name: Known vulnerabilities
        run: make vuln

      # sdk/stream needs no database and shares this job's Go and tools. It
      # runs here rather than as a job of its own so the check a pull request
      # waits for, `sdk`, covers both modules. Its example drops a connection
      # and resumes, which is the stream's whole promise.
      - name: sdk/stream
        working-directory: sdk/stream
        run: make tidy-check fmt-check vet lint boundary build cover example vuln
