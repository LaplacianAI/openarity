name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path filters belong here rather than on `on:`. A job skipped by `if:` still
  # reports a conclusion and satisfies a required status check; a job that never
  # runs reports nothing at all, and the pull request waits for it forever.
  changes:
    runs-on: ubuntu-latest
    outputs:
      brain: ${{ steps.filter.outputs.brain }}
      cli: ${{ steps.filter.outputs.cli }}

    steps:
      - uses: actions/checkout@v7

      # Pinned to a commit rather than a tag: a tag is mutable, and this is the
      # only third-party action in the workflow.
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            brain:
              - 'apps/brain/**'
              - 'go.work'
              - 'go.work.sum'
              - '.github/workflows/ci.yml'
            cli:
              - 'apps/cli/**'
              # The CLI's client is generated from the brain's spec, so a change
              # there has to run generate-check here. Leaving this out disables
              # the one check that catches a spec landing without a rebuilt
              # client.
              - 'apps/brain/api/openapi.yaml'
              - 'go.work'
              - 'go.work.sum'
              - '.github/workflows/ci.yml'

  brain:
    needs: changes
    if: needs.changes.outputs.brain == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/brain

    # Tests that need a real database or a real secret store read
    # BRAIN_TEST_POSTGRES_DSN and BRAIN_TEST_SECRETS_ADDR, and skip when they
    # are unset, so `make test` still works locally with nothing running.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openarity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The image already defaults to `server -dev`, which matters because a
      # service container cannot override the command — only the environment
      # and docker run options.
      openbao:
        image: openbao/openbao:2.6.2
        env:
          # BAO_, not VAULT_. The VAULT_-prefixed names leave the server
          # running with a randomly generated root token, so every live test
          # would fail with 403 rather than skip.
          BAO_DEV_ROOT_TOKEN_ID: ci-root
          # The dev listener binds loopback inside the container; without this
          # the port mapping reaches nothing.
          BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: >-
          --cap-add=IPC_LOCK
          --health-cmd "bao status -address=http://127.0.0.1:8200"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BRAIN_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/openarity_test?sslmode=disable
      BRAIN_TEST_SECRETS_ADDR: http://localhost:8200
      BRAIN_TEST_SECRETS_TOKEN: ci-root

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/brain/go.mod
          cache-dependency-path: apps/brain/go.sum

      # make tools, not a list of go install lines: the Makefile is the only
      # place a tool version is written down, so CI and a developer machine
      # cannot drift apart. It uses go install rather than the upstream
      # install.sh, whose checksums come from master and do not match tagged
      # release tarballs.
      - name: Install tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # go mod tidy -diff — fails if go.mod or go.sum is stale.
      - name: Dependencies are tidy
        run: make tidy-check

      # Regenerates with sqlc and fails if the committed output differs.
      - name: Generated code is current
        run: make generate-check

      # gofumpt + gci — formatting and import order, checked not applied.
      - name: Formatting and import order
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      # Race detector on; fails below the threshold set in the Makefile.
      - name: Test and coverage
        run: make cover

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### brain coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Known vulnerabilities
        run: make vuln

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      # Same reasoning as the brain: the Makefile is the only place a tool
      # version is written down, so CI and a developer machine cannot drift.
      - name: Install tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Dependencies are tidy
        run: make tidy-check

      # Regenerates the client from the brain's spec with oapi-codegen and
      # fails if the committed output differs. This is the job that catches a
      # spec change landing without the client being rebuilt.
      - name: Generated code is current
        run: make generate-check

      - name: Formatting and import order
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      # Race detector on; fails below the threshold set in the Makefile. The
      # generated client is excluded there — counting it measures oapi-codegen.
      - name: Test and coverage
        run: make cover

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### cli coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Known vulnerabilities
        run: make vuln
