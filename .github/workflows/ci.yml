name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  brain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/brain
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/brain/go.mod
          cache-dependency-path: apps/brain/go.sum

      # go install rather than the upstream install.sh: that script serves
      # checksums from master which do not match tagged release tarballs.
      - name: Install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # go mod tidy -diff — fails if go.mod or go.sum is stale.
      - name: Dependencies are tidy
        run: make tidy-check

      # gofumpt + gci — formatting and import order, checked not applied.
      - name: Formatting and import order
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      # Race detector on; fails below the threshold set in the Makefile.
      - name: Test and coverage
        run: make cover

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### brain coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Known vulnerabilities
        run: make vuln
