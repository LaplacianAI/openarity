# Publishes the brain as a container image, so running Openarity does not
# require a Go toolchain. It builds and pushes; it deploys nothing and knows
# about no environment.
name: image

on:
  push:
    branches: [main]
    paths:
      - 'apps/brain/**'
      - 'apps/dashboard/**'
      - 'deployment/Dockerfile'
      - 'deployment/Dockerfile.dockerignore'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:

# `paths:` on the trigger is safe here in a way it is not in ci.yml: nothing
# waits on this job's conclusion, so a run that never happens blocks nothing.

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The published image is the one nobody builds by hand, so it is the one
      # that must never ship the "dashboard not built" page. The Dockerfile
      # copies apps/brain, and `make ui` is what puts the bundle inside it.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Build the dashboard into the binary's bundle
        working-directory: apps/brain
        run: make ui

      # Every third-party action is pinned to a commit. A tag is mutable, and
      # this workflow holds a token that can write packages.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Scoped to this run and expires with it. No personal access token
          # is stored anywhere.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/openarity-brain
          # `latest` is the newest build of main. The sha tag is what makes a
          # deployment reproducible and a rollback possible, since latest will
          # have moved on. Which of them anything follows is not decided here.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          # The repository root: the Dockerfile copies apps/brain, so a context
          # of deployment/ cannot see it.
          context: .
          file: deployment/Dockerfile
          # Apple Silicon, Raspberry Pis and ARM cloud instances are most of
          # self-hosting now, and an amd64-only image simply does not start on
          # any of them. The Dockerfile cross-compiles rather than emulating,
          # so the second architecture costs a compile, not a QEMU run.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without this the Go module download runs on every push.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo '### published'
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
