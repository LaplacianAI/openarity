name: release

# A tag is the only trigger. Nothing here runs on a branch: these artifacts
# are what `oa stack setup` downloads by version, so publishing one that no
# tag points at would leave a binary nobody can ask for.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Every platform openarity claims to run on, built in parallel. windows/arm64
  # is deliberately absent: no Postgres binaries are published for it, so an
  # ARM Windows install runs the amd64 build under emulation and needs no
  # native artifact of its own.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The dashboard is compiled into the brain, so it has to exist before
      # the brain is built. Built here rather than downloaded from a prep job
      # because it is a two-second Vite build and an artifact round trip costs
      # more than repeating it.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Build the dashboard
        working-directory: apps/dashboard
        run: make deps build

      - name: Embed the dashboard
        working-directory: apps/brain
        run: make ui-embed

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/brain/go.mod

      # -trimpath so the binary carries no build-machine paths, and the
      # version stamped from the tag rather than from a file somebody has to
      # remember to bump.
      - name: Build brain and oa
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi

          (cd apps/brain && go build -trimpath -ldflags "-s -w" \
            -o "../../dist/brain_${GOOS}_${GOARCH}${suffix}" ./cmd/brain)
          (cd apps/cli && go build -trimpath -ldflags "-s -w" \
            -o "../../dist/oa_${GOOS}_${GOARCH}${suffix}" ./cmd/oa)

      # dex publishes no binaries and never has — every release from v2.41.0
      # carries zero assets — and it cannot be imported as a library either:
      # its module declares github.com/dexidp/dex while tagging v2.45.1, with
      # no /v2 suffix, so Go refuses the tagged versions outright. Building it
      # here is the only way a personal install can have one.
      #
      # CGO_ENABLED=0 is what makes cross-compilation possible, and it is why
      # the personal install uses Postgres storage: dex's sqlite backend is a
      # stub under that build and says so when opened.
      - name: Read the pinned dex version
        id: dex
        run: |
          version=$(grep -oE 'DexVersion *= *"[^"]+"' apps/cli/internal/stack/sources.go | grep -oE 'v[0-9.]+')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build dex
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi

          git clone --depth 1 --branch "${{ steps.dex.outputs.version }}" \
            https://github.com/dexidp/dex.git /tmp/dex
          (cd /tmp/dex && go build -trimpath -ldflags "-s -w" \
            -o "$GITHUB_WORKSPACE/dist/dex_${GOOS}_${GOARCH}${suffix}" ./cmd/dex)

          # Apache 2.0 requires the licence travel with the binary.
          cp /tmp/dex/LICENSE "dist/dex_LICENSE.txt"

      # One .sha256 per artifact, not a single checksums.txt: the downloader
      # fetches <url>.sha256 for each file it wants, so a combined file would
      # mean parsing a manifest to verify one binary.
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          for f in *; do
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error


  # The desktop installer, which is what a personal install is actually for.
  #
  # Built on the platform it is for rather than cross-compiled: Tauri packages
  # with the host's own tooling — hdiutil for a .dmg, WiX for an .msi, dpkg-deb
  # for a .deb — and none of that runs anywhere else. That is why this is a
  # second job with a matrix of runners rather than four more entries above.
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            triple: aarch64-apple-darwin
          - os: macos-13
            goos: darwin
            goarch: amd64
            triple: x86_64-apple-darwin
          - os: windows-latest
            goos: windows
            goarch: amd64
            triple: x86_64-pc-windows-msvc
          # The oldest glibc the .deb should demand. Building on a newer
          # runner would produce a package that refuses to install on the
          # distributions people actually run a home server on.
          - os: ubuntu-22.04
            goos: linux
            goarch: amd64
            triple: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/installer/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      # Tauri v2 needs 1.77 or newer; stable is well past that.
      - uses: dtolnay/rust-toolchain@stable

      # What Tauri draws with on Linux, and none of it is on the runner.
      - name: Linux bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install the frontend dependencies
        working-directory: apps/installer
        run: npm ci

      # Only icon.png is committed — the rest are derived from it and
      # gitignored, so tauri build would fail here on a missing .icns.
      - name: Generate the icon set
        working-directory: apps/installer
        run: npx tauri icon src-tauri/icons/icon.png

      # The dashboard is compiled into the brain, which the bundle ships.
      - name: Build the dashboard
        working-directory: apps/dashboard
        run: make deps build

      - name: Embed the dashboard
        working-directory: apps/brain
        run: make ui-embed

      # The bundle ships oa, brain and dex, and setup is pointed at them with
      # --bin-dir. Carrying them is what makes the installer work at all: there
      # is nothing to download them from until a release exists, and even then
      # a desktop installer that needs the network for its own parts is worse
      # than one that does not. Postgres is still fetched.
      #
      # Tauri resolves a sidecar by appending the target triple, so the names
      # are not decorative.
      - name: Build dex for the bundle
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          root="$PWD"
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi

          version=$(grep -oE 'DexVersion *= *"[^"]+"' apps/cli/internal/stack/sources.go | grep -oE 'v[0-9.]+')
          git clone --depth 1 --branch "$version" https://github.com/dexidp/dex.git "$RUNNER_TEMP/dex-src"

          mkdir -p apps/installer/src-tauri/binaries
          (cd "$RUNNER_TEMP/dex-src" && GOWORK=off go build -trimpath -ldflags "-s -w" \
            -o "$root/apps/installer/src-tauri/binaries/dex-${{ matrix.triple }}$suffix" ./cmd/dex)

      - name: Stage the sidecars
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          root="$PWD"
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          into="$root/apps/installer/src-tauri/binaries"

          mkdir -p "$into"
          (cd apps/cli && go build -trimpath -ldflags "-s -w" \
            -o "$into/oa-${{ matrix.triple }}$suffix" ./cmd/oa)
          (cd apps/brain && go build -trimpath -ldflags "-s -w" \
            -o "$into/brain-${{ matrix.triple }}$suffix" ./cmd/brain)

      - name: Bundle
        working-directory: apps/installer
        run: npx tauri build

      # Renamed on the way out. Tauri names a bundle after the application and
      # its version; a release holding four of those cannot be told apart by
      # the platform they run on, which is the only thing a person choosing
      # one cares about.
      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p dist

          found=0
          while IFS= read -r -d '' f; do
            cp "$f" "dist/openarity-installer_${{ matrix.goos }}_${{ matrix.goarch }}.${f##*.}"
            found=$((found + 1))
          done < <(find apps/installer/src-tauri/target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.deb' \) -print0)

          test "$found" -gt 0 || { echo "tauri build produced no bundle"; exit 1; }
          ls -la dist

      # sha256sum is coreutils and is not on macOS; shasum is Perl and is on
      # all three. Same output format either way.
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sum() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
          for f in *; do
            case "$f" in *.sha256) continue ;; esac
            sum "$f" > "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: [build, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The release is a draft. Nothing downloads from a draft, which means a
      # botched run can be deleted before anyone's `oa stack setup` has tried
      # to fetch from it — publishing is a deliberate click.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "${{ github.ref_name }}" \
            --notes "Binaries for brain, oa and dex, and the desktop installer.

          The installer is the way in for a personal install: open it and it
          does the rest. **The bundles are not signed** — macOS will say the
          application cannot be checked for malicious software, and Windows
          SmartScreen will warn — until there is a Developer ID certificate
          and a Windows code-signing certificate to build with.

          dex is built from the upstream source at the tag pinned in
          apps/cli/internal/stack/sources.go, with CGO disabled. It is
          licensed Apache 2.0; see dex_LICENSE.txt." \
            dist/*
