name: Bug report
description: Something behaves differently from how it is documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here — see
        [SECURITY.md](https://github.com/LaplacianAI/openarity/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what the result was.
      placeholder: |
        Ran `brain migrate up` against a fresh database and it hung for 30s
        before failing with "context deadline exceeded".
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
      placeholder: |
        1. `docker run --rm -p 5432:5432 -e POSTGRES_PASSWORD=postgres postgres:18`
        2. `cd apps/brain && go run ./cmd/brain migrate up`
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: >-
        Paste the relevant output. It is rendered as a code block, so no
        backticks needed. Redact anything sensitive.
      render: text

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD`, or a release tag.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Go version, Postgres version.
      placeholder: macOS 15.1, go1.26.5, Postgres 18
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is not a security vulnerability
          required: true
